<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-HH/J0ETvgnKG2hZC/1IA3T4UxvCD8Fiph5CQDCWB0Cc='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=layout" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Layout · orOS</title>

  <link rel="stylesheet" href="layout.css?v=5.03.00">

</head>
<body>

  <!-- ===== Home: the document list ===== -->
  <section id="home">
    <header class="bar">
      <div class="title">
        <span class="title-main" data-i18n="app.name">Layout</span>
        <span class="title-sub" id="home-sub"></span>
      </div>
      <span class="spacer"></span>
      <button type="button" class="btn ghost" id="btn-recipes" data-i18n="home.recipes">Automations</button>
      <button type="button" class="btn ghost" id="btn-import" data-i18n="home.import">Open file</button>
      <button type="button" class="btn primary" id="btn-new" data-i18n="home.new">New document</button>
    </header>
    <div class="home-tools" id="home-tools" hidden>
      <input type="search" id="home-search" autocomplete="off" spellcheck="false">
    </div>
    <div id="docs" class="docs"></div>
    <div id="home-empty" class="empty" hidden>
      <p class="empty-title" data-i18n="home.empty.title">No documents yet</p>
      <p class="empty-sub" data-i18n="home.empty.sub">Flyers, newsletters, posters, cards, booklets: start with a page size.</p>
      <button type="button" class="btn primary" id="btn-new2" data-i18n="home.new">New document</button>
    </div>
  </section>

  <!-- ===== Editor ===== -->
  <section id="editor" hidden>
    <header class="bar" id="ed-bar">
      <button type="button" class="icon-btn" id="ed-back"></button>
      <button type="button" class="doc-name" id="ed-name"></button>
      <span class="spacer"></span>
      <div class="bar-group" id="ed-actions">
        <button type="button" class="icon-btn" id="ed-undo"></button>
        <button type="button" class="icon-btn" id="ed-redo"></button>
        <span class="sep"></span>
        <button type="button" class="icon-btn" id="ed-zout"></button>
        <button type="button" class="zoom-lbl" id="ed-zoom"></button>
        <button type="button" class="icon-btn" id="ed-zin"></button>
        <span class="sep"></span>
        <button type="button" class="icon-btn" id="ed-preview"></button>
        <button type="button" class="icon-btn" id="ed-panel"></button>
        <button type="button" class="icon-btn" id="ed-more"></button>
        <button type="button" class="btn primary small" id="ed-export" data-i18n="ed.export">Export</button>
      </div>
    </header>

    <div id="work">
      <nav id="tools" role="toolbar"></nav>
      <div id="stage">
        <canvas id="cv"></canvas>
        <div id="master-banner" class="banner" hidden>
          <span id="master-banner-txt"></span>
          <button type="button" class="btn small" id="master-done" data-i18n="ms.done">Done</button>
        </div>
        <div id="thread-banner" class="banner" hidden>
          <span data-i18n="thread.hint">Click a text frame or an empty spot on a page to continue the text there.</span>
          <button type="button" class="btn small" id="thread-cancel" data-i18n="btn.cancel">Cancel</button>
        </div>
      </div>
      <aside id="side">
        <div id="side-tabs" role="tablist"></div>
        <div id="side-body"></div>
      </aside>
      <section id="story" hidden>
        <header class="story-head">
          <span class="story-title" id="story-title"></span>
          <span class="spacer"></span>
          <button type="button" class="icon-btn" id="story-close"></button>
        </header>
        <div class="story-tools" id="story-tools"></div>
        <div id="story-ed" class="story-ed" contenteditable="true" spellcheck="true"></div>
        <footer class="story-foot" id="story-foot"></footer>
      </section>
    </div>

    <footer id="status">
      <span id="st-page"></span>
      <span class="spacer"></span>
      <button type="button" class="st-warn" id="st-overset" hidden></button>
      <button type="button" class="st-pf" id="st-pf"><span class="pf-dot"></span><span id="st-pf-txt"></span></button>
      <span id="st-sel"></span>
    </footer>
  </section>

  <div id="menu" class="menu" role="menu" hidden></div>
  <dialog id="dlg" class="dlg"></dialog>
  <div id="loading" class="loading"><span data-i18n="loading">Loading fonts…</span></div>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="../i18n.js?v=5.03.00" data-app="layout,designkit,recipes"></script>
  <script src="../designkit/model.js?v=5.03.00"></script>
  <script src="../designkit/text.js?v=5.03.00"></script>
  <script src="../designkit/fonts.js?v=5.03.00"></script>
  <script src="../designkit/render.js?v=5.03.00"></script>
  <script src="../designkit/pdf.js?v=5.03.00"></script>
  <script src="../designkit/assets.js?v=5.03.00"></script>
  <script src="../designkit/templates.js?v=5.03.00"></script>
  <script src="../designkit/blend.js?v=5.03.00"></script>
  <script src="../designkit/cover.js?v=5.03.00"></script>
  <script src="../files/files-core.js?v=5.03.00"></script>
  <script src="../designkit/docstore.js?v=5.03.00"></script>
  <script src="../designkit/zipin.js?v=5.03.00"></script>
  <script src="layout.js?v=5.03.00"></script>
  <script src="blend.js?v=5.03.00"></script>
  <script src="editor.js?v=5.03.00"></script>
  <script src="panels.js?v=5.03.00"></script>
  <script src="fontpick.js?v=5.03.00"></script>
  <script src="story.js?v=5.03.00"></script>
  <script src="caret.js?v=5.03.00"></script>
  <script src="inframe.js?v=5.03.00"></script>
  <script src="sla.js?v=5.03.00"></script>
  <script src="idml.js?v=5.03.00"></script>
  <script src="pdfin.js?v=5.03.00"></script>
  <script src="linefit.js?v=5.03.00"></script>
  <script src="rebuild.js?v=5.03.00"></script>
  <script src="svgin.js?v=5.03.00"></script>
  <script src="../bundle.js?v=5.03.00"></script>
  <script src="io.js?v=5.03.00"></script>
  <script src="house.js?v=5.03.00"></script>
  <script src="intake.js?v=5.03.00"></script>
  <script src="autolay.js?v=5.03.00"></script>
  <script src="houseui.js?v=5.03.00"></script>
  <script src="merge.js?v=5.03.00"></script>
  <script src="mergeui.js?v=5.03.00"></script>
  <script src="cover.js?v=5.03.00"></script>
  <script src="../recipes/core.js?v=5.03.00"></script>
  <script src="../recipes/share.js?v=5.03.00"></script>
  <script src="../recipes/ui.js?v=5.03.00"></script>
  <script src="recipesteps.js?v=5.03.00"></script>
  <script src="recipes.js?v=5.03.00"></script>
  <script src="commands.js?v=5.03.00"></script>
  <script src="assist.js?v=5.03.00"></script>

</body>
</html>
