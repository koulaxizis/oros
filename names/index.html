<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-mSeELei9S8PcxmMW5rD8s+2WIu7FEW9tyue5RkSFxGQ='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=names" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Name Generator · orOS</title>

  <link rel="stylesheet" href="names.css?v=5.02.00">

</head>
<body>

  <header id="toolbar">
    <div class="title">
      <span class="title-main" data-i18n="app.name">Name Generator</span>
      <span id="title-sub" class="title-sub"></span>
    </div>
  </header>

  <main id="main">
    <!-- Modes, options and the batch -->
    <section id="gen">
      <div id="tabs" role="tablist"></div>

      <div class="opts">
        <div class="opt">
          <h2 id="words-lbl" data-i18n="sec.words">Words</h2>
          <div id="words" class="chips" role="radiogroup" aria-labelledby="words-lbl"></div>
        </div>
        <div class="opt" id="style-sec">
          <h2 id="style-lbl" data-i18n="sec.style">Style</h2>
          <div id="styles" class="chips" role="group" aria-labelledby="style-lbl"></div>
        </div>
      </div>

      <button type="button" id="gen-btn" class="gen-btn"></button>

      <ul id="list" role="tabpanel"></ul>
    </section>

    <!-- Favourites (synced) -->
    <aside id="panel">
      <div class="sec-head">
        <h2 data-i18n="fav.title">Favourites</h2>
        <span id="fav-count" class="count"></span>
        <span class="spacer"></span>
        <button type="button" class="link-btn" id="copy-all" data-i18n="fav.copyAll" hidden>Copy all</button>
      </div>
      <p id="fav-empty" class="hint" data-i18n="fav.empty"></p>
      <div id="favs"></div>
    </aside>
  </main>

  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="../i18n.js?v=5.02.00" data-app="names"></script>
  <script src="words.js?v=5.02.00"></script>
  <script src="names.js?v=5.02.00"></script>

</body>
</html>
