<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sudoku · orOS</title>

  <link rel="stylesheet" href="sudoku.css?v=0.58.01">

</head>
<body>

  <!-- Toolbar: one line on a wide screen, two scrolling strips on a phone -->
  <header id="toolbar">
    <div class="tb-row" id="tb-a">
      <div class="seg" id="lv-seg" role="group">
        <button type="button" class="seg-btn" data-lv="e" data-i18n="lv.e">Easy</button>
        <button type="button" class="seg-btn" data-lv="m" data-i18n="lv.m">Medium</button>
        <button type="button" class="seg-btn" data-lv="h" data-i18n="lv.h">Hard</button>
        <button type="button" class="seg-btn" data-lv="x" data-i18n="lv.x">Expert</button>
      </div>
    </div>
    <div class="tb-row" id="tb-b">
      <span class="spacer"></span>
      <button type="button" class="icon-btn" id="opts-btn"></button>
      <button type="button" class="icon-btn" id="new-btn"></button>
      <button type="button" class="icon-btn" id="stats-btn"></button>
      <button type="button" class="icon-btn" id="sfx-btn" aria-pressed="false"></button>
    </div>
  </header>

  <!-- Status: time, message, best time -->
  <div id="status">
    <span class="stat"><span data-i18n="st.time">Time</span><strong id="time">0:00</strong></span>
    <span id="turn" aria-live="polite"></span>
    <span class="stat"><strong id="best">–</strong><span data-i18n="st.best">Best</span></span>
  </div>

  <main id="board-wrap">
    <div id="play">
      <div id="board" tabindex="0"></div>
      <div id="pad">
        <div id="digits" role="group"></div>
        <div id="tools" role="group"></div>
      </div>
    </div>
  </main>

  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="sudoku.js?v=0.58.01"></script>

</body>
</html>
