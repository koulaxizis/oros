<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && !/[?&]standalone\b/.test(location.search)) location.replace("../?open=time" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Time · orOS</title>

  <link rel="stylesheet" href="time.css?v=1.52.00">
  <link rel="stylesheet" href="stage-view.css?v=1.52.00">

</head>
<body>
  <main id="tmain">

    <!-- ===== Big clock ===== -->
    <section>
      <div id="face-digital">
        <span id="big-hm">--:--</span><span id="big-ss"></span>
      </div>
      <div id="face-analog" hidden></div>
      <div id="face-binary" hidden></div>
      <div id="face-flip" hidden></div>
      <div id="face-neon" hidden></div>
      <div id="face-sub"></div>
      <div id="style-row">
        <button id="sty-0" class="sty" type="button" data-i18n="sty.digital"></button>
        <button id="sty-1" class="sty" type="button" data-i18n="sty.analog"></button>
        <button id="sty-2" class="sty" type="button" data-i18n="sty.binary"></button>
        <button id="sty-3" class="sty" type="button" data-i18n="sty.flip"></button>
        <button id="sty-4" class="sty" type="button" data-i18n="sty.neon"></button>
      </div>
    </section>

    <!-- ===== World clock ===== -->
    <section class="sec">
      <div class="sec-head">
        <span data-i18n="zones.title"></span>
        <button id="zone-add" type="button" class="mini" data-i18n="zones.add"></button>
      </div>
      <!-- Quick zone chips -->
      <div id="quick-zones" class="quick-chips"></div>
      <ul id="zones"></ul>
    </section>

    <!-- ===== Sun & Moon ===== -->
    <section class="sec">
      <div class="sec-head"><span data-i18n-a="astro.title"></span></div>
      <div id="ast-body"></div>
    </section>

    <!-- ===== Tools ===== -->
    <section class="sec">
      <div id="tabs">
        <button class="tab active" data-pane="pane-alarm" type="button" data-i18n="tab.alarm"></button>
        <button class="tab" data-pane="pane-timer" type="button" data-i18n="tab.timer"></button>
        <button class="tab" data-pane="pane-stop" type="button" data-i18n="tab.stopwatch"></button>
        <button class="tab" data-pane="pane-pomo" type="button" data-i18n="tab.pomodoro"></button>
        <button class="tab" data-pane="pane-stage" type="button" data-i18n="tab.stage"></button>
      </div>

      <!-- Alarm -->
      <div class="pane" id="pane-alarm">
        <ul id="alarm-list"></ul>
        <div class="frm">
          <input id="al-time" type="time" value="07:00">
          <input id="al-label" type="text" data-i18n-ph="al.ph.label">
          <label class="chk">
            <input id="al-daily" type="checkbox">
            <span data-i18n="al.daily"></span>
          </label>
        </div>
        <div class="frm">
          <label class="chk">
            <input id="al-sound" type="checkbox" checked>
            <span data-i18n="al.sound"></span>
          </label>
        </div>
        <button id="al-add" type="button" class="btn prim" data-i18n="al.add"></button>
      </div>

      <!-- Timer -->
      <div class="pane" id="pane-timer" hidden>
        <div id="tm-display">00:00</div>
        <div id="tm-overlay" class="countdown-overlay" hidden>00:00</div>
        <div class="frm">
          <input id="tm-min" type="number" min="0" max="999" inputmode="numeric" value="5">
          <input id="tm-sec" type="number" min="0" max="59" inputmode="numeric" value="0">
          <button id="tm-start" type="button" class="btn prim" data-i18n="tm.start"></button>
          <button id="tm-reset" type="button" class="btn" data-i18n="tm.reset"></button>
        </div>
      </div>

      <!-- Stopwatch -->
      <div class="pane" id="pane-stop" hidden>
        <div id="st-display">00:00.0</div>
        <div class="frm">
          <button id="st-go" type="button" class="btn prim" data-i18n="st.start"></button>
          <button id="st-reset" type="button" class="btn" data-i18n="st.reset"></button>
        </div>
      </div>

      <!-- Pomodoro -->
      <div class="pane" id="pane-pomo" hidden>
        <div id="pm-phase"></div>
        <div id="pm-display">25:00</div>
        <div class="frm">
          <button id="pm-start" type="button" class="btn prim" data-i18n="pm.start"></button>
          <button id="pm-reset" type="button" class="btn" data-i18n="pm.reset"></button>
        </div>
        <div class="frm cfg">
          <label for="pm-work" data-i18n="pm.work"></label>
          <input id="pm-work" type="number" min="1" max="120" inputmode="numeric" value="25">
          <label for="pm-break" data-i18n="pm.break"></label>
          <input id="pm-break" type="number" min="1" max="60" inputmode="numeric" value="5">
        </div>
        <div class="frm cfg" id="pm-log-w" hidden>
          <label for="pm-log" data-i18n="pm.log"></label>
          <select id="pm-log"></select>
        </div>
        <p id="pm-log-hint" data-i18n="pm.log.hint" hidden></p>
        <div id="pm-count"></div>
      </div>

      <!-- Stage: conference / stage timer (time/stage.js) -->
      <div class="pane" id="pane-stage" hidden>
        <div class="stg-bar">
          <select id="stg-ev" data-i18n-s="stg.ev"></select>
          <button id="stg-ev-new" type="button" class="mini" data-i18n-s="stg.ev.new"></button>
          <button id="stg-ev-edit" type="button" class="mini" data-i18n-s="stg.ev.edit"></button>
          <button id="stg-join" type="button" class="mini" data-i18n-l="sl.join"></button>
        </div>
        <div id="stg-empty" hidden>
          <p data-i18n-s="stg.empty"></p>
          <button id="stg-empty-new" type="button" class="btn prim" data-i18n-s="stg.ev.create"></button>
        </div>
        <div id="stg-main" hidden>
          <div id="stg-sum" aria-live="polite"></div>
          <div id="stg-live" class="stg-live">
            <div id="stg-live-title"></div>
            <div id="stg-live-spk"></div>
            <div id="stg-time" class="stg-time">00:00</div>
            <div class="stg-prog"><span id="stg-prog-bar"></span></div>
            <div id="stg-next"></div>
            <div id="stg-live-msg" class="stg-live-msg" hidden></div>
            <div id="stg-live-black" class="stg-live-black" data-i18n-s="stg.live.black" hidden></div>
          </div>
          <div id="sl-asks" class="sl-asks" role="alert" hidden></div>
          <div class="stg-ctl">
            <button id="stg-prev" type="button" class="btn" data-i18n-s="stg.prev"></button>
            <button id="stg-go" type="button" class="btn prim"></button>
            <button id="stg-nxt" type="button" class="btn" data-i18n-s="stg.next"></button>
          </div>
          <div class="stg-ctl">
            <button id="stg-minus" type="button" class="btn" data-i18n-s="stg.minus"></button>
            <button id="stg-plus" type="button" class="btn" data-i18n-s="stg.plus"></button>
            <button id="stg-reset" type="button" class="btn" data-i18n-s="stg.reset"></button>
            <button id="stg-show" type="button" class="btn prim" data-i18n-s="stg.show"></button>
          </div>
          <div class="stg-opts">
            <label class="chk">
              <input id="stg-sound" type="checkbox">
              <span data-i18n-s="stg.sound"></span>
            </label>
          </div>
          <div class="sec-head stg-head"><span data-i18n-s="stg.msg"></span></div>
          <div class="stg-msg">
            <input id="stg-msg" type="text" maxlength="200" data-i18n-s-ph="stg.msg.ph" data-i18n-s-a="stg.msg">
            <div class="stg-msg-row">
              <select id="stg-msg-color" data-i18n-s-a="stg.msg.color"></select>
              <label class="chk"><input id="stg-msg-flash" type="checkbox"><span data-i18n-s="stg.msg.flash"></span></label>
              <button id="stg-msg-show" type="button" class="btn prim"></button>
              <button id="stg-msg-save" type="button" class="mini" data-i18n-s="stg.msg.save"></button>
            </div>
            <div id="stg-msg-presets" class="quick-chips"></div>
          </div>
          <div class="sec-head stg-head"><span data-i18n-s="stg.out"></span></div>
          <div class="stg-ctl">
            <button id="stg-display" type="button" class="btn" data-i18n-s="stg.display"></button>
            <button id="stg-black" type="button" class="btn"></button>
          </div>
          <p id="stg-out-note" class="stg-note" role="alert" hidden></p>
          <div class="stg-out">
            <label for="stg-layout" data-i18n-s="stg.layout"></label>
            <select id="stg-layout"></select>
            <label class="chk"><input id="stg-mirror" type="checkbox"><span data-i18n-s="stg.mirror"></span></label>
            <span class="stg-logo-row">
              <button id="stg-logo" type="button" class="mini" data-i18n-s="stg.logo"></button>
              <button id="stg-logo-x" type="button" class="mini" data-i18n-s="stg.logo.x" hidden></button>
            </span>
          </div>
          <div class="sec-head stg-head">
            <span data-i18n-l="sl.devs"></span>
            <button id="sl-add" type="button" class="mini" data-i18n-l="sl.add"></button>
          </div>
          <ul id="sl-list" class="sl-list"></ul>
          <p class="sl-hint" data-i18n-l="sl.hint"></p>
          <div class="sec-head stg-head">
            <span data-i18n-s="stg.rundown"></span>
            <button id="stg-add" type="button" class="mini" data-i18n-s="stg.add"></button>
          </div>
          <ol id="stg-list"></ol>
          <p class="stg-keys" data-i18n-s="stg.keys"></p>
        </div>
      </div>
    </section>

    <!-- Converter mode toggle -->
    <section class="sec" id="converter-section" hidden>
      <div class="sec-head">
        <span data-i18n="conv.title"></span>
        <button id="conv-toggle" type="button" class="mini"></button>
      </div>
      <div id="conv-display" class="conv-row"></div>
    </section>
  </main>

  <!-- Zone picker dialog -->
  <dialog id="zone-dlg">
    <h3 data-i18n="zones.dlg"></h3>
    <select id="zone-sel"></select>
    <div class="dlg-row">
      <button id="zone-ok" type="button" class="btn prim" data-i18n="zones.ok"></button>
      <button id="zone-cancel" type="button" class="btn" data-i18n="zones.cancel"></button>
    </div>
  </dialog>

  <!-- Astro location dialog -->
  <dialog id="astro-dlg">
    <h3 data-i18n-a="astro.dlg"></h3>
    <div class="ast-form">
      <label for="as-lat" data-i18n-a="astro.lat"></label>
      <input id="as-lat" type="number" step="any" min="-90" max="90" inputmode="decimal">
      <label for="as-lon" data-i18n-a="astro.lon"></label>
      <input id="as-lon" type="number" step="any" min="-180" max="180" inputmode="decimal">
      <button id="as-geo" type="button" class="mini" data-i18n-a="astro.geo.detect"></button>
    </div>
    <div class="dlg-row">
      <button id="as-save" type="button" class="btn prim" data-i18n-a="astro.save"></button>
      <button id="as-cancel" type="button" class="btn" data-i18n-a="astro.cancel"></button>
    </div>
    <div class="dlg-row">
      <button id="as-clear" type="button" class="btn" data-i18n-a="astro.clear"></button>
    </div>
  </dialog>

  <!-- Stage view: what the speaker sees (full screen); drawn by time/stage-view.js -->
  <div id="stg-view" hidden role="dialog" aria-modal="true" data-i18n-s-a="stg.view">
    <div id="sv-root"></div>
    <div class="sv-tools" id="sv-tools">
      <button id="sv-black-btn" type="button" class="btn" data-i18n-s="stg.black"></button>
      <button id="sv-fs" type="button" class="btn" data-i18n-s="stg.fs"></button>
      <button id="sv-close" type="button" class="btn" data-i18n-s="stg.close"></button>
    </div>
  </div>

  <!-- Stage: connect a device (time/stage-link.js) -->
  <dialog id="sl-pair-dlg" class="stg-dlg" aria-labelledby="sl-pair-h">
    <h3 id="sl-pair-h" data-i18n-l="sl.pair.h"></h3>
    <fieldset id="sl-pick" class="sl-pick">
      <legend data-i18n-l="sl.pair.role"></legend>
      <label class="sl-opt"><input type="radio" name="sl-role" value="remote" checked><span><b data-i18n-l="sl.r.remote"></b><small data-i18n-l="sl.rd.remote"></small></span></label>
      <label class="sl-opt"><input type="radio" name="sl-role" value="display"><span><b data-i18n-l="sl.r.display"></b><small data-i18n-l="sl.rd.display"></small></span></label>
      <label class="sl-opt"><input type="radio" name="sl-role" value="moderator"><span><b data-i18n-l="sl.r.moderator"></b><small data-i18n-l="sl.rd.moderator"></small></span></label>
    </fieldset>
    <p id="sl-full" class="stg-note" data-i18n-l="sl.pair.full" hidden></p>
    <div id="sl-code-box" class="sl-code-box" hidden>
      <p class="sl-how" data-i18n-l="sl.pair.how"></p>
      <p id="sl-code" class="sl-code" aria-live="polite"></p>
      <canvas id="sl-qr" class="sl-qr" width="232" height="232" aria-hidden="true"></canvas>
      <p id="sl-url" class="sl-url"></p>
    </div>
    <div id="sl-ask-box" class="sl-ask-box" hidden>
      <p id="sl-ask-text" role="alert"></p>
      <div class="dlg-row">
        <button id="sl-deny" type="button" class="btn" data-i18n-l="sl.deny"></button>
        <button id="sl-allow" type="button" class="btn prim" data-i18n-l="sl.allow"></button>
      </div>
    </div>
    <p id="sl-pair-st" class="sl-st" role="status"></p>
    <div class="dlg-row">
      <button id="sl-pair-go" type="button" class="btn prim" data-i18n-l="sl.pair.go"></button>
      <button id="sl-pair-close" type="button" class="btn" data-i18n-l="sl.close"></button>
    </div>
  </dialog>

  <!-- Stage: join Time on another device -->
  <dialog id="sl-join-dlg" class="stg-dlg" aria-labelledby="sl-join-h">
    <h3 id="sl-join-h" data-i18n-l="sl.join.h"></h3>
    <label for="sl-join-code" class="sl-lbl" data-i18n-l="sl.code"></label>
    <div class="sl-join-row">
      <input id="sl-join-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="7" pattern="[0-9 ]*">
      <button id="sl-join-go" type="button" class="btn prim" data-i18n-l="sl.connect"></button>
    </div>
    <p id="sl-join-st" class="sl-st" role="status"></p>
    <div class="dlg-row">
      <button id="sl-join-close" type="button" class="btn" data-i18n-l="sl.close"></button>
    </div>
  </dialog>

  <!-- Stage: this device is paired with Time on another one -->
  <div id="sl-dev" hidden role="dialog" aria-modal="true" aria-labelledby="sd-role">
    <div id="sd-bar" class="sd-bar on">
      <span id="sd-role" class="sd-role"></span>
      <span id="sd-link" class="sd-link"></span>
      <button id="sd-fs" type="button" class="btn" data-i18n-l="sl.fs"></button>
      <button id="sd-leave" type="button" class="btn" data-i18n-l="sl.leave"></button>
    </div>
    <div id="sd-view" class="sd-view"><div id="sd-root"></div></div>
    <div id="sd-black-note" class="sd-note" data-i18n-l="sl.isblack" hidden></div>
    <div id="sd-ctl" class="sd-ctl" hidden>
      <div class="sd-row">
        <button id="sd-prev" type="button" class="btn" data-i18n-l="sl.prev"></button>
        <button id="sd-go" type="button" class="btn prim"></button>
        <button id="sd-next" type="button" class="btn" data-i18n-l="sl.next"></button>
      </div>
      <div class="sd-row">
        <button id="sd-minus" type="button" class="btn" data-i18n-l="sl.minus"></button>
        <button id="sd-plus" type="button" class="btn" data-i18n-l="sl.plus"></button>
        <button id="sd-reset" type="button" class="btn" data-i18n-l="sl.reset"></button>
        <button id="sd-black" type="button" class="btn"></button>
      </div>
      <div class="sd-msg">
        <span class="sd-h" data-i18n-l="sl.msg"></span>
        <input id="sd-msg" type="text" maxlength="200" data-i18n-l-ph="sl.msg.ph" data-i18n-l-a="sl.msg">
        <div class="sd-row sd-row-l">
          <select id="sd-msg-color" data-i18n-l-a="sl.msg.color"></select>
          <label class="chk"><input id="sd-msg-flash" type="checkbox"><span data-i18n-l="sl.msg.flash"></span></label>
          <button id="sd-msg-send" type="button" class="btn prim" data-i18n-l="sl.msg.send"></button>
          <button id="sd-msg-hide" type="button" class="btn" data-i18n-l="sl.msg.hide" hidden></button>
        </div>
        <div id="sd-presets" class="quick-chips sd-chips"></div>
      </div>
    </div>
    <div id="sd-askp" class="sd-ctl" hidden>
      <span class="sd-h" data-i18n-l="sl.ask.h"></span>
      <div id="sd-asks" class="quick-chips sd-chips"></div>
      <div class="sd-row sd-row-l">
        <input id="sd-ask" type="text" maxlength="120" data-i18n-l-ph="sl.ask.ph" data-i18n-l-a="sl.ask.h">
        <button id="sd-ask-send" type="button" class="btn prim" data-i18n-l="sl.ask.send"></button>
      </div>
      <p id="sd-ask-st" class="sd-ask-st" role="status"></p>
    </div>
    <p id="sd-cut" class="sd-cut" data-i18n-l="sl.cut" hidden></p>
  </div>

  <!-- Stage: event settings -->
  <dialog id="stg-ev-dlg" class="stg-dlg">
    <h3 id="stg-ev-h"></h3>
    <div class="stg-form">
      <label for="se-name" data-i18n-s="stg.f.name"></label>
      <input id="se-name" type="text" maxlength="120">
      <label for="se-date" data-i18n-s="stg.f.date"></label>
      <input id="se-date" type="date">
      <label for="se-start" data-i18n-s="stg.f.start"></label>
      <input id="se-start" type="time">
      <label for="se-yellow" data-i18n-s="stg.f.yellow"></label>
      <input id="se-yellow" type="number" min="0" max="60" step="0.5" inputmode="decimal">
      <label for="se-red" data-i18n-s="stg.f.red"></label>
      <input id="se-red" type="number" min="0" max="60" step="0.5" inputmode="decimal">
      <label class="chk wide">
        <input id="se-flash" type="checkbox">
        <span data-i18n-s="stg.f.flash"></span>
      </label>
    </div>
    <div class="dlg-row">
      <button id="se-save" type="button" class="btn prim" data-i18n-s="stg.save"></button>
      <button id="se-cancel" type="button" class="btn" data-i18n-s="stg.cancel"></button>
    </div>
    <div class="dlg-row">
      <button id="se-dup" type="button" class="btn" data-i18n-s="stg.ev.dup"></button>
      <button id="se-del" type="button" class="btn danger" data-i18n-s="stg.ev.del"></button>
    </div>
  </dialog>

  <!-- Stage: rundown item -->
  <dialog id="stg-it-dlg" class="stg-dlg">
    <h3 id="stg-it-h"></h3>
    <div class="stg-form">
      <label for="si-title" data-i18n-s="stg.f.title"></label>
      <input id="si-title" type="text" maxlength="200">
      <label for="si-spk" data-i18n-s="stg.f.speaker"></label>
      <input id="si-spk" type="text" maxlength="120">
      <label for="si-kind" data-i18n-s="stg.f.kind"></label>
      <select id="si-kind"></select>
      <label for="si-min" data-i18n-s="stg.f.dur" id="si-dur-l"></label>
      <span class="stg-dur" id="si-dur-w">
        <input id="si-min" type="number" min="0" max="1440" inputmode="numeric" data-i18n-s-a="stg.f.min">
        <span>:</span>
        <input id="si-sec" type="number" min="0" max="59" inputmode="numeric" data-i18n-s-a="stg.f.sec">
      </span>
      <label for="si-until" data-i18n-s="stg.f.until" id="si-until-l"></label>
      <input id="si-until" type="time">
      <label for="si-yellow" data-i18n-s="stg.f.yellow"></label>
      <input id="si-yellow" type="number" min="0" max="60" step="0.5" inputmode="decimal" data-i18n-s-ph="stg.f.default">
      <label for="si-red" data-i18n-s="stg.f.red"></label>
      <input id="si-red" type="number" min="0" max="60" step="0.5" inputmode="decimal" data-i18n-s-ph="stg.f.default">
      <label class="chk wide">
        <input id="si-auto" type="checkbox">
        <span data-i18n-s="stg.f.auto"></span>
      </label>
      <label for="si-notes" data-i18n-s="stg.f.notes" class="wide"></label>
      <textarea id="si-notes" rows="3" maxlength="2000" class="wide"></textarea>
    </div>
    <div class="dlg-row">
      <button id="si-save" type="button" class="btn prim" data-i18n-s="stg.save"></button>
      <button id="si-cancel" type="button" class="btn" data-i18n-s="stg.cancel"></button>
    </div>
    <div class="dlg-row">
      <button id="si-del" type="button" class="btn danger" data-i18n-s="stg.it.del"></button>
    </div>
  </dialog>


  <script src="../timesheet/core.js?v=1.52.00"></script>
  <script src="time.js?v=1.52.00"></script>
  <script src="astro.js?v=1.52.00"></script>
  <script src="stage-core.js?v=1.52.00"></script>
