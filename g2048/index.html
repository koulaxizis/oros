<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-VvebZznitnUSZETT1vaI6PkGGdN1G6qnFZsACjPV178='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=g2048" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>2048 · orOS</title>

  <link rel="stylesheet" href="g2048.css?v=5.02.00">

</head>
<body>

  <!-- Toolbar: one line on a wide screen, two scrolling strips on a phone -->
  <header id="toolbar">
    <div class="tb-row" id="tb-a">
      <div class="seg" id="size-seg" role="group">
        <button type="button" class="seg-btn" data-size="3">3×3</button>
        <button type="button" class="seg-btn" data-size="4">4×4</button>
        <button type="button" class="seg-btn" data-size="5">5×5</button>
      </div>
      <div class="seg" id="mode-seg" role="group">
        <button type="button" class="seg-btn" data-mode="c" data-i18n="mode.c">Classic</button>
        <button type="button" class="seg-btn" data-mode="t" data-i18n="mode.t">Timed</button>
      </div>
    </div>
    <div class="tb-row" id="tb-b">
      <span class="spacer"></span>
      <button type="button" class="icon-btn" id="undo-btn"></button>
      <button type="button" class="icon-btn" id="new-btn"></button>
      <button type="button" class="icon-btn" id="stats-btn"></button>
      <button type="button" class="icon-btn" id="sfx-btn" aria-pressed="false"></button>
    </div>
  </header>

  <!-- Status: score, message, best -->
  <div id="status">
    <span class="stat"><span data-i18n="st.score">Score</span><strong id="score">0</strong></span>
    <span id="turn" aria-live="polite"></span>
    <span class="stat"><strong id="best">0</strong><span data-i18n="st.best">Best</span></span>
  </div>

  <main id="board-wrap">
    <div id="board" role="group"></div>
  </main>

  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="../i18n.js?v=5.02.00" data-app="g2048"></script>
  <script src="g2048.js?v=5.02.00"></script>

</body>
</html>
