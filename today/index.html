<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && !/[?&]standalone\b/.test(location.search)) location.replace("../?open=today" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Today · orOS</title>

  <link rel="stylesheet" href="today.css?v=2.12.00">

</head>
<body>

  <header id="toolbar">
    <div id="head">
      <h1 id="title"></h1>
      <div id="date"></div>
    </div>
    <span class="spacer"></span>
    <button type="button" class="icon-btn" id="edit-btn" aria-pressed="false"></button>
    <button type="button" class="icon-btn" id="refresh-btn"></button>
    <button type="button" class="icon-btn" id="set-btn"></button>
  </header>

  <main id="main" aria-live="polite"></main>

  <dialog id="set-dlg" aria-labelledby="set-title">
    <form method="dialog" class="dlg">
      <h2 id="set-title"></h2>
      <div id="set-body"></div>
      <div class="dlg-actions">
        <button type="submit" class="txt-btn primary" id="set-close"></button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite" hidden></div>
  <div id="live" class="sr-only" aria-live="assertive"></div>

  <script src="../assistant/core.js?v=2.12.00"></script>
  <script src="layout.js?v=2.12.00"></script>
  <script src="today.js?v=2.12.00"></script>
</body>
</html>
