<!DOCTYPE html>
<html lang="en" data-skin="oros" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-fRbGUwq52GaY8iQr+mZ+H5YOqJap7o3BupnzpQR4kts='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=kanban" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kanban · orOS</title>
  <link rel="stylesheet" href="kanban.css?v=5.03.00">
</head>
<body>

  <!-- Board bar: board title + search + label filter + new column -->
  <header id="boardbar">
    <!-- Multi-board (v0.6): rendered dynamically by kanban.js
         renderBoardHeader() — dropdown (board name + switcher)
         + new/manage buttons. -->
    <div id="board-header"></div>

    <div id="search-wrap">
      <input id="search" type="search" autocomplete="off" spellcheck="false"
             placeholder="Search…" data-i18n-ph="search.ph">
      <button type="button" id="search-clear" hidden aria-label="Clear search"
              data-i18n-title="search.clear" title="Clear">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div id="filter-slot">
      <button type="button" id="filter-btn" aria-label="Filter by label"
              data-i18n-title="filter.title" title="Filter by label">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
        <span id="filter-count" hidden>0</span>
      </button>
      <div id="filter-pop" hidden></div>
    </div>

    <!-- K1: view (Board / Table / Timeline), swimlanes, automations,
         export, templates — popover built by kanban.js renderMorePop() -->
    <div id="more-slot">
      <button type="button" id="more-btn" aria-label="View and board options"
              data-i18n-title="more.title" title="View and board options" aria-haspopup="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="4" height="13" rx="1"/></svg>
      </button>
      <div id="more-pop" hidden></div>
    </div>

    <button id="col-add" aria-label="Add column" title="Add column"
            data-i18n-title="col.add"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </header>

  <!-- Columns (horizontal scroll, one quick-add at the end of each) -->
  <main id="board-scroll">
    <div id="columns"></div>
    <div id="alt-view" hidden></div>
    <div id="empty" hidden>
      <span data-i18n="empty.title">No columns yet</span>
      <small data-i18n="empty.hint">Add your first column with the button above.</small>
    </div>
  </main>

  <!-- Card dialog (tap a card to open) — live editing: everything saves as you type -->
  <dialog id="dlg-card">
    <form method="dialog" id="card-form" autocomplete="off">
      <h3 data-i18n="card.title">Card</h3>

      <label for="c-text" data-i18n="card.text">Text</label>
      <input id="c-text" type="text" required>

      <!-- K1: move the card to another column (runs that column's rules) -->
      <label for="c-col" data-i18n="card.col">Column</label>
      <select id="c-col"></select>

      <label for="c-notes" data-i18n="card.notes">Notes</label>
      <textarea id="c-notes" rows="4"></textarea>

      <!-- Due date (Kanban → Calendar integration): live-save, all-day event -->
      <label for="c-due" data-i18n="card.due">Due</label>
      <input id="c-due" type="date" autocomplete="off">

      <!-- K1: swimlane field -->
      <label for="c-lane" data-i18n="card.lane">Lane</label>
      <input id="c-lane" type="text" list="c-lane-list" maxlength="60" autocomplete="off"
             placeholder="e.g. Team A" data-i18n-ph="card.laneph">
      <datalist id="c-lane-list"></datalist>

      <!-- Labels (feature 9): chips + picker, all inside the dialog -->
      <label data-i18n="card.labels">Labels</label>
      <div id="c-lbl-chips"></div>
      <button type="button" id="c-lbl-toggle" class="ghost">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <span data-i18n="card.labels.manage">Add / manage labels</span>
      </button>
      <div id="c-lbl-picker" hidden>
        <div id="c-lbl-list"></div>
        <div class="lbl-new">
          <input id="c-lbl-name" type="text" placeholder="New label…"
                 data-i18n-ph="labels.newph" maxlength="24">
          <div id="c-lbl-swatches"></div>
          <button type="button" id="c-lbl-new-add" data-i18n="labels.add">Add</button>
        </div>
      </div>

      <!-- Subtasks (feature 10) -->
      <label data-i18n="card.subtasks">Subtasks</label>
      <div id="c-sub-list"></div>
      <div class="quick-row">
        <input id="c-sub-new" type="text" placeholder="New subtask…" data-i18n-ph="card.subph">
        <button type="button" id="c-sub-add" aria-label="Add subtask" data-i18n-title="card.add"
                title="Add"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>

      <!-- K1: attachments (files on the orOS disk) + cover -->
      <label data-i18n="card.att">Attachments</label>
      <div id="c-att-list"></div>
      <button type="button" id="c-att-add" class="ghost">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        <span data-i18n="att.add">Add file</span>
      </button>

      <label data-i18n="card.cover">Cover</label>
      <div id="c-cover"></div>

      <!-- Extra info (feature 11, adapted): free key-value fields -->
      <label data-i18n="card.info">Extra info</label>
      <div id="c-info-list"></div>
      <button type="button" id="c-info-add" class="ghost">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span data-i18n="card.info.add">Add field</span>
      </button>

      <menu>
        <button type="button" id="c-delete" class="danger" data-i18n="card.delete">Delete</button>
        <span class="spacer"></span>
        <button type="button" id="c-send" hidden data-i18n="card.send">Send…</button>
        <button type="button" id="c-duplicate" data-i18n="card.duplicate">Duplicate</button>
        <button type="submit" data-i18n="save">Save</button>
      </menu>
    </form>
  </dialog>

  <!-- Column dialog (rename via dblclick, delete) -->
  <dialog id="dlg-col">
    <form method="dialog" id="col-form" autocomplete="off">
      <h3 data-i18n="col.settings">Column settings</h3>

      <label for="col-name" data-i18n="col.name">Name</label>
      <input id="col-name" type="text" required>

      <!-- K1: WIP limit + arrival rules (synced with the column) -->
      <label for="col-wip" data-i18n="col.wip">WIP limit</label>
      <input id="col-wip" type="number" min="0" max="999" step="1" inputmode="numeric" placeholder="—">
      <div class="dlg-hint" data-i18n="col.wip.hint">Empty = no limit. The column turns orange when it holds more cards than this.</div>

      <label data-i18n="col.auto">When a card arrives here</label>
      <div class="auto-box">
        <label class="chk"><input type="checkbox" id="col-a-done"> <span data-i18n="auto.done">Tick all subtasks</span></label>
        <label class="chk"><input type="checkbox" id="col-a-today"> <span data-i18n="auto.today">Set the due date to today</span></label>
        <label class="chk"><input type="checkbox" id="col-a-top"> <span data-i18n="auto.top">Move it to the top</span></label>
        <label class="chk sel"><span data-i18n="auto.label">Add a label</span> <select id="col-a-label"></select></label>
      </div>

      <menu>
        <button type="button" id="col-delete" class="danger" data-i18n="col.delete">Delete column</button>
        <span class="spacer"></span>
        <button type="button" id="col-send" hidden data-i18n="col.send">Send cards…</button>
        <button type="submit" data-i18n="save">Save</button>
      </menu>
    </form>
  </dialog>
  
  <!-- Label dialog: rename / recolour / delete an existing label (pencil in the card's label list and in the filter) -->
  <dialog id="dlg-lbl">
    <form method="dialog" id="lbl-form" autocomplete="off">
      <h3 data-i18n="lbl.edit">Edit label</h3>

      <label for="lbl-name" data-i18n="col.name">Name</label>
      <input id="lbl-name" type="text" required maxlength="24">

      <label data-i18n="lbl.color">Colour</label>
      <div id="lbl-swatches"></div>

      <menu>
        <button type="button" id="lbl-delete" class="danger" data-i18n="filter.del">Delete label</button>
        <span class="spacer"></span>
        <button type="submit" data-i18n="save">Save</button>
      </menu>
    </form>
  </dialog>

    <!-- Board rename dialog (dblclick on selector or Manage dialog pencil) -->
  <dialog id="dlg-board">
    <form method="dialog" id="board-form" autocomplete="off">
      <h3 data-i18n="board.rename">Rename board</h3>

      <label for="b-name" data-i18n="col.name">Name</label>
      <input id="b-name" type="text" required>

      <menu>
        <span class="spacer"></span>
        <button type="submit" data-i18n="save">Save</button>
      </menu>
    </form>
  </dialog>

  <!-- Undo / feedback toast -->
  <div id="toast" role="status"></div>

  <script src="../i18n.js?v=5.03.00" data-app="kanban,links"></script>
  <script src="../links/core.js?v=5.03.00"></script>
  <script src="../links/sheets.js?v=5.03.00"></script>
  <script src="../links/kanban.js?v=5.03.00"></script>
  <script src="../importkit.js?v=5.03.00"></script>
  <script src="import.js?v=5.03.00"></script>
  <script src="model.js?v=5.03.00"></script>
  <script src="tools.js?v=5.03.00"></script>
  <script src="../bundle.js?v=5.03.00"></script>
  <script src="kanban.js?v=5.03.00"></script>
</body>
</html>
