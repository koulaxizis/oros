<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-wCYIGwRJ6YH1kBk5UDsFx3Ps8dObREUe8Xej7Y2tY8k='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && !/[?&]standalone\b/.test(location.search)) location.replace("../?open=lyricsync" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lyric Sync · orOS</title>
  <link rel="stylesheet" href="app.css?v=3.85.01">
</head>
<body>

  <header id="toolbar">
    <button type="button" id="back-btn" class="chip icon" data-i18n-aria="btn.back" hidden>←</button>
    <h1 id="title" data-i18n="app.name">Lyric Sync</h1>
    <span class="grow"></span>
    <button type="button" id="open-btn" class="chip" data-i18n="btn.open">Open file</button>
    <button type="button" id="new-btn" class="chip pri" data-i18n="btn.new">New song</button>
    <button type="button" id="export-btn" class="chip pri" data-i18n="btn.export" hidden>Export</button>
  </header>

  <main id="main">

    <!-- The list of songs -->
    <section id="v-list">
      <p class="hint" data-i18n="list.intro">Time your lyrics to the music, line by line, and save them as LRC, SRT, WebVTT or TTML. The song never leaves this device.</p>
      <ul id="songs"></ul>
      <p id="empty" class="hint" data-i18n="list.empty">No songs yet. Press New song, or open a song or a lyrics file.</p>
    </section>

    <!-- One song -->
    <section id="v-edit" hidden>
      <div id="tabs" role="tablist">
        <button type="button" role="tab" id="tab-lyrics" class="tab" aria-controls="p-lyrics" data-tab="lyrics" data-i18n="tab.lyrics">Lyrics</button>
        <button type="button" role="tab" id="tab-sync" class="tab" aria-controls="p-sync" data-tab="sync" data-i18n="tab.sync">Sync</button>
        <button type="button" role="tab" id="tab-preview" class="tab" aria-controls="p-preview" data-tab="preview" data-i18n="tab.preview">Preview</button>
      </div>

      <div id="audio-row">
        <button type="button" id="audio-btn" class="chip" data-i18n="btn.audio">Choose the song</button>
        <span id="audio-name" class="dim"></span>
      </div>

      <!-- Lyrics -->
      <div id="p-lyrics" role="tabpanel" aria-labelledby="tab-lyrics">
        <div class="fields">
          <label><span data-i18n="f.name">Title</span><input type="text" id="f-name" maxlength="200" autocomplete="off"></label>
          <label><span data-i18n="f.artist">Artist</span><input type="text" id="f-artist" maxlength="200" autocomplete="off"></label>
          <label><span data-i18n="f.album">Album</span><input type="text" id="f-album" maxlength="200" autocomplete="off"></label>
          <label><span data-i18n="f.lang">Language code</span><input type="text" id="f-lang" maxlength="20" autocomplete="off" data-i18n-ph="f.langPh"></label>
        </div>
        <label for="lyrics-text" class="lbl" data-i18n="f.lyrics">Lyrics, one line per line. A blank line starts a new verse.</label>
        <textarea id="lyrics-text" rows="14" spellcheck="false"></textarea>
        <div class="row">
          <button type="button" id="import-btn" class="chip" data-i18n="btn.importLyrics">Open a lyrics file</button>
          <span id="lyrics-count" class="dim"></span>
        </div>
      </div>

      <!-- Transport (Sync and Preview) -->
      <div id="transport" hidden>
        <div class="row tp">
          <button type="button" id="rew-btn" class="chip icon" data-i18n-aria="btn.rew">−5</button>
          <button type="button" id="play-btn" class="chip pri icon play" data-i18n-aria="btn.play">▶</button>
          <button type="button" id="fwd-btn" class="chip icon" data-i18n-aria="btn.fwd">+5</button>
          <span id="clock" class="clock">0:00.00</span>
          <label class="speed"><span class="sr-only" data-i18n="f.speed">Speed</span>
            <select id="speed">
              <option value="1">100%</option><option value="0.9">90%</option><option value="0.75">75%</option><option value="0.5">50%</option>
            </select>
          </label>
        </div>
        <input type="range" id="seek" min="0" max="1" step="0.01" value="0" data-i18n-aria="f.seek">
      </div>

      <!-- Sync -->
      <div id="p-sync" role="tabpanel" aria-labelledby="tab-sync" hidden>
        <div class="row">
          <div class="seg" role="radiogroup" data-i18n-aria="mode.label">
            <button type="button" role="radio" id="mode-tap" data-mode="tap" data-i18n="mode.tap">Tap</button>
            <button type="button" role="radio" id="mode-hold" data-mode="hold" data-i18n="mode.hold">Hold</button>
          </div>
          <button type="button" id="undo-btn" class="chip" data-i18n="btn.undo">Undo</button>
          <button type="button" id="redo-btn" class="chip" data-i18n="btn.redo">Redo</button>
          <span id="progress" class="dim"></span>
        </div>
        <p id="mode-hint" class="hint"></p>

        <div id="line-tools" hidden>
          <label class="time-in"><span class="sr-only" data-i18n="f.start">Start</span><input type="text" id="line-time" inputmode="decimal" autocomplete="off"></label>
          <button type="button" id="line-play" class="chip" data-i18n="btn.playLine">Play</button>
          <button type="button" class="chip nudge" data-nudge="-100">−0.1</button>
          <button type="button" class="chip nudge" data-nudge="-10">−0.01</button>
          <button type="button" class="chip nudge" data-nudge="10">+0.01</button>
          <button type="button" class="chip nudge" data-nudge="100">+0.1</button>
          <button type="button" id="line-from" class="chip" data-i18n="btn.syncFrom">Sync from here</button>
          <button type="button" id="line-clear" class="chip" data-i18n="btn.clearTime">Clear time</button>
        </div>

        <ol id="lines"></ol>
        <p id="no-lines" class="hint" data-i18n="sync.noLines" hidden>Write or paste the lyrics in the Lyrics tab first.</p>

        <div id="pad-row">
          <button type="button" id="end-btn" class="chip" data-i18n="btn.end">End line</button>
          <button type="button" id="pad" class="pad"><span id="pad-label" data-i18n="pad.tap">Tap</span><small id="pad-next"></small></button>
        </div>
      </div>

      <!-- Preview -->
      <div id="p-preview" role="tabpanel" aria-labelledby="tab-preview" hidden>
        <div id="stage" aria-live="off">
          <p id="st-prev" class="st dim"></p>
          <p id="st-now" class="st now"></p>
          <p id="st-next" class="st dim"></p>
          <p id="st-next2" class="st dim"></p>
        </div>
      </div>
    </section>
  </main>

  <audio id="player" preload="auto"></audio>

  <dialog id="export-dlg" aria-labelledby="export-title">
    <h2 id="export-title" data-i18n="ex.title">Export</h2>
    <p class="hint" id="export-sum"></p>
    <ul id="export-list"></ul>
    <div class="dlg-btns"><button type="button" class="chip" id="export-close" data-i18n="btn.close">Close</button></div>
  </dialog>

  <dialog id="confirm-dlg" aria-labelledby="confirm-msg">
    <p id="confirm-msg"></p>
    <div class="dlg-btns">
      <button type="button" class="chip" id="confirm-no" data-i18n="btn.cancel">Cancel</button>
      <button type="button" class="chip danger" id="confirm-yes"></button>
    </div>
  </dialog>

  <div id="toast" role="status"></div>

  <script src="../i18n.js?v=3.85.01" data-app="lyricsync"></script>
  <script src="core.js?v=3.85.01"></script>
  <script src="formats.js?v=3.85.01"></script>
  <script src="app.js?v=3.85.01"></script>

</body>
</html>
