<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-HhIVMvTK+0mM5J94rXm23YxaG6hP06OK/mEqXv4dGdU='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=notes" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Notes — orOS</title>
  <link rel="stylesheet" href="notes.css?v=5.02.00">
</head>
<body>
  <div id="notes-app">

    <!-- Tree pane (Zim-style hierarchical notebook) -->
    <aside id="tree-pane">
      <div id="tree-header">
        <select id="nb-selector" title="" aria-label=""></select>
      </div>
      <div id="tree-scroller">
        <ul id="tree-root" role="tree"></ul>
      </div>
      <div id="tree-footer">
        <button id="btn-new-page" class="icon-btn"></button>
      </div>
    </aside>

    <!-- Drag handle (desktop resize, hidden on mobile) -->
    <div id="pane-splitter" aria-hidden="true"></div>

    <!-- Editor pane: the page is Markdown source (plain text in storage);
         md.js renders the preview -->
    <main id="editor-pane">
      <header id="editor-header">
        <button id="btn-show-tree" class="icon-btn"></button>
        <input id="page-title" type="text" spellcheck="false" data-i18n-ph="notes.title.ph" placeholder="Title">
        <button id="btn-share-page" class="icon-btn" hidden></button>
      </header>
      <div id="md-toolbar" role="toolbar"></div>
      <div id="page-body">
        <textarea id="page-text" spellcheck="true" data-i18n-ph="notes.text.ph" placeholder="Start typing…"></textarea>
        <div id="page-preview" class="md" hidden></div>
      </div>
    </main>

  </div>
  <script src="../i18n.js?v=5.02.00" data-app="notes,links"></script>
  <script src="../links/core.js?v=5.02.00"></script>
  <script src="../links/notes.js?v=5.02.00"></script>
  <script src="platforms.js?v=5.02.00"></script>
  <script src="md.js?v=5.02.00"></script>
  <script src="../atelier/zip.js?v=5.02.00"></script>
  <script src="import.js?v=5.02.00"></script>
  <script src="../bundle.js?v=5.02.00"></script>
  <script src="package.js?v=5.02.00"></script>
  <script src="../household/core.js?v=5.02.00"></script>
  <script src="../household/whole.js?v=5.02.00"></script>
  <script src="../household/share.js?v=5.02.00"></script>
  <script src="../household/group.js?v=5.02.00"></script>
  <script src="house.js?v=5.02.00"></script>
  <script src="notes.js?v=5.02.00"></script>
</body>
</html>
