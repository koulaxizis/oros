<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Notes — orOS</title>
  <link rel="stylesheet" href="notes.css?v=0.18.1">
</head>
<body>
  <div id="notes-app">

    <!-- Tree pane (Zim-style hierarchical notebook) -->
    <aside id="tree-pane">
      <div id="tree-header">
        <span id="tree-title" data-i18n="notes.app">Notes</span>
      </div>
      <div id="tree-scroller">
        <ul id="tree-root" role="tree"></ul>
      </div>
      <div id="tree-footer">
        <button id="btn-new-page" class="icon-btn"></button>
      </div>
    </aside>

    <!-- Drag handle (desktop resize, hidden on mobile) -->
    <div id="pane-splitter" aria-hidden="true"></div>

    <!-- Editor pane (plain text only) -->
    <main id="editor-pane">
      <header id="editor-header">
        <button id="btn-show-tree" class="icon-btn" aria-label="Show tree"></button>
        <input id="page-title" type="text" spellcheck="false" data-i18n-ph="notes.title.ph" placeholder="Title">
      </header>
      <textarea id="page-text" spellcheck="true" data-i18n-ph="notes.text.ph" placeholder="Start typing…"></textarea>
    </main>

  </div>
  <script src="notes.js?v=0.18.1"></script>
</body>
</html>
