<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- The installed single app "orOS Games" (solo.js): its own manifest,
       icon and window; the page frames the orOS shell in solo mode. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>orOS Games</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1b1a18">
  <link rel="icon" href="/icons/solo/gamecenter.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/solo/gamecenter-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="orOS Games">
  <style>html,body{margin:0;height:100%;overflow:hidden;background:#14120d}#solo-frame{display:block;border:0;width:100%;height:100%}</style>
</head>
<body>
  <script src="/solo.js"></script>
  <script>window.orosSolo.hostBoot(window);</script>
</body>
</html>
