<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Minesweeper · orOS</title>

  <link rel="stylesheet" href="minesweeper.css?v=0.54.00">

</head>
<body>

  <!-- Toolbar: one line on a wide screen, two scrolling strips on a phone -->
  <header id="toolbar">
    <div class="tb-row" id="tb-a">
      <div class="seg" id="lv-seg" role="group">
        <button type="button" class="seg-btn" data-lv="b" data-i18n="lv.b">Beginner</button>
        <button type="button" class="seg-btn" data-lv="i" data-i18n="lv.i">Intermediate</button>
        <button type="button" class="seg-btn" data-lv="e" data-i18n="lv.e">Expert</button>
      </div>
    </div>
    <div class="tb-row" id="tb-b">
      <span class="spacer"></span>
      <button type="button" class="icon-btn" id="flag-btn" aria-pressed="false"></button>
      <button type="button" class="icon-btn" id="zoom-btn" aria-pressed="false"></button>
      <button type="button" class="icon-btn" id="new-btn"></button>
      <button type="button" class="icon-btn" id="stats-btn"></button>
      <button type="button" class="icon-btn" id="sfx-btn" aria-pressed="false"></button>
    </div>
  </header>

  <!-- Status: mines left, message, time -->
  <div id="status">
    <span class="stat"><span data-i18n="st.mines">Mines</span><strong id="mines">0</strong></span>
    <span id="turn" aria-live="polite"></span>
    <span class="stat"><strong id="time">0:00</strong><span data-i18n="st.time">Time</span></span>
  </div>

  <main id="board-wrap">
    <div id="board" tabindex="0"></div>
  </main>

  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="minesweeper.js?v=0.54.00"></script>

</body>
</html>
