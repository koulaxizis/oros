<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-sWjxM5Mdg8CgG1MZ0nMoY3HtqlSBrvX2gzkSQFwOA3M='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=minesweeper" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Minesweeper · orOS</title>

  <link rel="stylesheet" href="minesweeper.css?v=4.99.00">

</head>
<body>

  <!-- Toolbar: one line on a wide screen, two scrolling strips on a phone -->
  <header id="toolbar">
    <div class="tb-row" id="tb-a">
      <div class="seg" id="lv-seg" role="group">
        <button type="button" class="seg-btn" data-lv="b" data-i18n="lv.b">Beginner</button>
        <button type="button" class="seg-btn" data-lv="i" data-i18n="lv.i">Intermediate</button>
        <button type="button" class="seg-btn" data-lv="e" data-i18n="lv.e">Expert</button>
      </div>
    </div>
    <div class="tb-row" id="tb-b">
      <span class="spacer"></span>
      <button type="button" class="icon-btn" id="flag-btn" aria-pressed="false"></button>
      <button type="button" class="icon-btn" id="zoom-btn" aria-pressed="false"></button>
      <button type="button" class="icon-btn" id="new-btn"></button>
      <button type="button" class="icon-btn" id="daily-btn"></button>
      <button type="button" class="icon-btn" id="stats-btn"></button>
      <button type="button" class="icon-btn" id="sfx-btn" aria-pressed="false"></button>
    </div>
  </header>

  <!-- Status: mines left, message, time -->
  <div id="status">
    <span class="stat"><span data-i18n="st.mines">Mines</span><strong id="mines">0</strong></span>
    <span id="turn" aria-live="polite"></span>
    <span class="stat"><strong id="time">0:00</strong><span data-i18n="st.time">Time</span></span>
  </div>

  <main id="board-wrap">
    <div id="board" tabindex="0"></div>
  </main>

  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="../i18n.js?v=4.99.00" data-app="minesweeper"></script>
  <script src="../gamekit/daily.js?v=4.99.00"></script>
  <script src="minesweeper.js?v=4.99.00"></script>

</body>
</html>
