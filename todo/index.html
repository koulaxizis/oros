<!DOCTYPE html>
<html lang="en" data-skin="oros" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>To-Do · orOS</title>
  <link rel="stylesheet" href="todo.css?v=0.23.0">
</head>
<body>

  <!-- Tabs (one per list) + new list button.
       Tab = click to switch, dblclick/pencil = settings,
       horizontal drag = reorder. -->
  <header id="tabbar-wrap">
    <nav id="tabs" role="tablist" aria-label="Lists"></nav>
        <button id="tab-add"></button>
  </header>

  <!-- Quick-add bar (always ready, natural date parsing) -->
  <div id="addbar">
    <input id="quick-add" type="text" autocomplete="off" spellcheck="false"
           data-i18n-ph="quick.add">
       <button id="quick-add-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>

  <!-- List controls: hide-completed | search | label filter | clear | settings -->
  <div id="controls">
    <label class="ctrl" id="hide-done-wrap">
      <input type="checkbox" id="hide-completed">
      <span data-i18n="hide.completed">Hide completed</span>
    </label>
    <span class="spacer"></span>

    <div id="search-wrap">
      <input id="search" type="search" autocomplete="off" spellcheck="false"
             placeholder="Search…" data-i18n-ph="search.ph">
      <button type="button" id="search-clear" hidden aria-label="Clear search"
              data-i18n-title="search.clear" title="Clear">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div id="filter-slot">
      <button type="button" id="filter-btn" aria-label="Filter by label"
              data-i18n-title="filter.title" title="Filter by label">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
        <span id="filter-count" hidden>0</span>
      </button>
      <div id="filter-pop" hidden></div>
    </div>

    <button class="ctrl-btn" id="clear-completed" data-i18n="clear.completed">Clear completed</button>
    <button class="ctrl-btn icon" id="list-settings"
            data-i18n-title="list.settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
  </div>

  <!-- Items (also renders flattened cross-list search results) -->
  <main id="list-scroll">
    <ul id="items"></ul>
    <div id="empty" hidden>
      <span data-i18n="empty.title">Nothing here yet</span>
      <small data-i18n="empty.hint">Add your first task above.</small>
    </div>
    <div id="no-match" hidden>
      <span data-i18n="search.none">No matches</span>
      <small data-i18n="search.none.hint">Try another term or clear the label filter.</small>
    </div>
    <div id="filtered" hidden>
      <span data-i18n="filtered.title">All tasks are completed</span>
      <small data-i18n="filtered.hint">Turn off “Hide completed” to see them.</small>
    </div>
  </main>

  <!-- Item detail dialog (tap item label to open) -->
  <dialog id="dlg-item">
    <form method="dialog" id="item-form" autocomplete="off">
      <h3 data-i18n="item.title">Task</h3>

      <label data-i18n="item.text">Text</label>
      <input id="f-text" type="text" required>

      <label data-i18n="item.due">Due date</label>
      <input id="f-due" type="date">

      <label data-i18n="item.notes">Notes</label>
      <textarea id="f-notes" rows="4"></textarea>

      <!-- Labels (same UI/contract as Kanban) -->
      <label data-i18n="item.labels">Labels</label>
      <div id="f-lbl-chips"></div>
      <button type="button" id="f-lbl-toggle" class="ghost">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span data-i18n="labels.manage">Add / manage labels</span>
      </button>
      <div id="f-lbl-picker" hidden>
        <div id="f-lbl-list"></div>
        <div class="lbl-new">
          <input id="f-lbl-name" type="text" placeholder="New label…"
                 data-i18n-ph="labels.newph" maxlength="24">
          <div id="f-lbl-swatches"></div>
          <button type="button" id="f-lbl-new-add" data-i18n="labels.add">Add</button>
        </div>
      </div>

      <!-- Extra info: free key-value fields (same contract as Kanban) -->
      <label data-i18n="item.info">Extra info</label>
      <div id="f-info-list"></div>
      <button type="button" id="f-info-add" class="ghost">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span data-i18n="item.info.add">Add field</span>
      </button>

      <fieldset>
        <legend data-i18n="recur.title">Repeat</legend>
        <label class="radio"><input type="radio" name="f-rec" value="none" checked>
          <span data-i18n="recur.none">Never</span></label>
        <label class="radio"><input type="radio" name="f-rec" value="on">
          <span data-i18n="recur.every">Every</span></label>
        <div id="rec-editor">
          <input id="f-every" type="number" min="1" step="1" value="1">
          <select id="f-unit">
            <option value="day"   data-i18n="unit.day">days</option>
            <option value="week"  data-i18n="unit.week">weeks</option>
            <option value="month" data-i18n="unit.month">months</option>
          </select>
          <select id="f-weekday"></select>
        </div>
      </fieldset>

      <menu>
        <button type="button" id="f-delete" class="danger" data-i18n="item.delete">Delete</button>
        <span class="spacer"></span>
        <button type="submit" data-i18n="save">Save</button>
      </menu>
    </form>
  </dialog>

  <!-- List settings dialog (rename, list-level recurrence, delete) -->
  <dialog id="dlg-list">
    <form method="dialog" id="list-form" autocomplete="off">
      <h3 data-i18n="list.settings">List settings</h3>

      <label data-i18n="list.name">Name</label>
      <input id="l-name" type="text" required>

      <fieldset>
        <legend data-i18n="recur.list.title">List cycle</legend>
        <p class="hint" data-i18n="recur.list.hint">When a cycle ends, all checks are cleared automatically.</p>
        <label class="radio"><input type="radio" name="l-rec" value="none" checked>
          <span data-i18n="recur.none">Never</span></label>
        <label class="radio"><input type="radio" name="l-rec" value="on">
          <span data-i18n="recur.every">Every</span></label>
        <div id="rec-editor-list">
          <input id="l-every" type="number" min="1" step="1" value="1" aria-label="Interval" data-i18n-title="interval.aria">
          <select id="l-unit">
            <option value="day"   data-i18n="unit.day">days</option>
            <option value="week"  data-i18n="unit.week">weeks</option>
            <option value="month" data-i18n="unit.month">months</option>
          </select>
          <select id="l-weekday"></select>
        </div>
        <p class="hint" id="l-next-reset"></p>
      </fieldset>

      <menu>
        <button type="button" id="l-delete" class="danger" data-i18n="list.delete">Delete list</button>
        <span class="spacer"></span>
        <button type="submit" data-i18n="save">Save</button>
      </menu>
    </form>
  </dialog>

  <!-- Undo / feedback toast -->
  <div id="toast" role="status"></div>

  <script src="todo.js?v=0.23.0"></script>
</body>
</html>
