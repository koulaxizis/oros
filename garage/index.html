<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-uCFbCqyZCCbuPW83IW2RZInvsB3ZKvigqnnYEWoYvdc='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=garage" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Garage · orOS</title>

  <link rel="stylesheet" href="garage.css?v=5.02.00">

</head>
<body>

  <header id="toolbar">
    <div class="tabs" role="tablist">
      <button type="button" class="tab" id="tab-home" role="tab" data-view="home"></button>
      <button type="button" class="tab" id="tab-log" role="tab" data-view="log"></button>
      <button type="button" class="tab" id="tab-stats" role="tab" data-view="stats"></button>
    </div>
    <span class="spacer"></span>
    <button type="button" class="icon-btn" id="settings-btn"></button>
    <button type="button" class="txt-btn primary" id="add-btn"></button>
  </header>

  <nav id="vbar" hidden></nav>

  <main id="main">
    <!-- Overview: the vehicle, what is coming, quick add, plans -->
    <section id="view-home" class="view" role="tabpanel" aria-labelledby="tab-home"></section>

    <!-- Log: every entry, month by month -->
    <section id="view-log" class="view" role="tabpanel" aria-labelledby="tab-log" hidden>
      <div id="log-filter" class="chips"></div>
      <div id="log-list"></div>
    </section>

    <!-- Stats: costs, consumption, fuel price -->
    <section id="view-stats" class="view" role="tabpanel" aria-labelledby="tab-stats" hidden>
      <div id="stats-range" class="chips"></div>
      <div id="stats-body"></div>
    </section>

    <div id="empty" class="view empty" hidden></div>
  </main>

  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>
  <div id="print-area" aria-hidden="true"></div>

  <script src="../i18n.js?v=5.02.00" data-app="garage,recordpkg"></script>
  <script src="core.js?v=5.02.00"></script>
  <script src="../atelier/zip.js?v=5.02.00"></script>
  <script src="../importkit.js?v=5.02.00"></script>
  <script src="import.js?v=5.02.00"></script>
  <script src="receipt.js?v=5.02.00"></script>
  <script src="logbook.js?v=5.02.00"></script>
  <script src="../bundle.js?v=5.02.00"></script>
  <script src="../recordpkg.js?v=5.02.00"></script>
  <script src="package.js?v=5.02.00"></script>
  <script src="../household/core.js?v=5.02.00"></script>
  <script src="../household/whole.js?v=5.02.00"></script>
  <script src="../household/share.js?v=5.02.00"></script>
  <script src="../household/group.js?v=5.02.00"></script>
  <script src="house.js?v=5.02.00"></script>
  <script src="garage.js?v=5.02.00"></script>

</body>
</html>
