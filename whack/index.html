<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-pn5AWBHyAJ5RR4+vw3EELRpuIN0EcjfTA8KzLISytz0='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=whack" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Whack-a-Mole · orOS</title>

  <link rel="stylesheet" href="whack.css?v=5.02.00">

</head>
<body>

  <!-- Toolbar: one line on a wide screen, two scrolling strips on a phone -->
  <header id="toolbar">
    <div class="tb-row" id="tb-a">
      <div class="seg" id="level-seg" role="group">
        <button type="button" class="seg-btn" data-level="e" data-i18n="level.e">Easy</button>
        <button type="button" class="seg-btn" data-level="m" data-i18n="level.m">Medium</button>
        <button type="button" class="seg-btn" data-level="h" data-i18n="level.h">Hard</button>
      </div>
    </div>
    <div class="tb-row" id="tb-b">
      <span class="spacer"></span>
      <button type="button" class="icon-btn" id="new-btn"></button>
      <button type="button" class="icon-btn" id="stats-btn"></button>
      <button type="button" class="icon-btn" id="sfx-btn" aria-pressed="false"></button>
    </div>
  </header>

  <!-- Status: score, message, time left -->
  <div id="status">
    <span class="stat"><span data-i18n="st.score">Score</span><strong id="score">0</strong></span>
    <span id="turn" aria-live="polite"></span>
    <span class="stat"><strong id="time">0:30</strong><span data-i18n="st.time">Time</span></span>
  </div>

  <main id="board-wrap">
    <div id="field">
      <div id="board"></div>
      <div id="overlay">
        <button type="button" id="start-btn"></button>
        <div id="count" aria-hidden="true"></div>
      </div>
    </div>
  </main>

  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="../i18n.js?v=5.02.00" data-app="whack"></script>
  <script src="whack.js?v=5.02.00"></script>

</body>
</html>
