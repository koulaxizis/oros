<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-h8DlJrKZux9mPxuXS2+eOaP5EFixYwq6Z9f474Za4jY='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=petcare" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pet Health Book · orOS</title>

  <link rel="stylesheet" href="petcare.css?v=4.99.00">

</head>
<body>

  <header id="toolbar">
    <div class="tabs" role="tablist">
      <button type="button" class="tab" id="tab-up" role="tab" data-view="up"></button>
      <button type="button" class="tab" id="tab-pets" role="tab" data-view="pets"></button>
    </div>
    <button type="button" class="icon-btn" id="back-btn" hidden></button>
    <span class="bar-title" id="bar-title" hidden></span>
    <span class="spacer"></span>
    <button type="button" class="icon-btn" id="settings-btn"></button>
    <button type="button" class="txt-btn primary" id="add-btn"></button>
  </header>
  <div id="sets" class="sets" hidden></div>

  <main id="main">
    <!-- Upcoming: late, today, next 30 days (every pet) -->
    <section id="view-up" class="view" role="tabpanel" aria-labelledby="tab-up">
      <div id="bday-banner" class="banner bday" hidden></div>
      <div id="up-list"></div>
      <div id="up-empty" class="empty" hidden></div>
    </section>

    <!-- All pets -->
    <section id="view-pets" class="view" role="tabpanel" aria-labelledby="tab-pets" hidden>
      <div id="pet-grid"></div>
      <div id="pets-empty" class="empty" hidden></div>
    </section>

    <!-- One pet: overview, health book, weight, food -->
    <section id="view-pet" class="view" hidden>
      <div id="pet-head"></div>
      <div class="subtabs" id="subtabs" role="tablist"></div>
      <div id="pet-body"></div>
    </section>
  </main>

  <div id="print-area" aria-hidden="true"></div>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="../i18n.js?v=4.99.00" data-app="petcare,recordpkg"></script>
  <script src="core.js?v=4.99.00"></script>
  <script src="../bundle.js?v=4.99.00"></script>
  <script src="../recordpkg.js?v=4.99.00"></script>
  <script src="package.js?v=4.99.00"></script>
  <script src="../household/core.js?v=4.99.00"></script>
  <script src="../household/whole.js?v=4.99.00"></script>
  <script src="../household/share.js?v=4.99.00"></script>
  <script src="house.js?v=4.99.00"></script>
  <script src="petcare.js?v=4.99.00"></script>

</body>
</html>
