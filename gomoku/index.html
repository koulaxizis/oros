<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gomoku · orOS</title>

  <link rel="stylesheet" href="gomoku.css">

</head>
<body>

  <!-- Toolbar: one line on a wide screen, two scrolling strips on a phone -->
  <header id="toolbar">
    <div class="tb-row" id="tb-a">
      <div class="seg" id="mode-seg" role="group">
        <button type="button" class="seg-btn" data-mode="ai" data-i18n="mode.ai">vs Computer</button>
        <button type="button" class="seg-btn" data-mode="duo" data-i18n="mode.duo">2 players</button>
      </div>
      <div class="seg" id="level-seg" role="group">
        <button type="button" class="seg-btn" data-level="e" data-i18n="level.e">Easy</button>
        <button type="button" class="seg-btn" data-level="m" data-i18n="level.m">Medium</button>
        <button type="button" class="seg-btn" data-level="h" data-i18n="level.h">Hard</button>
      </div>
      <button type="button" class="icon-btn" id="new-btn"></button>
    </div>
    <div class="tb-row" id="tb-b">
      <select id="color-select" aria-label="Your colour">
        <option value="b" data-i18n="color.b">You: black</option>
        <option value="w" data-i18n="color.w">You: white</option>
      </select>
      <span class="spacer"></span>
      <button type="button" class="icon-btn" id="undo-btn"></button>
      <button type="button" class="icon-btn" id="stats-btn"></button>
      <button type="button" class="icon-btn" id="sfx-btn" aria-pressed="false"></button>
    </div>
  </header>

  <!-- Status: black and its score on the left, white on the right; turn in the middle -->
  <div id="status">
    <span class="side" id="side0"><i class="st s1" aria-hidden="true"></i><span id="name0"></span><strong id="score0">0</strong></span>
    <span id="turn" aria-live="polite"></span>
    <span class="side" id="side1"><strong id="score1">0</strong><span id="name1"></span><i class="st s2" aria-hidden="true"></i></span>
  </div>

  <main id="board-wrap">
    <div id="board"></div>
  </main>

  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="gomoku.js"></script>

</body>
</html>
