<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-xgJ8dQkftKmg2MgB+3XVeNYgnJg5mStFjYv7Lk6L+cM='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=calendar" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Calendar · orOS</title>

  <link rel="stylesheet" href="calendar.css?v=4.99.00">

</head>
<body>
  <main id="cmain">

    <!-- ===== Month/week navigation ===== -->
    <header id="cal-top">
      <div id="cal-nav">
        <button id="cal-prev" type="button" data-i18n-aria="cal.prev">‹</button>
        <button id="cal-today" type="button" class="nav-mini" data-i18n="cal.today"></button>
        <button id="cal-next" type="button" data-i18n-aria="cal.next">›</button>
        <button id="cal-import" type="button" class="nav-mini" data-i18n="cal.import"></button>
        <button id="cal-export" type="button" class="nav-mini" data-i18n="cal.export"></button>
        <button id="cal-stats" type="button" class="nav-mini" data-i18n="cal.stats"></button>
        <button id="cal-mirror" type="button" class="nav-mini" data-i18n="ph.btn" hidden></button>
        <div class="more-wrap">
          <button id="cal-more" type="button" class="nav-mini" aria-haspopup="true" aria-expanded="false" aria-controls="more-menu"></button>
          <div id="more-menu" class="more-menu" hidden>
            <button id="mm-subs" type="button" data-i18n="mm.subs"></button>
            <button id="mm-dav" type="button" data-i18n="mm.dav"></button>
            <button id="mm-free" type="button" data-i18n="mm.free"></button>
            <button id="mm-send" type="button" data-i18n="mm.send" hidden></button>
            <button id="mm-google" type="button" data-i18n="mm.google" hidden></button>
            <button id="mm-print" type="button" data-i18n="mm.print"></button>
            <!-- .oroscal: the orOS file of every event and label -->
            <button id="mm-osave" type="button" data-i18n="mm.osave" hidden></button>
            <button id="mm-oopen" type="button" data-i18n="mm.oopen" hidden></button>
            <button id="mm-ofolder" type="button" data-i18n="mm.ofolder" hidden></button>
          </div>
        </div>
      </div>
      <h2 id="cal-title"></h2>
    </header>

    <!-- ===== View switcher + search ===== -->
    <div id="view-bar">
      <div class="view-switch" role="group">
        <button id="vw-day" type="button" class="view-btn" data-i18n="vw.day"></button>
        <button id="vw-week" type="button" class="view-btn" data-i18n="vw.week"></button>
        <button id="vw-month" type="button" class="view-btn active" data-i18n="vw.month"></button>
        <button id="vw-year" type="button" class="view-btn" data-i18n="vw.year"></button>
        <button id="vw-agenda" type="button" class="view-btn" data-i18n="vw.agenda"></button>
      </div>
      <!-- Month only: coloured dots (off) or event names (on) -->
      <button id="vw-names" type="button" class="names-tg" aria-pressed="false" data-i18n="mm.names.short" data-i18n-aria="mm.names" hidden></button>
      <input id="search-in" type="search" autocomplete="off"
             data-i18n-ph="cal.search.ph">
    </div>

    <!-- ===== Label filter chips =====
         Phones: folded behind one toggle (many chips filled the
         screen). Desktop: chips stay inline, toggle hidden. -->
    <div id="lbl-bar">
      <button id="lbl-toggle" type="button" aria-expanded="false"
              aria-controls="lbl-chips"></button>
      <div id="lbl-chips"></div>
    </div>

    <!-- ===== Month view ===== -->
    <div id="cal-wd"></div>
    <div id="cal-grid"></div>

    <!-- ===== Week view ===== -->
    <div id="week-grid" hidden></div>

    <!-- ===== Day view (hour grid) ===== -->
    <div id="day-view" hidden></div>

    <!-- ===== Year view (12 small months) ===== -->
    <div id="year-grid" hidden></div>

    <!-- ===== Agenda view ===== -->
    <ul id="agenda-list" hidden></ul>

    <!-- ===== Search results (replaces the active view) ===== -->
    <ul id="search-results" hidden></ul>

    <!-- ===== Selected day ===== -->
    <section class="sec">
      <div class="sec-head">
        <span id="day-title"></span>
        <span class="sec-btns">
          <button id="ev-quick" type="button" class="mini" data-i18n="qa.btn"></button>
          <button id="ev-add" type="button" class="mini" data-i18n="ev.add"></button>
        </span>
      </div>
      <div id="nd-line" class="nd-line" hidden></div>
      <ul id="ev-list"></ul>
    </section>
  </main>

  <!-- Event dialog (add & edit share it) -->
  <dialog id="ev-dlg" aria-labelledby="ev-dlg-title">
    <h3 id="ev-dlg-title" data-i18n="ev.dlg.new"></h3>
    <p id="ev-dav-ro" class="del-text dav-ro-note" data-i18n="ev.dav.ro" hidden></p>
    <div class="ev-form">
      <label for="ev-title" data-i18n="ev.field.title"></label>
      <input id="ev-title" type="text" maxlength="80" data-i18n-ph="ev.ph.title">

      <div class="date-pair">
        <div>
          <label for="ev-date" data-i18n="ev.field.date"></label>
          <input type="date" id="ev-date">
        </div>
        <div>
          <label for="ev-date-end" data-i18n="ev.field.dateend"></label>
          <input type="date" id="ev-date-end">
        </div>
      </div>

      <label class="chk">
        <input id="ev-allday" type="checkbox">
        <span data-i18n="ev.allday"></span>
      </label>

      <label for="ev-start" data-i18n="ev.field.when"></label>
      <div class="tp-row">
        <div class="tp-wrap">
          <input id="ev-start" type="text" autocomplete="off" inputmode="numeric" data-i18n-ph="ev.ph.start">
          <div id="ev-start-menu" class="tp-menu" hidden></div>
        </div>
        <span class="tp-sep">–</span>
        <div class="tp-wrap">
          <input id="ev-end" type="text" autocomplete="off" inputmode="numeric" data-i18n-ph="ev.end.none">
          <div id="ev-end-menu" class="tp-menu" hidden></div>
        </div>
      </div>

      <div id="ev-tz-row" class="tz-row">
        <label for="ev-tz" data-i18n="ev.field.tz"></label>
        <select id="ev-tz"></select>
      </div>

      <label for="ev-repeat" data-i18n="ev.field.repeat"></label>
      <select id="ev-repeat"></select>

      <div id="ev-rep-custom" class="rep-box" hidden>
        <div class="rep-line">
          <label for="ev-rep-n" data-i18n="rep.every"></label>
          <input type="number" id="ev-rep-n" min="1" max="999" step="1" inputmode="numeric">
          <select id="ev-rep-unit" data-i18n-aria="ev.field.repeat"></select>
        </div>
        <div id="ev-rep-days" class="rep-days" role="group"></div>
        <select id="ev-rep-mode" data-i18n-aria="ev.field.repeat"></select>
      </div>

      <div class="dlg-row" id="ev-until-row">
        <label for="ev-ends" data-i18n="rep.ends"></label>
        <select id="ev-ends"></select>
        <input type="date" id="ev-until" data-i18n-aria="rep.ends.on" hidden>
        <input type="number" id="ev-count" min="1" max="999" step="1" inputmode="numeric" data-i18n-aria="rep.ends.n" hidden>
        <span id="ev-count-lab" class="rep-times" data-i18n="rep.times" hidden></span>
      </div>
      <div id="ev-rep-sum" class="span-hint" aria-live="polite" hidden></div>

      <label for="ev-remind" data-i18n="ev.field.remind"></label>
      <select id="ev-remind"></select>

      <label for="ev-location" data-i18n="ev.field.loc"></label>
      <input id="ev-location" type="text" maxlength="150" data-i18n-ph="ev.ph.loc">

      <label data-i18n="cal.filters.lbl"></label>
      <div id="ev-label-row" class="chip-row"></div>

      <label for="ev-note" data-i18n="ev.field.note"></label>
      <textarea id="ev-note" rows="3" maxlength="500" data-i18n-ph="ev.ph.note"></textarea>
    </div>
    <div class="dlg-row">
      <button id="ev-save" type="button" class="btn prim" data-i18n="ev.save"></button>
      <button id="ev-cancel" type="button" class="btn" data-i18n="ev.cancel"></button>
    </div>
    <div class="dlg-row" id="ev-del-row">
      <button id="ev-qr" type="button" class="btn" data-i18n="ev.qr" hidden></button>
      <button id="ev-track" type="button" class="btn" data-i18n="ev.track" hidden></button>
      <button id="ev-mail" type="button" class="btn" data-i18n="ev.mail" hidden></button>
      <button id="ev-share" type="button" class="btn" data-i18n="ev.share" hidden></button>
      <button id="ev-delete" type="button" class="btn danger" data-i18n="ev.delete"></button>
    </div>
  </dialog>

  <!-- Delete confirmation (R14 themed dialog) -->
  <dialog id="del-dlg" aria-labelledby="del-dlg-title">
    <h3 id="del-dlg-title" data-i18n="ev.delete"></h3>
    <p id="del-dlg-text" class="del-name"></p>
    <p class="del-text" data-i18n="ev.delete.confirm"></p>
    <div class="dlg-row">
      <button id="del-dlg-yes" type="button" class="btn danger" data-i18n="ev.del.yes"></button>
      <button id="del-dlg-no" type="button" class="btn" data-i18n="ev.cancel"></button>
    </div>
  </dialog>

  <!-- Wave 3: occurrence vs series chooser -->
  <dialog id="ser-dlg" aria-labelledby="ser-q">
    <h3 id="ser-q"></h3>
    <div class="dlg-row">
      <button id="ser-this" type="button" class="btn" data-i18n="ser.this"></button>
      <button id="ser-all" type="button" class="btn prim" data-i18n="ser.all"></button>
    </div>
  </dialog>

  <!-- Label management -->
  <dialog id="lbl-dlg" aria-labelledby="lbl-dlg-title">
    <h3 id="lbl-dlg-title" data-i18n="lbl.manage"></h3>
    <div id="lbl-list"></div>
    <div class="lbl-add-row">
      <input id="lbl-new-name" type="text" maxlength="40" data-i18n-ph="lbl.ph.name">
      <button id="lbl-add" type="button" class="btn prim" data-i18n="lbl.new"></button>
    </div>
    <div id="lbl-add-colors" class="lbl-palette lbl-add-palette"></div>
    <div class="dlg-row">
      <button id="lbl-done" type="button" class="btn prim" data-i18n="lbl.done"></button>
    </div>
  </dialog>

  <!-- BR-HH: share / stop sharing / delete a shared calendar -->
  <dialog id="hh-dlg" aria-labelledby="hh-dlg-title">
    <h3 id="hh-dlg-title"></h3>
    <p id="hh-dlg-text" class="del-text"></p>
    <p id="hh-dlg-nohh" class="del-text" data-i18n="hh.nohh" hidden></p>
    <input id="hh-dlg-name" class="hh-dlg-box" type="text" maxlength="40" data-i18n-aria="hh.loose.name" hidden>
    <select id="hh-dlg-box" class="hh-dlg-box" data-i18n-aria="hh.share" hidden></select>
    <div class="dlg-row">
      <button id="hh-dlg-go" type="button" class="btn prim"></button>
      <button id="hh-dlg-no" type="button" class="btn" data-i18n="ev.cancel"></button>
    </div>
  </dialog>

  <!-- ICS import preview (never a silent import) -->
  <dialog id="imp-dlg" aria-labelledby="imp-dlg-title">
    <h3 id="imp-dlg-title" data-i18n="imp.title"></h3>
    <p id="imp-name" class="del-name"></p>
    <p id="imp-sum" class="del-text"></p>
    <p id="imp-notes" class="del-text" hidden></p>
    <div class="dlg-row">
      <button id="imp-go" type="button" class="btn prim" data-i18n="imp.go"></button>
      <button id="imp-no" type="button" class="btn" data-i18n="ev.cancel"></button>
    </div>
  </dialog>
  <input id="ics-file" type="file" accept=".ics,text/calendar" hidden>

  <!-- One-time import from Google Calendar (gcal.js, ../google-import.js) -->
  <dialog id="gi-dlg" aria-labelledby="gi-dlg-title">
    <h3 id="gi-dlg-title" data-i18n="gi.title"></h3>
    <p class="del-text" data-i18n="gi.text"></p>
    <div id="gi-pick" hidden>
      <p class="gi-head" data-i18n="gi.pick"></p>
      <div id="gi-list" class="gi-list"></div>
      <p class="del-text gi-small" data-i18n="gi.lbl"></p>
    </div>
    <p id="gi-stat" class="del-text" aria-live="polite"></p>
    <p class="del-text gi-small" data-i18n="gi.own"></p>
    <div class="dlg-row">
      <button id="gi-go" type="button" class="btn prim" data-i18n="imp.go" hidden></button>
      <button id="gi-no" type="button" class="btn" data-i18n="gi.close"></button>
    </div>
  </dialog>

  <!-- On this phone (BR-PHONE, Android app only) -->
  <dialog id="ph-dlg" aria-labelledby="ph-dlg-title">
    <h3 id="ph-dlg-title" data-i18n="ph.title"></h3>
    <p class="del-text" data-i18n="ph.text"></p>
    <label class="ph-row"><input id="ph-on" type="checkbox"> <span data-i18n="ph.on"></span></label>
    <p id="ph-stat" class="del-text" aria-live="polite"></p>
    <div class="dlg-row">
      <button id="ph-allow" type="button" class="btn prim" data-i18n="ph.allow"></button>
      <button id="ph-close" type="button" class="btn" data-i18n="ph.close"></button>
    </div>
  </dialog>

  <!-- Quick add (wave 8): one line of words -> the event window -->
  <dialog id="qa-dlg" aria-labelledby="qa-dlg-title">
    <h3 id="qa-dlg-title" data-i18n="qa.title"></h3>
    <form id="qa-form" method="dialog">
      <input id="qa-in" type="text" maxlength="300" autocomplete="off" enterkeyhint="go" data-i18n-ph="qa.ph" data-i18n-aria="qa.title">
      <p class="del-text qa-hint" data-i18n="qa.hint"></p>
      <dl id="qa-prev" class="qa-prev" aria-live="polite"></dl>
      <div class="dlg-row">
        <button id="qa-go" type="submit" class="btn prim" data-i18n="qa.go"></button>
        <button id="qa-no" type="button" class="btn" data-i18n="ev.cancel"></button>
      </div>
    </form>
  </dialog>

  <!-- Subscribed calendars (wave 8) -->
  <dialog id="subs-dlg" aria-labelledby="subs-dlg-title">
    <h3 id="subs-dlg-title" data-i18n="subs.title"></h3>
    <p class="del-text" data-i18n="subs.text"></p>
    <ul id="subs-list" class="subs-list"></ul>
    <label for="sub-url" data-i18n="subs.url"></label>
    <input id="sub-url" type="url" inputmode="url" autocomplete="off" maxlength="2000" data-i18n-ph="subs.url.ph">
    <label for="sub-name" data-i18n="subs.name"></label>
    <input id="sub-name" type="text" maxlength="40" data-i18n-ph="subs.name.ph">
    <div id="sub-colors" class="lbl-palette lbl-add-palette" role="group" data-i18n-aria="lbl.color"></div>
    <p id="sub-msg" class="del-text sub-msg" aria-live="polite" hidden></p>
    <div class="dlg-row">
      <button id="sub-add" type="button" class="btn prim" data-i18n="subs.add"></button>
      <button id="sub-done" type="button" class="btn" data-i18n="lbl.done"></button>
    </div>
  </dialog>

  <!-- CalDAV wave 3: labels linked to calendars on the person's own server -->
  <dialog id="dav-dlg" aria-labelledby="dav-dlg-title">
    <h3 id="dav-dlg-title" data-i18n="dav.title"></h3>
    <p class="del-text" data-i18n="dav.text"></p>
    <p id="dav-noacct" class="del-text" data-i18n="dav.noacct" hidden></p>
    <div id="dav-set-row" class="dlg-row" hidden>
      <button id="dav-settings" type="button" class="btn" data-i18n="dav.settings"></button>
    </div>
    <ul id="dav-list" class="subs-list"></ul>
    <div id="dav-prev" class="dav-prev" hidden>
      <p id="dav-prev-text" class="del-text" aria-live="polite"></p>
      <div class="dlg-row">
        <button id="dav-prev-go" type="button" class="btn prim" data-i18n="dav.link"></button>
        <button id="dav-prev-no" type="button" class="btn" data-i18n="ev.cancel"></button>
      </div>
    </div>
    <div class="dlg-row">
      <button id="dav-done" type="button" class="btn" data-i18n="lbl.done"></button>
    </div>
  </dialog>

  <!-- A subscribed calendar's event (read-only) -->
  <dialog id="sv-dlg" aria-labelledby="sv-title">
    <h3 id="sv-title"></h3>
    <p id="sv-when" class="del-text"></p>
    <p id="sv-where" class="del-text" hidden></p>
    <p id="sv-note" class="del-text sv-note" hidden></p>
    <p id="sv-src" class="del-text sv-src"></p>
    <div class="dlg-row">
      <button id="sv-copy" type="button" class="btn" data-i18n="sv.copy"></button>
      <button id="sv-close" type="button" class="btn prim" data-i18n="ph.close"></button>
    </div>
  </dialog>

  <!-- Send a whole calendar or a date range (share wave 3, kind "cal") -->
  <dialog id="scal-dlg" aria-labelledby="scal-dlg-title">
    <h3 id="scal-dlg-title" data-i18n="sc.title"></h3>
    <p class="del-text" data-i18n="sc.text"></p>
    <div class="ev-form">
      <label for="sc-lbl" data-i18n="sc.which"></label>
      <select id="sc-lbl"></select>
      <label for="sc-range" data-i18n="sc.range"></label>
      <select id="sc-range"></select>
      <div id="sc-dates" class="date-pair" hidden>
        <div>
          <label for="sc-from" data-i18n="sc.from"></label>
          <input id="sc-from" type="date">
        </div>
        <div>
          <label for="sc-to" data-i18n="sc.to"></label>
          <input id="sc-to" type="date">
        </div>
      </div>
    </div>
    <p id="sc-sum" class="span-hint" aria-live="polite"></p>
    <div class="dlg-row">
      <button id="sc-go" type="button" class="btn prim" data-i18n="sc.go"></button>
      <button id="sc-no" type="button" class="btn" data-i18n="ev.cancel"></button>
    </div>
  </dialog>

  <!-- Share free times (wave 8): a booking link, no server -->
  <dialog id="free-dlg" aria-labelledby="free-dlg-title">
    <h3 id="free-dlg-title" data-i18n="fr.title"></h3>
    <p class="del-text" data-i18n="fr.text"></p>
    <div class="ev-form">
      <label for="fr-what" data-i18n="fr.what"></label>
      <input id="fr-what" type="text" maxlength="120" data-i18n-ph="fr.what.ph">
      <div class="date-pair">
        <div>
          <label for="fr-len" data-i18n="fr.len"></label>
          <select id="fr-len"></select>
        </div>
        <div>
          <label for="fr-days" data-i18n="fr.days"></label>
          <select id="fr-days"></select>
        </div>
      </div>
      <div class="date-pair">
        <div>
          <label for="fr-from" data-i18n="fr.from"></label>
          <select id="fr-from"></select>
        </div>
        <div>
          <label for="fr-to" data-i18n="fr.to"></label>
          <select id="fr-to"></select>
        </div>
      </div>
      <label class="chk"><input id="fr-wknd" type="checkbox"> <span data-i18n="fr.wknd"></span></label>
      <label for="fr-name" data-i18n="fr.name"></label>
      <input id="fr-name" type="text" maxlength="80" autocomplete="name">
      <label for="fr-mail" data-i18n="fr.mail"></label>
      <input id="fr-mail" type="email" maxlength="120" autocomplete="email" data-i18n-ph="fr.mail.ph">
      <label for="fr-loc" data-i18n="ev.field.loc"></label>
      <input id="fr-loc" type="text" maxlength="150" data-i18n-ph="fr.loc.ph">
    </div>
    <p id="fr-sum" class="span-hint" aria-live="polite"></p>
    <div class="dlg-row">
      <button id="fr-go" type="button" class="btn prim" data-i18n="fr.go"></button>
      <button id="fr-no" type="button" class="btn" data-i18n="ev.cancel"></button>
    </div>
  </dialog>

  <!-- Print copy of the current view (wave 8): built just before printing -->
  <div id="print-area" aria-hidden="true"></div>

  <dialog id="stat-dlg" aria-labelledby="stat-dlg-title">
    <h3 id="stat-dlg-title" data-i18n="stat.title"></h3>
    <div id="stat-body"></div>
    <div class="dlg-row">
      <button id="stat-done" type="button" class="btn prim" data-i18n="lbl.done"></button>
    </div>
  </dialog>

  <script src="../i18n.js?v=4.99.00" data-app="calendar,recordpkg,google-import"></script>
  <script src="../plants/core.js?v=4.99.00"></script>
  <script src="../chores/core.js?v=4.99.00"></script>
  <script src="../petcare/core.js?v=4.99.00"></script>
  <script src="../petcare/house.js?v=4.99.00"></script>
  <script src="../garage/core.js?v=4.99.00"></script>
  <script src="../household/group.js?v=4.99.00"></script>
  <script src="../garage/house.js?v=4.99.00"></script>
  <script src="../baby/core.js?v=4.99.00"></script>
  <script src="../together/core.js?v=4.99.00"></script>
  <script src="../together/house.js?v=4.99.00"></script>
  <script src="../travel/core.js?v=4.99.00"></script>
  <script src="../meals/core.js?v=4.99.00"></script>
