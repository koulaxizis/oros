<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Calendar · orOS</title>
  <link rel="stylesheet" href="calendar.css?v=0.35.00">
</head>
<body>
  <main id="cmain">

    <!-- ===== Month navigation ===== -->
    <header id="cal-top">
      <div id="cal-nav">
        <button id="cal-prev" type="button" data-i18n-aria="cal.prev">‹</button>
        <button id="cal-today" type="button" class="nav-mini" data-i18n="cal.today"></button>
        <button id="cal-next" type="button" data-i18n-aria="cal.next">›</button>
      </div>
      <h2 id="cal-title"></h2>
    </header>

    <!-- ===== Label filter chips ===== -->
    <div id="lbl-chips"></div>

    <!-- ===== Month grid ===== -->
    <div id="cal-wd"></div>
    <div id="cal-grid"></div>

    <!-- ===== Selected day ===== -->
    <section class="sec">
      <div class="sec-head">
        <span id="day-title"></span>
        <button id="ev-add" type="button" class="mini" data-i18n="ev.add"></button>
      </div>
      <ul id="ev-list"></ul>
    </section>
  </main>

  <!-- Event dialog (add & edit share it) -->
  <dialog id="ev-dlg">
    <h3 id="ev-dlg-title" data-i18n="ev.dlg.new"></h3>
    <div class="ev-form">
      <label for="ev-title" data-i18n="ev.field.title"></label>
      <input id="ev-title" type="text" maxlength="80" data-i18n-ph="ev.ph.title">

      <label class="chk">
        <input id="ev-allday" type="checkbox">
        <span data-i18n="ev.allday"></span>
      </label>

      <label for="ev-start" data-i18n="ev.field.when"></label>
      <div class="tp-row">
        <div class="tp-wrap">
          <input id="ev-start" type="text" autocomplete="off" inputmode="numeric">
          <div id="ev-start-menu" class="tp-menu" hidden></div>
        </div>
        <span class="tp-sep">–</span>
        <div class="tp-wrap">
          <input id="ev-end" type="text" autocomplete="off" inputmode="numeric" data-i18n-ph="ev.end.none">
          <div id="ev-end-menu" class="tp-menu" hidden></div>
        </div>
      </div>

      <label for="ev-repeat" data-i18n="ev.field.repeat"></label>
      <select id="ev-repeat">
        <option value="" data-i18n="rep.none"></option>
        <option value="D-1" data-i18n="rep.daily"></option>
        <option value="W-1" data-i18n="rep.weekly"></option>
        <option value="W-2" data-i18n="rep.biweekly"></option>
        <option value="M-1" data-i18n="rep.monthly"></option>
        <option value="Y-1" data-i18n="rep.yearly"></option>
      </select>

      <div class="dlg-row" id="ev-until-row">
        <label for="ev-until" data-i18n="ev.field.until"></label>
        <input type="date" id="ev-until">
      </div>

      <label for="ev-remind" data-i18n="ev.field.remind"></label>
      <select id="ev-remind"></select>

      <label for="ev-location" data-i18n="ev.field.loc"></label>
      <input id="ev-location" type="text" maxlength="150" data-i18n-ph="ev.ph.loc">

      <label data-i18n="cal.filters.lbl"></label>
      <div id="ev-label-row" class="chip-row"></div>

      <label for="ev-note" data-i18n="ev.field.note"></label>
      <textarea id="ev-note" rows="3" maxlength="500" data-i18n-ph="ev.ph.note"></textarea>
    </div>
    <div class="dlg-row">
      <button id="ev-save" type="button" class="btn prim" data-i18n="ev.save"></button>
      <button id="ev-cancel" type="button" class="btn" data-i18n="ev.cancel"></button>
    </div>
    <div class="dlg-row" id="ev-del-row">
      <button id="ev-delete" type="button" class="btn danger" data-i18n="ev.delete"></button>
    </div>
  </dialog>

  <!-- Delete confirmation (R14 themed dialog) -->
  <dialog id="del-dlg">
    <h3 data-i18n="ev.delete"></h3>
    <p id="del-dlg-text" class="del-name"></p>
    <p class="del-text" data-i18n="ev.delete.confirm"></p>
    <div class="dlg-row">
      <button id="del-dlg-yes" type="button" class="btn danger" data-i18n="ev.del.yes"></button>
      <button id="del-dlg-no" type="button" class="btn" data-i18n="ev.cancel"></button>
    </div>
  </dialog>

  <!-- Wave 3: occurrence vs series chooser -->
  <dialog id="ser-dlg">
    <h3 id="ser-q"></h3>
    <div class="dlg-row">
      <button id="ser-this" type="button" class="btn" data-i18n="ser.this"></button>
      <button id="ser-all" type="button" class="btn prim" data-i18n="ser.all"></button>
    </div>
  </dialog>

  <!-- Label management -->
  <dialog id="lbl-dlg">
    <h3 data-i18n="lbl.manage"></h3>
    <div id="lbl-list"></div>
    <div class="lbl-add-row">
      <input id="lbl-new-name" type="text" maxlength="40" data-i18n-ph="lbl.ph.name">
      <button id="lbl-add" type="button" class="btn prim" data-i18n="lbl.new"></button>
    </div>
    <div id="lbl-add-colors" class="lbl-palette lbl-add-palette"></div>
    <div class="dlg-row">
      <button id="lbl-done" type="button" class="btn prim" data-i18n="lbl.done"></button>
    </div>
  </dialog>

  <script src="calendar.js?v=0.35.00"></script>
</body>
</html>
