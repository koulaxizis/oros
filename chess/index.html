<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && !/[?&]standalone\b/.test(location.search)) location.replace("../?open=chess" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chess · orOS</title>

  <link rel="stylesheet" href="chess.css?v=1.88.03">

</head>
<body>

  <!-- Toolbar: one line on a wide screen, two scrolling strips on a phone -->
  <header id="toolbar">
    <div class="tb-row" id="tb-a">
      <div class="seg" id="mode-seg" role="group">
        <button type="button" class="seg-btn" data-mode="ai" data-i18n="mode.ai">vs Computer</button>
        <button type="button" class="seg-btn" data-mode="duo" data-i18n="mode.duo">2 players</button>
      </div>
      <div class="seg" id="level-seg" role="group">
        <button type="button" class="seg-btn" data-level="e" data-i18n="level.e">Easy</button>
        <button type="button" class="seg-btn" data-level="m" data-i18n="level.m">Medium</button>
        <button type="button" class="seg-btn" data-level="h" data-i18n="level.h">Hard</button>
      </div>
    </div>
    <div class="tb-row" id="tb-b">
      <select id="side-select" aria-label="Your pieces">
        <option value="w" data-i18n="side.w">As white</option>
        <option value="b" data-i18n="side.b">As black</option>
        <option value="r" data-i18n="side.r">Random side</option>
      </select>
      <span class="spacer"></span>
      <button type="button" class="icon-btn" id="new-btn"></button>
      <button type="button" class="icon-btn" id="undo-btn"></button>
      <button type="button" class="icon-btn" id="flip-btn"></button>
      <button type="button" class="icon-btn" id="stats-btn"></button>
      <button type="button" class="icon-btn" id="pgn-btn"></button>
      <button type="button" class="icon-btn" id="sfx-btn" aria-pressed="false"></button>
    </div>
  </header>

  <!-- Status: the two sides (material lead), whose turn / result -->
  <div id="status">
    <span class="side" id="side-w"><i class="chip w" aria-hidden="true"></i><span id="name-w"></span><em id="adv-w"></em></span>
    <span id="turn" aria-live="polite"></span>
    <span class="side" id="side-b"><em id="adv-b"></em><span id="name-b"></span><i class="chip b" aria-hidden="true"></i></span>
  </div>

  <main id="play">
    <div id="board-wrap">
      <div id="board"></div>
    </div>
    <aside id="moves-wrap">
      <div id="moves-head"><span data-i18n="moves.title">Moves</span><span id="unrated" data-i18n="st.unrated" hidden>Unrated</span></div>
      <ol id="moves"></ol>
      <!-- Review of an opened PGN: step through it, analysis, play on -->
      <div id="review-bar" hidden>
        <div class="rv-nav">
          <button type="button" class="icon-btn" id="rv-first"></button>
          <button type="button" class="icon-btn" id="rv-prev"></button>
          <button type="button" class="icon-btn" id="rv-next"></button>
          <button type="button" class="icon-btn" id="rv-last"></button>
          <button type="button" class="rv-btn" id="rv-ana" aria-pressed="false" data-i18n="rv.ana">Analysis</button>
          <button type="button" class="rv-btn primary" id="rv-play" data-i18n="rv.play">Play from here</button>
        </div>
        <div id="rv-eval" aria-live="polite" hidden></div>
        <div id="rv-info" hidden></div>
      </div>
    </aside>
  </main>

  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="chess.js?v=1.88.03"></script>

</body>
</html>
