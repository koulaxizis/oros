<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mahjong · orOS</title>

  <link rel="stylesheet" href="mahjong.css?v=0.65.03">

</head>
<body>

  <!-- Toolbar: one line on a wide screen, two scrolling strips on a phone -->
  <header id="toolbar">
    <div class="tb-row" id="tb-a">
      <div class="seg" id="lay-seg" role="group">
        <button type="button" class="seg-btn" data-lay="turtle" data-i18n="lay.turtle">Turtle</button>
        <button type="button" class="seg-btn" data-lay="pyramid" data-i18n="lay.pyramid">Pyramid</button>
        <button type="button" class="seg-btn" data-lay="fortress" data-i18n="lay.fortress">Fortress</button>
      </div>
    </div>
    <div class="tb-row" id="tb-b">
      <span class="spacer"></span>
      <button type="button" class="icon-btn" id="hint-btn"></button>
      <button type="button" class="icon-btn" id="undo-btn"></button>
      <button type="button" class="icon-btn" id="shuffle-btn"></button>
      <button type="button" class="icon-btn" id="zoom-btn" aria-pressed="false"></button>
      <button type="button" class="icon-btn" id="new-btn"></button>
      <button type="button" class="icon-btn" id="stats-btn"></button>
      <button type="button" class="icon-btn" id="sfx-btn" aria-pressed="false"></button>
    </div>
  </header>

  <!-- Status: time, message, tiles left -->
  <div id="status">
    <span class="stat"><span data-i18n="st.time">Time</span><strong id="time">0:00</strong></span>
    <span id="turn" aria-live="polite"></span>
    <span class="stat"><strong id="left">0</strong><span data-i18n="st.left">Tiles</span></span>
  </div>

  <main id="board-wrap">
    <div id="board" role="group"></div>
  </main>

  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="mahjong.js?v=0.65.03"></script>

</body>
</html>
