<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-zW+CuxRLap2/08UQmIfG3RjSx1Cp/h9RIMHflVwFfMM='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=stock" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stock · orOS</title>

  <link rel="stylesheet" href="stock.css?v=5.02.00">

</head>
<body>

  <header id="toolbar">
    <div class="tabs" role="tablist">
      <button type="button" class="tab" id="tab-items" role="tab" data-view="items"></button>
      <button type="button" class="tab" id="tab-moves" role="tab" data-view="moves"></button>
      <button type="button" class="tab" id="tab-order" role="tab" data-view="order"></button>
      <button type="button" class="tab" id="tab-sups" role="tab" data-view="sups"></button>
      <button type="button" class="tab" id="tab-reports" role="tab" data-view="reports"></button>
    </div>
    <span class="spacer"></span>
    <button type="button" class="icon-btn" id="settings-btn"></button>
    <button type="button" class="txt-btn primary" id="add-btn"></button>
  </header>

  <main id="main">
    <!-- Products: totals, search / scan, filters, the list -->
    <section id="view-items" class="view" role="tabpanel" aria-labelledby="tab-items">
      <div id="items-tiles" class="tiles"></div>
      <div class="scan-row">
        <input type="search" id="items-q" autocomplete="off" spellcheck="false" enterkeyhint="search">
      </div>
      <div class="filter-row">
        <div id="items-chips" class="chips"></div>
        <select id="items-wh" hidden></select>
        <select id="items-cat"></select>
        <select id="items-sort"></select>
      </div>
      <ul id="items-list" class="rows"></ul>
    </section>

    <!-- Movements: the ledger, day by day -->
    <section id="view-moves" class="view" role="tabpanel" aria-labelledby="tab-moves" hidden>
      <div class="filter-row">
        <div id="moves-chips" class="chips"></div>
        <select id="moves-range"></select>
      </div>
      <div id="moves-list"></div>
    </section>

    <!-- Reorder: purchase orders, then low items by supplier -->
    <section id="view-order" class="view" role="tabpanel" aria-labelledby="tab-order" hidden>
      <div id="po-list"></div>
      <div id="order-list"></div>
    </section>

    <!-- Suppliers -->
    <section id="view-sups" class="view" role="tabpanel" aria-labelledby="tab-sups" hidden>
      <ul id="sups-list" class="rows"></ul>
    </section>

    <!-- Reports: value, period totals, best sellers, dead stock -->
    <section id="view-reports" class="view" role="tabpanel" aria-labelledby="tab-reports" hidden>
      <div class="filter-row">
        <select id="rep-range"></select>
        <span class="spacer"></span>
        <div id="rep-acts" class="dlg-actions tight"></div>
      </div>
      <div id="rep-tiles" class="tiles"></div>
      <div id="rep-body"></div>
    </section>

    <div id="empty" class="view empty" hidden></div>
  </main>

  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="../i18n.js?v=5.02.00" data-app="stock,recordpkg,links"></script>
  <script src="core.js?v=5.02.00"></script>
  <script src="../importkit.js?v=5.02.00"></script>
  <script src="import.js?v=5.02.00"></script>
  <script src="pos-core.js?v=5.02.00"></script>
  <script src="pos.js?v=5.02.00"></script>
  <script src="../links/core.js?v=5.02.00"></script>
  <script src="../links/woo.js?v=5.02.00"></script>
  <script src="shop.js?v=5.02.00"></script>
  <script src="consign.js?v=5.02.00"></script>
  <script src="prices.js?v=5.02.00"></script>
  <script src="pricelist.js?v=5.02.00"></script>
  <script src="../bundle.js?v=5.02.00"></script>
  <script src="../recordpkg.js?v=5.02.00"></script>
  <script src="package.js?v=5.02.00"></script>
  <script src="stock.js?v=5.02.00"></script>

</body>
</html>
