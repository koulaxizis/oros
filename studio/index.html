<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Studio · orOS</title>

  <link rel="stylesheet" href="studio.css?v=1.20.00">

</head>
<body>

  <header id="toolbar">
    <button type="button" id="proj-btn" class="icon-btn" aria-haspopup="dialog"></button>
    <button type="button" id="title-btn" class="title">
      <span id="title-view" class="title-main"></span>
      <span id="title-sub" class="title-sub"></span>
    </button>
    <span class="spacer"></span>
    <button type="button" id="undo-btn" class="icon-btn"></button>
    <button type="button" id="redo-btn" class="icon-btn"></button>
    <button type="button" id="import-btn" class="icon-btn"></button>
    <button type="button" id="export-btn" class="icon-btn" aria-haspopup="dialog"></button>
    <button type="button" id="more-btn" class="icon-btn" aria-haspopup="dialog"></button>
  </header>

  <div id="transport" role="toolbar" data-i18n-aria="transport.label">
    <div class="tp-keys">
      <button type="button" id="home-btn" class="tbtn"></button>
      <button type="button" id="play-btn" class="tbtn"></button>
      <button type="button" id="stop-btn" class="tbtn"></button>
      <button type="button" id="rec-btn" class="tbtn rec"></button>
      <button type="button" id="loop-btn" class="tbtn" aria-pressed="false"></button>
    </div>
    <div id="clock" class="clock" aria-live="off">
      <span id="clock-time">0:00.000</span>
      <span id="clock-bar">1.1</span>
    </div>
    <div class="tp-opts">
      <label class="tp-field"><span class="sr-only" data-i18n="f.bpm">Tempo (BPM)</span>
        <input type="number" id="bpm-in" min="30" max="300" step="1" inputmode="numeric"><span class="unit">BPM</span></label>
      <label class="tp-field"><span class="sr-only" data-i18n="f.sig">Beats in a bar</span>
        <select id="sig-in"></select></label>
      <button type="button" id="metro-btn" class="chip" aria-pressed="false" data-i18n="btn.metro">Click</button>
      <label class="tp-field"><span class="tp-lbl" data-i18n="snap.lbl">Snap</span>
        <select id="snap-in"></select></label>
      <button type="button" id="zoom-out" class="icon-btn small"></button>
      <button type="button" id="zoom-in" class="icon-btn small"></button>
    </div>
    <div class="tp-master">
      <label for="master-in" class="tp-lbl" data-i18n="f.master">Master</label>
      <input type="range" id="master-in" min="-60" max="6" step="0.5">
      <canvas id="meter" width="80" height="10" aria-hidden="true"></canvas>
    </div>
  </div>

  <main id="view" tabindex="-1">
    <div id="sheet">
      <div class="row top">
        <div id="corner" class="head"><button type="button" id="add-track" class="link-btn" data-i18n="btn.addTrack">+ Track</button></div>
        <div id="ruler" class="ruler" role="slider" tabindex="0" data-i18n-aria="ruler.label" aria-valuemin="0"></div>
      </div>
      <div id="rows"></div>
      <div id="empty" class="empty" hidden>
        <p data-i18n="empty.hint">Import audio or add a track to start.</p>
      </div>
      <div id="playhead" aria-hidden="true"></div>
    </div>
  </main>

  <!-- The selected clip -->
  <div id="clipbar" hidden>
    <span id="clip-name" class="clip-name"></span>
    <button type="button" id="split-btn" class="chip" data-i18n="btn.split">Split</button>
    <button type="button" id="dupclip-btn" class="chip" data-i18n="btn.dupClip">Duplicate</button>
    <button type="button" id="delclip-btn" class="chip danger" data-i18n="btn.delClip">Delete</button>
    <label class="cb-field"><span data-i18n="f.gain">Gain</span>
      <input type="range" id="gain-in" min="-24" max="12" step="0.5"><output id="gain-out"></output></label>
    <label class="cb-field"><span data-i18n="f.fadeIn">Fade in</span>
      <input type="range" id="fi-in" min="0" max="1" step="0.01"><output id="fi-out"></output></label>
    <label class="cb-field"><span data-i18n="f.fadeOut">Fade out</span>
      <input type="range" id="fo-in" min="0" max="1" step="0.01"><output id="fo-out"></output></label>
    <button type="button" id="clip-close" class="icon-btn small"></button>
  </div>

  <!-- Projects -->
  <dialog id="proj-dlg" aria-labelledby="proj-title">
    <div class="dlg-head">
      <h2 id="proj-title" data-i18n="proj.title">Projects</h2>
      <span class="spacer"></span>
      <button type="button" id="proj-close" class="icon-btn"></button>
    </div>
    <button type="button" id="proj-new" class="chip primary" data-i18n="btn.newProject">New project</button>
    <ul id="proj-list" class="list"></ul>
    <p id="proj-empty" class="hint" data-i18n="proj.empty">No projects yet.</p>
  </dialog>

  <!-- Name prompt (project or track) -->
  <dialog id="name-dlg" aria-labelledby="name-title">
    <form id="name-form" method="dialog">
      <h2 id="name-title"></h2>
      <label for="name-in" class="sr-only" data-i18n="f.name">Name</label>
      <input type="text" id="name-in" maxlength="40" autocomplete="off">
      <div class="dlg-actions">
        <button type="button" id="name-cancel" class="chip" data-i18n="btn.cancel">Cancel</button>
        <button type="submit" class="chip primary" data-i18n="btn.ok">OK</button>
      </div>
    </form>
  </dialog>

  <!-- Track -->
  <dialog id="track-dlg" aria-labelledby="track-title">
    <div class="dlg-head">
      <h2 id="track-title"></h2>
      <span class="spacer"></span>
      <button type="button" id="track-close" class="icon-btn"></button>
    </div>
    <button type="button" id="track-rename" class="chip" data-i18n="btn.rename">Rename</button>
    <h3 data-i18n="sec.color">Colour</h3>
    <div id="track-colors" class="colors" role="radiogroup" data-i18n-aria="sec.color"></div>
    <label class="field" for="tvol-in"><span data-i18n="f.vol">Volume</span><output id="tvol-out"></output></label>
    <input type="range" id="tvol-in" min="-60" max="6" step="0.5">
    <label class="field" for="tpan-in"><span data-i18n="f.pan">Pan</span><output id="tpan-out"></output></label>
    <input type="range" id="tpan-in" min="-100" max="100" step="1">
    <div class="dlg-actions spread">
      <button type="button" id="track-up" class="chip" data-i18n="btn.up">Move up</button>
      <button type="button" id="track-down" class="chip" data-i18n="btn.down">Move down</button>
      <button type="button" id="track-del" class="chip danger" data-i18n="btn.delTrack">Delete track</button>
    </div>
  </dialog>

  <!-- Export -->
  <dialog id="export-dlg" aria-labelledby="export-title">
    <div class="dlg-head">
      <h2 id="export-title" data-i18n="export.title">Export WAV</h2>
      <span class="spacer"></span>
      <button type="button" id="export-close" class="icon-btn"></button>
    </div>
    <p id="export-range" class="hint"></p>
    <h3 data-i18n="sec.bits">Bit depth</h3>
    <div id="export-bits" class="chips" role="radiogroup" data-i18n-aria="sec.bits"></div>
    <h3 data-i18n="sec.rate">Sample rate</h3>
    <div id="export-rate" class="chips" role="radiogroup" data-i18n-aria="sec.rate"></div>
    <p id="export-status" class="hint" aria-live="polite"></p>
    <div class="dlg-actions">
      <button type="button" id="export-go" class="chip primary" data-i18n="btn.export">Export</button>
    </div>
  </dialog>

  <!-- Settings -->
  <dialog id="more-dlg" aria-labelledby="more-title">
    <div class="dlg-head">
      <h2 id="more-title" data-i18n="more.title">Studio settings</h2>
      <span class="spacer"></span>
      <button type="button" id="more-close" class="icon-btn"></button>
    </div>
    <h3 data-i18n="sec.audio">Sound card</h3>
    <label class="field" for="in-dev" data-i18n="f.input">Input (recording)</label>
    <select id="in-dev"></select>
    <label class="field" for="out-dev" data-i18n="f.output">Output</label>
    <select id="out-dev"></select>
    <p id="out-hint" class="hint small" data-i18n="out.hint" hidden>This browser always plays through the system output.</p>
    <button type="button" id="dev-refresh" class="link-btn" data-i18n="btn.devices">Show device names</button>
    <h3 data-i18n="sec.latency">Recording offset</h3>
    <label class="field" for="lat-in"><span data-i18n="f.latency">Move new takes earlier by</span><output id="lat-out"></output></label>
    <input type="range" id="lat-in" min="0" max="300" step="1">
    <p class="hint small" data-i18n="lat.hint"></p>
    <h3 data-i18n="sec.metro">Click</h3>
    <label class="field" for="mvol-in"><span data-i18n="f.metroVol">Click volume</span><output id="mvol-out"></output></label>
    <input type="range" id="mvol-in" min="0" max="100" step="1">
    <p id="disk-info" class="hint small"></p>
  </dialog>

  <div id="busy" hidden><span id="busy-text"></span></div>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="core.js?v=1.20.00"></script>
  <script src="studio.js?v=1.20.00"></script>

</body>
</html>
