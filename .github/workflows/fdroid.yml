name: F-Droid repository

# Publishes the orOS APKs as an F-Droid repository (FDROID-1), so F-Droid,
# Droid-ify and Obtainium keep them up to date:
#   https://koulaxizis.github.io/oros-fdroid/repo
# It runs after each "Android app" build on main, takes the signed APKs
# from the "android-apks" release, and publishes only when the Android
# shell changed since the last publish (android/, the web manifests and
# icons, phone.js, the orOS Drive pin in .github/oros-drive.env): the
# apps' content updates from the web by itself, so a version bump alone
# must not send every phone an update.
# Store texts and pictures (tools/fdroid-metadata.js, tools/fdroid/)
# and this workflow are part of that hash too, and a push touching
# them republishes.
# Run it by hand (Actions → F-Droid repository → Run workflow) with
# "force" to publish anyway.
#
# Secrets (Settings → Secrets and variables → Actions):
#   FDROID_KEYSTORE_BASE64   base64 of the repository signing keystore
#                            (alias "orosrepo", PKCS12; NOT the APK key)
#   FDROID_KEYSTORE_PASSWORD its password (store and key)
#   FDROID_DEPLOY_TOKEN      fine-grained token: koulaxizis/oros-fdroid,
#                            Contents read and write
# The repository's key fingerprint is in solo.js (REPO_FP); a new key
# means every phone has to add the repository again.

on:
  workflow_run:
    workflows: ['Android app']
    types: [completed]
    branches: [main]
  # New store texts or pictures, or a new way of building the
  # repository (no new APKs needed)
  push:
    branches: [main]
    paths: ['tools/fdroid-metadata.js', 'tools/fdroid-keep.js', 'tools/fdroid/**', '.github/workflows/fdroid.yml']
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish even if the Android shell did not change'
        type: boolean
        default: false

permissions:
  # write: the android-v<version> tags official F-Droid builds from
  contents: write

concurrency:
  group: fdroid
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      SITE: https://koulaxizis.github.io/oros-fdroid
      DEST: koulaxizis/oros-fdroid
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Did the Android shell change?
        id: shell
        env:
          FORCE: ${{ inputs.force && '1' || '0' }}
          HAS_SECRETS: ${{ secrets.FDROID_KEYSTORE_BASE64 != '' && secrets.FDROID_DEPLOY_TOKEN != '' }}
        run: |
          if [ "$HAS_SECRETS" != "true" ]; then
            echo "::notice::No F-Droid secrets: nothing published."
            echo "go=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The web manifests count without their "version" line: the
          # version bot (bump-version.yml) stamps it after every release,
          # and that alone must not republish every APK.
          hash=$( {
            git ls-files -s android phone.js icons/solo icons/icon-512.png .github/oros-drive.env .github/workflows/fdroid.yml tools/fdroid-metadata.js tools/fdroid-keep.js tools/fdroid
            for m in $(git ls-files manifest.webmanifest '*/manifest.webmanifest'); do
              echo "$m $(sed -E '/^[[:space:]]*"version"[[:space:]]*:/d' "$m" | sha256sum | cut -d' ' -f1)"
            done
          } | sha256sum | cut -d' ' -f1)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          last=$(curl -fsSL "https://raw.githubusercontent.com/$DEST/main/shell-hash.txt" 2>/dev/null || true)
          if [ "$FORCE" != "1" ] && [ "$hash" = "$last" ]; then
            echo "::notice::Android shell unchanged since the last publish: nothing to do."
            echo "go=0" >> "$GITHUB_OUTPUT"
          else
            echo "go=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.shell.outputs.go == '1'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: steps.shell.outputs.go == '1'
        with:
          node-version: 22

      - name: Build the repository
        if: steps.shell.outputs.go == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          KS_B64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          pip install --quiet fdroidserver==2.4.5
          fd="$RUNNER_TEMP/fd"
          mkdir -p "$fd/repo/icons"
          node tools/fdroid-metadata.js "$fd"
          # fdroid reads repo_icon from its working directory and copies it
          # into repo/icons/ (else it draws a placeholder)
          cp icons/icon-512.png "$fd/icon.png"
          gh release download android-apks --pattern '*.apk' --dir "$fd/repo"
          # Every published APK must have its metadata, and the other way round
          node -e '
            const fs = require("fs"), dir = process.argv[1];
            const want = Object.keys(JSON.parse(fs.readFileSync(dir + "/apks.json", "utf8"))).sort();
            const got = fs.readdirSync(dir + "/repo").filter((f) => f.endsWith(".apk")).sort();
            if (JSON.stringify(want) !== JSON.stringify(got)) { console.error("APKs", got, "metadata", want); process.exit(1); }
          ' "$fd"
          # One file name per build (<package>_<versionCode>_<sha256 8>.apk;
          # the hash too, since an unstamped merge keeps the versionCode).
          # A fixed name (oros.apk) changes under the same URL: the Pages CDN and the phone's half-finished download keep
          # the old bytes while the new index has the new hash, so F-Droid
          # says "Hash not matching" and the resumed download gets 416.
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          for f in "$fd"/repo/*.apk; do
            b=$(basename "$f")
            want=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))[process.argv[2]] || "")' "$fd/apks.json" "$b")
            badge=$("$aapt2" dump badging "$f" | head -1)
            pkg=$(echo "$badge" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            code=$(echo "$badge" | sed -n "s/^package: .*versionCode='\([0-9]*\)'.*/\1/p")
            if [ -z "$code" ] || [ "$pkg" != "$want" ]; then
              echo "::error::$b: package '$pkg' (metadata '$want'), versionCode '$code'"; exit 1
            fi
            sum=$(sha256sum "$f" | cut -c1-8)
            mv "$f" "$fd/repo/${pkg}_${code}_${sum}.apk"
          done
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/repo.keystore"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          umask 077
          cat > "$fd/config.yml" <<EOF
          repo_url: $SITE/repo
          repo_name: orOS
          repo_description: "orOS and its single apps: notes, calendar, office, money, health, maps and more. Offline-first, no account, no ads, no tracking. Free and open source (MIT), free forever."
          repo_icon: icon.png
          archive_older: 0
          keystore: $RUNNER_TEMP/repo.keystore
          keystorepass: "$KS_PASS"
          keypass: "$KS_PASS"
          repo_keyalias: orosrepo
          keydname: CN=orOS F-Droid repo, O=orOS
          apksigner: $apksigner
          EOF
          (cd "$fd" && fdroid update --pretty)
          rm -f "$RUNNER_TEMP/repo.keystore" "$fd/config.yml"
          # versions.json: package → newest versionCode, for orOS's own
          # "a newer APK is out" note (solo.js apkNotice)
          node -e '
            const fs = require("fs"), dir = process.argv[1];
            const idx = JSON.parse(fs.readFileSync(dir + "/repo/index-v2.json", "utf8"));
            const out = {};
            for (const [pkg, p] of Object.entries(idx.packages)) {
              out[pkg] = Math.max(...Object.values(p.versions).map((v) => v.manifest.versionCode));
            }
            fs.writeFileSync(dir + "/versions.json", JSON.stringify(out, null, 2) + "\n");
            console.log(Object.keys(out).length + " apps in the repository");
          ' "$fd"

      - name: Publish to koulaxizis/oros-fdroid
        if: steps.shell.outputs.go == '1'
        env:
          TOKEN: ${{ secrets.FDROID_DEPLOY_TOKEN }}
          HASH: ${{ steps.shell.outputs.hash }}
        run: |
          set -e
          fd="$RUNNER_TEMP/fd"
          site="$RUNNER_TEMP/site"
          mkdir -p "$site"
          cp -r "$fd/repo" "$site/repo"
          cp "$fd/versions.json" "$site/"
          echo "$HASH" > "$site/shell-hash.txt"
          # Keep the APKs of earlier publishes for 3 days (kept-apks.json:
          # file → when it left the index). A phone downloads with the
          # index it fetched last, often hours old (F-Droid refreshes on
          # Wi-Fi only by default); if that file were gone it would get a
          # 404. Kept files are not in the index, only downloadable.
          prev="$RUNNER_TEMP/prev"
          if GIT_LFS_SKIP_SMUDGE=1 git clone -q --depth 1 "https://github.com/$DEST.git" "$prev"; then
            node tools/fdroid-keep.js "$prev" "$site"
          else
            echo "::warning::Could not read the published repository: earlier APKs not kept."
          fi
          touch "$site/.nojekyll"
          # Front page: how to add the repository, its QR code, the apps
          cp -r "$fd/site/." "$site/"
          cat > "$site/README.md" <<EOF
          # orOS F-Droid repository

          The orOS Android apps, kept up to date by F-Droid, Droid-ify or Obtainium.
          Built by [koulaxizis/oros](https://github.com/koulaxizis/oros) (.github/workflows/fdroid.yml); do not edit by hand.

          Repository: $SITE/repo
          EOF
          cd "$site"
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "orOS F-Droid repository from koulaxizis/oros@${GITHUB_SHA::7}"
          # One commit, replaced each time: the APKs never pile up in history
          git push -q --force "https://x-access-token:$TOKEN@github.com/$DEST.git" main
          echo "Published $(ls repo/*.apk | wc -l) APKs to $SITE/repo"

      # Official F-Droid (online.useoros.twa) builds from source and
      # follows tags: each Android shell change on main gets one
      # android-v<APP_VERSION> tag. Store-only and web-only changes don't.
      - name: Tag the Android shell for F-Droid
        if: steps.shell.outputs.go == '1'
        run: |
          set -e
          git fetch -q --tags origin
          last=$(git tag -l 'android-v*' --sort=-creatordate | head -1)
          # The manifest's "version" line alone (version bot) is no change
          if [ -n "$last" ] && git diff --quiet "$last" HEAD -- android phone.js icons/icon-512.png \
             && git diff --quiet -I '^[[:space:]]*"version"[[:space:]]*:' "$last" HEAD -- manifest.webmanifest; then
            echo "Android shell unchanged since $last"; exit 0
          fi
          v=$(sed -n 's/.*APP_VERSION = "\([0-9][0-9.]*\)".*/\1/p' shell.js | head -1)
          [ -n "$v" ] || { echo "::error::APP_VERSION not found"; exit 1; }
          if git rev-parse -q --verify "refs/tags/android-v$v" >/dev/null; then echo "android-v$v exists"; exit 0; fi
          git tag "android-v$v" HEAD
          git push -q origin "android-v$v"
          echo "Tagged android-v$v"
