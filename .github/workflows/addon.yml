name: Browser add-on

# Packs the orOS browser add-on (extension/, Bible PW-AF1) into one zip
# for Chrome, Edge, Brave and Firefox. Every run checks that
# extension/pm/ is still a byte-for-byte copy of the Passwords vault
# code (.github/scripts/ext-pm.js) and runs the add-on tests.
#
# On main the zip is also published to the GitHub release
# "browser-addon" under a fixed name, so the download page can link to
# it directly (no GitHub account needed):
#   https://github.com/koulaxizis/oros/releases/download/browser-addon/oros-addon.zip

on:
  push:
    branches: [main]
    paths: ['extension/**', 'passwords/pmcrypto.js', 'passwords/pmcore.js', 'passwords/pmkinds.js', 'vendor/hash-wasm/**', '.github/scripts/ext-pm.js', '.github/workflows/addon.yml']
  pull_request:
    paths: ['extension/**', 'passwords/pmcrypto.js', 'passwords/pmcore.js', 'passwords/pmkinds.js', 'vendor/hash-wasm/**', '.github/scripts/ext-pm.js', '.github/workflows/addon.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: addon-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # only used on main, to publish the release asset
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Vault code copy is current
        run: |
          node .github/scripts/ext-pm.js
          git diff --exit-code -- extension/pm || { echo "::error::extension/pm/ is out of date: run node .github/scripts/ext-pm.js"; exit 1; }
      - name: Add-on tests
        run: node --test tests/extension.test.js tests/extension-pm.test.js
      - name: Pack
        run: |
          ver=$(node -p 'require("./extension/manifest.json").version')
          echo "ADDON_VERSION=$ver" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/out"
          (cd extension && zip -qr -X "$RUNNER_TEMP/out/oros-addon.zip" .)
          unzip -l "$RUNNER_TEMP/out/oros-addon.zip" | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: oros-addon
          path: ${{ runner.temp }}/out/oros-addon.zip
          if-no-files-found: error
          retention-days: 14
      - name: Publish to the browser-addon release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="orOS browser add-on $ADDON_VERSION for Chrome, Edge, Brave and Firefox, built from main ($(date -u +%Y-%m-%d)). Install steps: https://useoros.online/download/#addon"
          if ! gh release view browser-addon >/dev/null 2>&1; then
            gh release create browser-addon --target "$GITHUB_SHA" --prerelease --latest=false --title "orOS browser add-on" --notes "$notes"
          fi
          gh release upload browser-addon "$RUNNER_TEMP/out/oros-addon.zip" --clobber
          gh release edit browser-addon --title "orOS browser add-on $ADDON_VERSION" --notes "$notes"
