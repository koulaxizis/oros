name: 'Update Stable URLs'

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview only, no commit)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: update-stable-urls
  cancel-in-progress: false

env:
  BETA_DOMAIN: 'https://koulaxizis.github.io/oros-beta'
  BETA_BASE_HREF: '/oros-beta/'
  BETA_REPO_SLUG: 'oros-beta'
  BETA_GH_PAGES: 'koulaxizis.github.io/oros-beta'

  STABLE_DOMAIN: 'https://useoros.online'
  STABLE_BASE_HREF: '/'
  STABLE_REPO_SLUG: 'oros'
  STABLE_GH_PAGES: 'useoros.online'

  GH_BOT_NAME: 'github-actions[bot]'
  GH_BOT_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'

jobs:
  update-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Guard - Skip if auto-commit
        id: guard
        run: |
          LAST_COMMIT_MSG=$(git log -1 --pretty=%s)
          echo "Last commit: $LAST_COMMIT_MSG"
          if [[ "$LAST_COMMIT_MSG" == *"Auto-update URLs and Version"* ]]; then
            echo "Skipping - this is an automated commit"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Pre-flight - Verify required files exist
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          REQUIRED_FILES=(
            "robots.txt"
            "sitemap.xml"
            "manifest.json"
            "config.js"
            "service-worker.js"
            "index.html"
            "editor.html"
            "converter.html"
            "ai-meta.txt"
            "assets/js/seo.js"
            "assets/js/main.js"
            "assets/js/global-settings.js"
          )
          MISSING=0
          for f in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "MISSING: $f"
              MISSING=$((MISSING + 1))
            else
              echo "FOUND: $f"
            fi
          done
          if [[ $MISSING -gt 0 ]]; then
            echo "$MISSING file(s) missing. Aborting."
            exit 1
          fi
          echo "All required files present."

      - name: Pre-flight - Count beta references before replacement
        if: steps.guard.outputs.skip != 'true'
        id: count-before
        run: |
          set -uo pipefail
          PATTERNS=(
            "$BETA_DOMAIN"
            "$BETA_BASE_HREF"
            "$BETA_REPO_SLUG"
            "koulaxizis.github.io/oros-beta"
            "koulaxizis.github.io"
            "github.com/koulaxizis/blob"
            "Beta Channel"
            "Live Beta"
          )
          TOTAL_FILES=0
          for pat in "${PATTERNS[@]}"; do
            COUNT=$(grep -rl "$pat" . \
              --include='*.html' --include='*.txt' --include='*.xml' \
              --include='*.json' --include='*.js' --include='*.css' \
              --exclude-dir='.git' --exclude-dir='node_modules' --exclude-dir='.github' \
              2>/dev/null | wc -l || echo 0)
            echo "  Pattern '$pat' -> $COUNT file(s)"
            TOTAL_FILES=$((TOTAL_FILES + COUNT))
          done
          echo ""
          echo "Total affected files: $TOTAL_FILES"
          echo "total_files=$TOTAL_FILES" >> $GITHUB_OUTPUT
          if [[ $TOTAL_FILES -eq 0 ]]; then
            echo "No beta references found. Nothing to replace."
            echo "nothing_to_do=true" >> $GITHUB_OUTPUT
          else
            echo "nothing_to_do=false" >> $GITHUB_OUTPUT
          fi

      - name: Backup - Create local snapshot
        if: steps.count-before.outputs.nothing_to_do != 'true'
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BRANCH="snapshot-local-pre-url-update-$TIMESTAMP"
          git branch "$BRANCH"
          echo "Local snapshot branch created: $BRANCH"
          echo "SNAPSHOT_BRANCH=$BRANCH" >> $GITHUB_ENV
          tar -czf "snapshot-backup-$TIMESTAMP.tar.gz" \
            robots.txt sitemap.xml manifest.json \
            config.js service-worker.js \
            index.html editor.html converter.html ai-meta.txt \
            assets/js/seo.js assets/js/main.js assets/js/global-settings.js \
            2>/dev/null || true

      - name: Upload snapshot backup as artifact
        if: steps.count-before.outputs.nothing_to_do != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-backup-${{ github.run_id }}
          path: snapshot-backup-*.tar.gz
          retention-days: 7

      - name: Version Sync - Propagate version from config.js
        if: steps.count-before.outputs.nothing_to_do != 'true'
        run: |
          set -euo pipefail
          echo "=== VERSION SYNC ==="
          CONFIG_VERSION=$(grep -oP "^\s*version:\s*['\"]\K[^'\"]+" config.js | head -1)
          if [[ -z "$CONFIG_VERSION" ]]; then
            echo "Could not extract version from config.js"
            exit 1
          fi
          echo "  config.js version: $CONFIG_VERSION"
          DOTS=$(echo "$CONFIG_VERSION" | tr -cd '.' | wc -c)
          if [[ $DOTS -ge 2 ]]; then
            FULL_VERSION="$CONFIG_VERSION"
          else
            FULL_VERSION="${CONFIG_VERSION}.0"
          fi
          echo "  Full version (manifest/SW): $FULL_VERSION"
          echo "CONFIG_VERSION=$CONFIG_VERSION" >> $GITHUB_ENV
          echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
          if [[ -f "manifest.json" ]]; then
            sed -i "s|\"version\": *\"[^\"]*\"|\"version\": \"$FULL_VERSION\"|" manifest.json
            echo "  manifest.json -> $FULL_VERSION"
          fi
          if [[ -f "service-worker.js" ]]; then
            sed -i "s|CACHE_NAME *= *'oros-v[^']*'|CACHE_NAME = 'oros-v$FULL_VERSION'|" service-worker.js
            sed -i "s|^// Version: [0-9.]*|// Version: $FULL_VERSION|" service-worker.js
            echo "  service-worker.js -> oros-v$FULL_VERSION"
          fi
          if [[ -f "ai-meta.txt" ]]; then
            TODAY=$(date +%Y-%m-%d)
            sed -i "s|^# Version: [0-9.]*|# Version: $CONFIG_VERSION|" ai-meta.txt
            sed -i "s|^# Last Updated: [0-9-]*|# Last Updated: $TODAY|" ai-meta.txt
            echo "  ai-meta.txt -> version=$CONFIG_VERSION, last_updated=$TODAY"
          fi
          echo "Version sync complete."
          echo "======================="

      - name: Replace beta URLs with stable URLs
        if: steps.count-before.outputs.nothing_to_do != 'true'
        run: |
          set -euo pipefail
          echo "Replacing beta -> stable..."
          echo "  Domain: $BETA_DOMAIN -> $STABLE_DOMAIN"
          echo "  Base href: $BETA_BASE_HREF -> $STABLE_BASE_HREF"
          echo "  Repo slug: $BETA_REPO_SLUG -> $STABLE_REPO_SLUG"
          echo "  GH Pages: $BETA_GH_PAGES -> $STABLE_GH_PAGES"
          echo ""
          FILES=(
            "robots.txt"
            "sitemap.xml"
            "manifest.json"
            "config.js"
            "service-worker.js"
            "index.html"
            "editor.html"
            "converter.html"
            "ai-meta.txt"
            "assets/js/seo.js"
            "assets/js/main.js"
            "assets/js/global-settings.js"
          )
          EXTRA_HTML=$(find . -maxdepth 3 -name '*.html' -not -path './.git/*' -not -path './.github/*' -not -path './node_modules/*' -type f 2>/dev/null || true)
          EXTRA_JS=$(find . -maxdepth 3 -name '*.js' -not -path './.git/*' -not -path './node_modules/*' -not -path './.github/*' -type f 2>/dev/null || true)
          EXTRA_CSS=$(find . -maxdepth 3 -name '*.css' -not -path './.git/*' -not -path './node_modules/*' -not -path './.github/*' -type f 2>/dev/null || true)
          EXTRA_TXT=$(find . -maxdepth 3 -name '*.txt' -not -path './.git/*' -not -path './node_modules/*' -not -path './.github/*' -type f 2>/dev/null || true)
          EXTRA_JSON=$(find . -maxdepth 3 -name '*.json' -not -path './.git/*' -not -path './node_modules/*' -not -path './.github/*' -not -name 'package.json' -not -name 'package-lock.json' -type f 2>/dev/null || true)
          EXTRA_XML=$(find . -maxdepth 3 -name '*.xml' -not -path './.git/*' -not -path './node_modules/*' -not -path './.github/*' -type f 2>/dev/null || true)
          ALL_FILES=("${FILES[@]}")
          for f in $EXTRA_HTML $EXTRA_JS $EXTRA_CSS $EXTRA_TXT $EXTRA_JSON $EXTRA_XML; do
            if [[ ! " ${ALL_FILES[*]} " =~ " ${f} " ]]; then
              ALL_FILES+=("$f")
            fi
          done
          REPLACE_COUNT=0
          for file in "${ALL_FILES[@]}"; do
            if [[ ! -f "$file" ]]; then
              continue
            fi
            CHANGED=0
            # 1: Full HTTPS beta domain
            if grep -q "https://koulaxizis\.github\.io/oros-beta" "$file" 2>/dev/null; then
              sed -i 's|https://koulaxizis\.github\.io/oros-beta|https://useoros.online|g' "$file"
              CHANGED=1
            fi
            # 2: Protocol-relative
            if grep -q "//koulaxizis\.github\.io/oros-beta" "$file" 2>/dev/null; then
              sed -i 's|//koulaxizis\.github\.io/oros-beta|//useoros.online|g' "$file"
              CHANGED=1
            fi
            # 3: Bare GH Pages beta
            if grep -q "koulaxizis\.github\.io/oros-beta" "$file" 2>/dev/null; then
              sed -i 's|koulaxizis\.github\.io/oros-beta|useoros.online|g' "$file"
              CHANGED=1
            fi
            # 4: Old stable HTTPS (migration safety)
            if grep -q "https://koulaxizis\.github\.io/oros/" "$file" 2>/dev/null; then
              sed -i 's|https://koulaxizis\.github\.io/oros/|https://useoros.online/|g' "$file"
              CHANGED=1
            fi
            if grep -q 'https://koulaxizis\.github\.io/oros"' "$file" 2>/dev/null; then
              sed -i 's|https://koulaxizis\.github\.io/oros"|https://useoros.online"|g' "$file"
              CHANGED=1
            fi
            # 5: Old stable bare
            if grep -q "koulaxizis\.github\.io/oros/" "$file" 2>/dev/null; then
              sed -i 's|koulaxizis\.github\.io/oros/|useoros.online/|g' "$file"
              CHANGED=1
            fi
            # 6: Base href path
            if grep -q "/oros-beta/" "$file" 2>/dev/null; then
              sed -i 's|/oros-beta/|/|g' "$file"
              CHANGED=1
            fi
            # 7: GitHub repo link
            if grep -q "github\.com/koulaxizis/oros-beta" "$file" 2>/dev/null; then
              sed -i 's|github\.com/koulaxizis/oros-beta|github.com/koulaxizis/oros|g' "$file"
              CHANGED=1
            fi
            # 8: Final slug sweep
            if grep -qE '\boros-beta\b' "$file" 2>/dev/null; then
              sed -i 's|\boros-beta\b|oros|g' "$file"
              CHANGED=1
            fi
            # 9: Bare koulaxizis.github.io (catch-all)
            if grep -q "koulaxizis\.github\.io" "$file" 2>/dev/null; then
              sed -i 's|koulaxizis\.github\.io|useoros.online|g' "$file"
              CHANGED=1
            fi
            # 10: License URL missing repo slug
            if grep -q 'github\.com/koulaxizis/blob' "$file" 2>/dev/null; then
              sed -i 's|github\.com/koulaxizis/blob|github.com/koulaxizis/oros/blob|g' "$file"
              CHANGED=1
            fi
            # 11: UI text - Beta Channel
            if grep -q "Beta Channel" "$file" 2>/dev/null; then
              sed -i 's|Beta Channel|Stable Channel|g' "$file"
              CHANGED=1
            fi
            # 12: UI text - beta warning
            if grep -q "This is a beta version. Features may change." "$file" 2>/dev/null; then
              sed -i 's|This is a beta version. Features may change.|Stable release. Features are production-ready.|g' "$file"
              CHANGED=1
            fi
            # 13: UI text - Live Beta
            if grep -q "Live Beta" "$file" 2>/dev/null; then
              sed -i 's|Live Beta|Live Editor|g' "$file"
              CHANGED=1
            fi
            # 14: UI text - beta version (case variants)
            if grep -qi "beta version" "$file" 2>/dev/null; then
              sed -i 's|Beta version|Stable version|g' "$file" 2>/dev/null || true
              sed -i 's|beta version|stable version|g' "$file" 2>/dev/null || true
              sed -i 's|BETA VERSION|STABLE VERSION|g' "$file" 2>/dev/null || true
              CHANGED=1
            fi
            if [[ $CHANGED -eq 1 ]]; then
              REPLACE_COUNT=$((REPLACE_COUNT + 1))
              echo "  Updated: $file"
            fi
          done
          echo ""
          echo "Total files modified: $REPLACE_COUNT"
          echo "REPLACE_COUNT=$REPLACE_COUNT" >> $GITHUB_ENV

      - name: Post-flight - Verify zero beta references
        if: steps.count-before.outputs.nothing_to_do != 'true'
        run: |
          set -euo pipefail
          echo "Scanning for remaining beta / old-GH-Pages references..."
          echo ""
          FOUND_ISSUES=0
          DOMAIN_HITS=$(grep -rn "koulaxizis\.github\.io/oros-beta" . \
            --include='*.html' --include='*.txt' --include='*.xml' \
            --include='*.json' --include='*.js' --include='*.css' \
            --exclude-dir='.git' --exclude-dir='node_modules' --exclude-dir='.github' \
            2>/dev/null || true)
          if [[ -n "$DOMAIN_HITS" ]]; then
            echo "FAIL: Beta domain still found:"
            echo "$DOMAIN_HITS"
            FOUND_ISSUES=$((FOUND_ISSUES + 1))
          else
            echo "OK: No beta domain references"
          fi
          BARE_GH_HITS=$(grep -rn "koulaxizis\.github\.io" . \
            --include='*.html' --include='*.txt' --include='*.xml' \
            --include='*.json' --include='*.js' --include='*.css' \
            --exclude-dir='.git' --exclude-dir='node_modules' --exclude-dir='.github' \
            2>/dev/null || true)
          if [[ -n "$BARE_GH_HITS" ]]; then
            echo "FAIL: Bare koulaxizis.github.io still found:"
            echo "$BARE_GH_HITS"
            FOUND_ISSUES=$((FOUND_ISSUES + 1))
          else
            echo "OK: No bare koulaxizis.github.io references"
          fi
          HREF_HITS=$(grep -rn "/oros-beta/" . \
            --include='*.html' --include='*.json' --include='*.js' \
            --exclude-dir='.git' --exclude-dir='node_modules' --exclude-dir='.github' \
            2>/dev/null || true)
          if [[ -n "$HREF_HITS" ]]; then
            echo "FAIL: Beta base href still found:"
            echo "$HREF_HITS"
            FOUND_ISSUES=$((FOUND_ISSUES + 1))
          else
            echo "OK: No beta base href references"
          fi
          SLUG_HITS=$(grep -rn "oros-beta" . \
            --include='*.html' --include='*.txt' --include='*.xml' \
            --include='*.json' --include='*.js' --include='*.css' \
            --exclude-dir='.git' --exclude-dir='node_modules' --exclude-dir='.github' \
            2>/dev/null || true)
          if [[ -n "$SLUG_HITS" ]]; then
            echo "FAIL: Beta slug still found:"
            echo "$SLUG_HITS"
            FOUND_ISSUES=$((FOUND_ISSUES + 1))
          else
            echo "OK: No beta slug references"
          fi
          LICENSE_HITS=$(grep -rn 'github\.com/koulaxizis/blob' . \
            --include='*.html' --include='*.txt' --include='*.xml' \
            --include='*.json' --include='*.js' --include='*.css' \
            --exclude-dir='.git' --exclude-dir='node_modules' --exclude-dir='.github' \
            2>/dev/null || true)
          if [[ -n "$LICENSE_HITS" ]]; then
            echo "FAIL: License URL still missing repo slug:"
            echo "$LICENSE_HITS"
            FOUND_ISSUES=$((FOUND_ISSUES + 1))
          else
            echo "OK: License URL has repo slug"
          fi
          BETA_UI_HITS=$(grep -rn "Beta Channel" . \
            --include='*.html' --include='*.js' \
            --exclude-dir='.git' --exclude-dir='node_modules' --exclude-dir='.github' \
            2>/dev/null || true)
          if [[ -n "$BETA_UI_HITS" ]]; then
            echo "FAIL: 'Beta Channel' UI text still found:"
            echo "$BETA_UI_HITS"
            FOUND_ISSUES=$((FOUND_ISSUES + 1))
          else
            echo "OK: No 'Beta Channel' UI text"
          fi
          NEW_DOMAIN_HITS=$(grep -rl "useoros\.online" . \
            --include='*.html' --include='*.txt' --include='*.xml' \
            --include='*.json' --include='*.js' \
            --exclude-dir='.git' --exclude-dir='node_modules' --exclude-dir='.github' \
            2>/dev/null | wc -l || echo 0)
          echo ""
          echo "Files with new domain (useoros.online): $NEW_DOMAIN_HITS"
          if [[ $NEW_DOMAIN_HITS -eq 0 ]]; then
            echo "FAIL: New domain not found anywhere - replacement may have failed!"
            FOUND_ISSUES=$((FOUND_ISSUES + 1))
          else
            echo "OK: New domain present in $NEW_DOMAIN_HITS file(s)"
          fi
          echo ""
          if [[ $FOUND_ISSUES -gt 0 ]]; then
            echo "VERIFICATION FAILED - $FOUND_ISSUES issue(s) found."
            if [[ -n "$SNAPSHOT_BRANCH" ]]; then
              echo "Restoring from local snapshot: $SNAPSHOT_BRANCH"
              git checkout "$SNAPSHOT_BRANCH" -- .
            fi
            exit 1
          else
            echo "VERIFICATION PASSED - All references replaced."
          fi

      - name: Post-flight - Validate JSON/XML/JS integrity
        if: steps.count-before.outputs.nothing_to_do != 'true'
        run: |
          set -euo pipefail
          ERRORS=0
          if [[ -f "manifest.json" ]]; then
            if python3 -m json.tool manifest.json >/dev/null 2>&1; then
              echo "OK: manifest.json - JSON valid"
            else
              echo "FAIL: manifest.json - JSON invalid"
              ERRORS=$((ERRORS + 1))
            fi
          fi
          JS_FILES=(
            "config.js"
            "service-worker.js"
            "assets/js/seo.js"
            "assets/js/main.js"
            "assets/js/global-settings.js"
          )
          for jf in "${JS_FILES[@]}"; do
            if [[ -f "$jf" ]]; then
              if node -c "$jf" 2>/dev/null; then
                echo "OK: $jf - JS syntax OK"
              else
                echo "FAIL: $jf - JS syntax ERROR. Details:"
                node -c "$jf" 2>&1 | head -10 || true
                ERRORS=$((ERRORS + 1))
              fi
            fi
          done
          if [[ -f "sitemap.xml" ]]; then
            if python3 -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml')" 2>/dev/null; then
              echo "OK: sitemap.xml - XML valid"
            else
              echo "FAIL: sitemap.xml - XML invalid"
              ERRORS=$((ERRORS + 1))
            fi
          fi
          if [[ -f "robots.txt" ]]; then
            if grep -q "oros-beta\|koulaxizis\.github\.io" robots.txt; then
              echo "FAIL: robots.txt - still contains beta/old references"
              ERRORS=$((ERRORS + 1))
            elif ! grep -q "useoros\.online" robots.txt; then
              echo "FAIL: robots.txt - missing new domain"
              ERRORS=$((ERRORS + 1))
            else
              echo "OK: robots.txt - clean, new domain present"
            fi
          fi
          for hf in index.html editor.html converter.html; do
            if [[ -f "$hf" ]]; then
              OPEN=$(grep -c '<html' "$hf" || true)
              CLOSE=$(grep -c '</html>' "$hf" || true)
              OPEN=${OPEN:-0}
              CLOSE=${CLOSE:-0}
              if [[ "$OPEN" -ne "$CLOSE" ]]; then
                echo "FAIL: $hf - unbalanced <html> tags"
                ERRORS=$((ERRORS + 1))
              else
                echo "OK: $hf - HTML structure OK"
              fi
            fi
          done
          for hf in index.html editor.html converter.html; do
            if [[ -f "$hf" ]]; then
              if grep -q 'rel="canonical"' "$hf"; then
                if grep -q "useoros\.online" "$hf"; then
                  echo "OK: $hf - canonical with new domain"
                else
                  echo "FAIL: $hf - canonical missing new domain"
                  ERRORS=$((ERRORS + 1))
                fi
              fi
            fi
          done
          if [[ -f "assets/js/seo.js" ]]; then
            if grep -q 'github\.com/koulaxizis/oros/blob' "assets/js/seo.js"; then
              echo "OK: seo.js - license URL has repo slug"
            elif grep -q 'github\.com/koulaxizis/blob' "assets/js/seo.js"; then
              echo "FAIL: seo.js - license URL missing repo slug"
              ERRORS=$((ERRORS + 1))
            else
              echo "INFO: seo.js - no license URL found (may have been removed)"
            fi
          fi
          for hf in index.html editor.html converter.html; do
            if [[ -f "$hf" ]]; then
              PRECONNECT_HITS=$(grep -c 'koulaxizis\.github\.io' "$hf" 2>/dev/null || true)
              PRECONNECT_HITS=${PRECONNECT_HITS:-0}
              if [[ "$PRECONNECT_HITS" -gt 0 ]]; then
                echo "FAIL: $hf - still has koulaxizis.github.io in resource hints"
                ERRORS=$((ERRORS + 1))
              else
                echo "OK: $hf - resource hints clean"
              fi
            fi
          done
          # Version consistency check
          if [[ -n "$CONFIG_VERSION" && -n "$FULL_VERSION" ]]; then
            MANIFEST_VER=$(grep -oP '"version":\s*"\K[^"]+' manifest.json 2>/dev/null || true)
            SW_CACHE=$(grep -oP "CACHE_NAME\s*=\s*'\Koros-v[^']+" service-worker.js 2>/dev/null || true)
            echo ""
            echo "=== VERSION CONSISTENCY CHECK ==="
            echo "  config.js version: $CONFIG_VERSION"
            echo "  manifest.json version: $MANIFEST_VER"
            echo "  service-worker.js: $SW_CACHE"
            echo "  expected manifest: $FULL_VERSION"
            if [[ "$MANIFEST_VER" != "$FULL_VERSION" ]]; then
              echo "FAIL: Version MISMATCH: config=$CONFIG_VERSION, manifest=$MANIFEST_VER"
              ERRORS=$((ERRORS + 1))
            else
              echo "OK: Versions consistent across files"
            fi
          fi
          echo ""
          if [[ $ERRORS -gt 0 ]]; then
            echo "INTEGRITY CHECK FAILED - $ERRORS error(s)."
            if [[ -n "$SNAPSHOT_BRANCH" ]]; then
              git checkout "$SNAPSHOT_BRANCH" -- .
            fi
            exit 1
          else
            echo "INTEGRITY CHECK PASSED - All files valid."
          fi

      - name: Preview - Show diff summary
        if: steps.count-before.outputs.nothing_to_do != 'true'
        run: |
          echo "=== DIFF SUMMARY ==="
          git diff --stat
          echo ""
          echo "Full diff preview (first 500 lines):"
          git diff | head -500
          echo ""
          echo "=== END DIFF ==="
          echo "Modified files: $REPLACE_COUNT"
          if [[ -n "$SNAPSHOT_BRANCH" ]]; then
            echo "Snapshot branch: $SNAPSHOT_BRANCH"
          fi

      - name: Configure git
        if: steps.count-before.outputs.nothing_to_do != 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "$GH_BOT_NAME"
          git config user.email "$GH_BOT_EMAIL"

      - name: Commit changes
        if: steps.count-before.outputs.nothing_to_do != 'true' && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          git add \
            robots.txt sitemap.xml manifest.json \
            config.js service-worker.js \
            index.html editor.html converter.html ai-meta.txt \
            assets/js/seo.js assets/js/main.js assets/js/global-settings.js 2>/dev/null || true
          git add '*.html' '*.js' '*.json' '*.xml' '*.txt' '*.css' ':!.github' ':!node_modules' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git pull --rebase --no-edit origin main || {
            echo "Rebase had conflicts, fetching..."
            git fetch origin main
            git merge origin/main --no-edit || {
              echo "Merge failed. Aborting."
              exit 1
            }
          }
          COMMIT_BODY="Domain: $BETA_DOMAIN -> $STABLE_DOMAIN | Base: $BETA_BASE_HREF -> $STABLE_BASE_HREF | Slug: $BETA_REPO_SLUG -> $STABLE_REPO_SLUG | Version: $CONFIG_VERSION | Files: $REPLACE_COUNT"
          if [[ -n "$SNAPSHOT_BRANCH" ]]; then
            COMMIT_BODY="${COMMIT_BODY} | Snapshot: $SNAPSHOT_BRANCH"
          fi
          COMMIT_BODY="${COMMIT_BODY} | Includes: GH Pages host, license URL, UI text (Beta->Stable)"
          git commit -m "Auto-update URLs and Version" -m "$COMMIT_BODY"
          git push origin main
          echo "Changes committed and pushed to main."

      - name: Notice - Dry run mode
        if: steps.count-before.outputs.nothing_to_do != 'true' && github.event.inputs.dry_run == 'true'
        run: |
          echo "======================================"
          echo "  DRY RUN - No changes committed"
          echo "  Review the diff above."
          echo "  To apply: re-run with dry_run=false"
          echo "======================================"

      - name: Notice - Skipped (auto-commit)
        if: steps.guard.outputs.skip == 'true'
        run: echo "Workflow skipped - automated commit detected."

      - name: Notice - Nothing to replace
        if: steps.count-before.outputs.nothing_to_do == 'true'
        run: echo "No beta references found. Already on stable URLs."

      - name: On failure - Restore instructions
        if: failure()
        run: |
          echo "======================================"
          echo "  WORKFLOW FAILED"
          echo "======================================"
          if [[ -n "$SNAPSHOT_BRANCH" ]]; then
            echo "  Snapshot branch: $SNAPSHOT_BRANCH"
            echo ""
          fi
          echo "  Download artifact:"
          echo "  snapshot-backup-${{ github.run_id }}"
          echo ""
          echo "  To restore manually:"
          echo "  1. Actions -> this run"
          echo "  2. Artifacts section"
          echo "  3. Download snapshot archive"
          echo "  4. Extract and replace files"
          echo "======================================"