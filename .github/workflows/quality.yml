name: Quality gate

# Opens every app of apps.json in Chromium (360 + 1280 px, EN + EL) and fails
# on NEW console errors, horizontal scroll at 360, missing help pages or
# English text left in the Greek UI, runs a two-device sync convergence
# sweep on every merge function (converge.js), an axe-core accessibility
# check (a11y.js) and a size budget for the precache and each app's first
# open (budget.js, budget.json). Known problems live in
# .github/qa/baseline.json (may only shrink). Playwright and axe-core are
# installed here only and never ship with orOS. See OROS_BIBLE.md "Quality gate".

on:
  pull_request:
    paths-ignore: ['**/*.md', 'android/**', '.github/workflows/android.yml', '.github/workflows/fdroid.yml', 'relay/**']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'android/**', 'relay/**']
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright (CI only)
        run: |
          npm install --prefix .github/qa --no-audit --no-fund
          .github/qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Open every app
        run: node .github/qa/smoke.js --shard ${{ matrix.shard }}/4 --out qa-report-${{ matrix.shard }}.json
      - name: Sync convergence of every merge function
        if: success() || failure()
        run: node .github/qa/converge.js --shard ${{ matrix.shard }}/4 --out qa-sync-${{ matrix.shard }}.json
      - name: Accessibility (axe-core, critical and serious)
        if: success() || failure()
        run: node .github/qa/a11y.js --shard ${{ matrix.shard }}/4 --out qa-a11y-${{ matrix.shard }}.json
      - name: First-open size budget
        if: success() || failure()
        run: node .github/qa/budget.js --shard ${{ matrix.shard }}/4 --out qa-budget-${{ matrix.shard }}.json
      - name: Precache size budget
        if: matrix.shard == 1 && (success() || failure())
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ] && git fetch --depth 1 origin "$BASE_REF" && git show FETCH_HEAD:sw.js > "$RUNNER_TEMP/base-sw.js"; then
            node .github/qa/budget.js --precache --base-sw "$RUNNER_TEMP/base-sw.js" --out qa-precache-1.json
          else
            node .github/qa/budget.js --precache --out qa-precache-1.json
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-${{ matrix.shard }}
          path: qa-*-${{ matrix.shard }}.json
          if-no-files-found: ignore
