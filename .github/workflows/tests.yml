name: Tests

# Sync engine merge tests + Games logic tests (tests/*.test.js). Plain
# Node, no build step, no dependencies: node --test tests/*.test.js

on:
  push:
    branches: [main]
    paths: ['sync.js', 'search.js', '**/search.js', 'memory/**', 'connect4/**', 'dots/**', 'tictactoe/**', 'simon/**', 'slider/**', 'netizen/**', 'lightsout/**', 'whack/**', 'snake/**', 'g2048/**', 'wordle/**', 'spot/**', 'hexagon/**', 'chess/**', 'sudoku/**', 'tetris/**', 'minesweeper/**', 'mahjong/**', 'gomoku/**', 'bubble/**', 'checkers/**', 'mastermind/**', 'battleship/**', 'rps/**', 'hangman/**', 'flow/**', 'nonogram/**', 'breakout/**', 'reversi/**', 'mancala/**', 'pong/**', 'backgammon/**', 'petworld/**', 'pet.js', 'launcher.js', 'wallpaper/**', 'mixer/**', 'wheel/**', 'layout/**', 'designkit/**', 'slides/**', 'petcare/**', 'baby/**', 'travel/**', 'zen/**', 'split/**', 'familytree/**', 'budget/**', 'names/**', 'pixel/**', 'passwords/**', 'device/**', 'feeds/**', 'relay/**', 'health/**', 'garage/**', 'timesheet/**', 'mindmap/**', 'atelier/**', 'chores/**', 'crossword/**', 'fitness/**', 'jigsaw/**', 'mail/**', 'meals/**', 'plants/**', 'podcasts/**', 'pubdomain/**', 'qr/**', 'scores/**', 'shelf/**', 'solitaire/**', 'water/**', 'wordsearch/**', 'xeri/**', 'cardkit/**', 'help/**', '**/help.*.txt', 'tests/**', '.github/workflows/tests.yml']
  pull_request:
    paths: ['sync.js', 'search.js', '**/search.js', 'memory/**', 'connect4/**', 'dots/**', 'tictactoe/**', 'simon/**', 'slider/**', 'netizen/**', 'lightsout/**', 'whack/**', 'snake/**', 'g2048/**', 'wordle/**', 'spot/**', 'hexagon/**', 'chess/**', 'sudoku/**', 'tetris/**', 'minesweeper/**', 'mahjong/**', 'gomoku/**', 'bubble/**', 'checkers/**', 'mastermind/**', 'battleship/**', 'rps/**', 'hangman/**', 'flow/**', 'nonogram/**', 'breakout/**', 'reversi/**', 'mancala/**', 'pong/**', 'backgammon/**', 'petworld/**', 'pet.js', 'launcher.js', 'wallpaper/**', 'mixer/**', 'wheel/**', 'layout/**', 'designkit/**', 'slides/**', 'petcare/**', 'baby/**', 'travel/**', 'zen/**', 'split/**', 'familytree/**', 'budget/**', 'names/**', 'pixel/**', 'passwords/**', 'device/**', 'feeds/**', 'relay/**', 'health/**', 'garage/**', 'timesheet/**', 'mindmap/**', 'atelier/**', 'chores/**', 'crossword/**', 'fitness/**', 'jigsaw/**', 'mail/**', 'meals/**', 'plants/**', 'podcasts/**', 'pubdomain/**', 'qr/**', 'scores/**', 'shelf/**', 'solitaire/**', 'water/**', 'wordsearch/**', 'xeri/**', 'cardkit/**', 'help/**', '**/help.*.txt', 'tests/**', '.github/workflows/tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.js
