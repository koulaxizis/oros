name: Tests

# Sync engine merge tests + Games logic tests (tests/*.test.js). Plain
# Node, no build step, no dependencies: node --test tests/*.test.js

on:
  push:
    branches: [main]
    paths: ['sync.js', 'memory/**', 'connect4/**', 'dots/**', 'tictactoe/**', 'simon/**', 'netizen/**', 'tests/**', '.github/workflows/tests.yml']
  pull_request:
    paths: ['sync.js', 'memory/**', 'connect4/**', 'dots/**', 'tictactoe/**', 'simon/**', 'netizen/**', 'tests/**', '.github/workflows/tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.js
