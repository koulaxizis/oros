name: Glarolykoi Android app

# Builds the Glarolykoi app (glarolykoi-android/, net.glarolykoi.android):
# glarolykoi.net in our own WebView, no Google libraries (GL-1). Every
# run builds a debug APK and a release APK, runs the unit tests and
# fails if anything from Google, Firebase or AndroidX, or the
# advertising ID, ends up in the app.
#
# This workflow only checks. The signed release is built by android.yml
# on main (orOS key, decision 2026-11-18), published as
# oros-glarolykoi.apk in the android-apks release and in the orOS
# F-Droid repository.

on:
  push:
    branches: [main]
    paths: ['glarolykoi-android/**', '.github/workflows/glarolykoi-android.yml']
  pull_request:
    paths: ['glarolykoi-android/**', '.github/workflows/glarolykoi-android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: 8.11.1

      # The runner image ships the Android SDK (ANDROID_HOME).
      - name: Unit tests, debug APK and unsigned release
        run: gradle -p glarolykoi-android --no-daemon testDebugUnitTest assembleDebug assembleRelease

      # GL-NOGOOGLE: the promise of this app. Checks the code (dex) and
      # the permissions of every APK built.
      - name: No Google, Firebase, AndroidX or advertising ID
        run: |
          set -e
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          found=0
          for apk in glarolykoi-android/app/build/outputs/apk/*/*.apk; do
            echo "== $apk"
            "$aapt2" dump permissions "$apk" | tee perms.txt
            if grep -Ei 'AD_ID|com\.google|c2dm' perms.txt; then echo "::error::$apk asks for a Google permission"; found=1; fi
            # aapt2 prints "uses-permission: name='android.permission.INTERNET'".
            extra=$(sed -n "s/^uses-permission[^:]*: name='\([^']*\)'.*/\1/p" perms.txt | grep -Ev '^android\.permission\.(INTERNET|ACCESS_NETWORK_STATE|POST_NOTIFICATIONS|RECEIVE_BOOT_COMPLETED)$|DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION$' || true)
            if [ -n "$extra" ]; then echo "::error::$apk asks for a permission outside GL-NOGOOGLE: $extra"; found=1; fi
            rm -rf dex && mkdir dex && unzip -q -o "$apk" 'classes*.dex' -d dex
            if strings dex/*.dex | grep -E 'Lcom/google/(android/gms|firebase)|Lcom/google/firebase|Landroidx/' | head -5 | grep .; then
              echo "::error::$apk contains Google, Firebase or AndroidX code"; found=1
            fi
          done
          exit $found

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: glarolykoi-android
          path: glarolykoi-android/app/build/outputs/apk/*/*.apk
          if-no-files-found: error
          retention-days: 14
