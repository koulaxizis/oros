name: Android app

# Builds the orOS Android app (android/, BR-PHONE): the TWA shell plus
# the native "orOS" account that mirrors Contacts and Calendar into the
# phone. Every run builds a debug APK and an unsigned release (proves
# the code and the R8 rules); with the signing secrets set it also
# signs the release APK and the Play bundle (AAB).
#
# Secrets (Settings → Secrets and variables → Actions), the same upload
# key as the PWABuilder package:
#   OROS_KEYSTORE_BASE64   base64 of signing.keystore
#   OROS_KEYSTORE_PASSWORD, OROS_KEY_ALIAS, OROS_KEY_PASSWORD
#
# On main, the signed APKs are also published to the GitHub release
# "android-apks" with fixed file names, so the download page can link
# to them directly (no GitHub account needed), e.g.
#   https://github.com/koulaxizis/oros/releases/download/android-apks/oros.apk
#   https://github.com/koulaxizis/oros/releases/download/android-apks/oros-notes.apk

on:
  push:
    branches: [main]
    paths: ['android/**', 'phone.js', 'manifest.webmanifest', '*/manifest.webmanifest', 'icons/solo/**', 'shell.js', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'phone.js', 'manifest.webmanifest', '*/manifest.webmanifest', 'icons/solo/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      diag:
        description: 'Diagnostic build: show each phone-bridge step as a toast'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only the "Publish APKs" step uses it (main only)
    # One build per branch at a time, so two quick main pushes cannot
    # upload their APKs out of order.
    concurrency:
      group: android-${{ github.ref }}
      cancel-in-progress: false
    env:
      OROS_DIAG: ${{ inputs.diag && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      # orOS Drive (DRIVE-A): the Go core of koulaxizis/oros-drive at a
      # pinned commit, bound with gomobile into the library the orOS
      # flavour embeds (app/libs/orosdrive.aar, not committed). Moving
      # the pin is a deliberate change, like any dependency update.
      # F-Droid and other builds without the library get the app
      # without the Drive screen (build.gradle driveLib).
      - uses: actions/checkout@v4
        with:
          repository: koulaxizis/oros-drive
          ref: 242b3758b8b248823526f3c2b0526818a54b6193
          path: oros-drive-src
      - uses: actions/setup-go@v5
        with:
          go-version-file: oros-drive-src/go.mod
          cache-dependency-path: oros-drive-src/go.sum
      - name: Build the orOS Drive library (gomobile)
        working-directory: oros-drive-src
        run: |
          go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          mkdir -p ../android/app/libs
          # Phones (arm64, arm) and x86_64 Chromebooks; no 32-bit x86.
          gomobile bind -target=android/arm64,android/arm,android/amd64 -androidapi 24 -javapkg online.useoros.drive -o ../android/app/libs/orosdrive.aar ./mobile
          # Without it Gradle builds the app without Drive: never here.
          test -s ../android/app/libs/orosdrive.aar

      # The runner image ships the Android SDK (ANDROID_HOME); Gradle
      # fetches a missing platform or build-tools on its own.
      - name: Generate manifests and resources (orOS + single apps)
        run: node android/tools/gen.js

      - name: Build debug APK and unsigned release
        run: gradle -p android --no-daemon assembleDebug assembleRelease

      - name: Sign release APK and bundle
        if: github.event_name != 'pull_request'
        env:
          KS_B64: ${{ secrets.OROS_KEYSTORE_BASE64 }}
          OROS_KEYSTORE_PASSWORD: ${{ secrets.OROS_KEYSTORE_PASSWORD }}
          OROS_KEY_ALIAS: ${{ secrets.OROS_KEY_ALIAS }}
          OROS_KEY_PASSWORD: ${{ secrets.OROS_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::notice::No signing secrets: release left unsigned."
            exit 0
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/oros.keystore"
          OROS_KEYSTORE_FILE="$RUNNER_TEMP/oros.keystore" gradle -p android --no-daemon assembleRelease bundleRelease
          rm -f "$RUNNER_TEMP/oros.keystore"

      # The orOS app itself (flavour "oros", online.useoros.twa).
      - uses: actions/upload-artifact@v4
        with:
          name: oros-android
          path: |
            android/app/build/outputs/apk/oros/**/*.apk
            android/app/build/outputs/bundle/orosRelease/*.aab
          if-no-files-found: error

      # Single apps for Google Play (wave 7, android/solo-apps.json):
      # one folder per app, e.g. apk/notes/release/app-notes-release.apk
      # and bundle/notesRelease/app-notes-release.aab.
      - uses: actions/upload-artifact@v4
        with:
          name: oros-single-apps
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
            !android/app/build/outputs/apk/oros/**
            !android/app/build/outputs/bundle/orosRelease/**
          if-no-files-found: error

      # Direct downloads for people who do not use a store (and until
      # the store listings exist). Only signed APKs, only from main.
      - name: Publish APKs to the android-apks release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !inputs.diag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=android/app/build/outputs/apk
          mkdir -p "$RUNNER_TEMP/apks"
          for f in "$out"/*/release/app-*-release.apk; do
            [ -e "$f" ] || continue
            flavour=$(basename "$(dirname "$(dirname "$f")")")
            if [ "$flavour" = "oros" ]; then name=oros.apk; else name="oros-$flavour.apk"; fi
            cp "$f" "$RUNNER_TEMP/apks/$name"
          done
          if [ -z "$(ls -A "$RUNNER_TEMP/apks")" ]; then
            echo "::notice::No signed APKs: nothing published."
            exit 0
          fi
          ver=$(sed -n 's/.*var APP_VERSION = "\([0-9.]*\)".*/\1/p' shell.js)
          notes="orOS Android apps, built from main at orOS $ver ($(date -u +%Y-%m-%d)). Install: open the .apk on the phone and allow installing from this source. An APK from here and the Google Play version are signed with different keys: to switch, uninstall first (sync brings your data back)."
          if ! gh release view android-apks >/dev/null 2>&1; then
            gh release create android-apks --target "$GITHUB_SHA" --prerelease --latest=false --title "orOS Android apps" --notes "$notes"
          fi
          gh release upload android-apks "$RUNNER_TEMP"/apks/*.apk --clobber
          gh release edit android-apks --title "orOS Android apps $ver" --notes "$notes"
          ls -l "$RUNNER_TEMP/apks"
