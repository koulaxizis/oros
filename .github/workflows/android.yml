name: Android app

# Builds the orOS Android app (android/, BR-PHONE): the TWA shell plus
# the native "orOS" account that mirrors Contacts and Calendar into the
# phone. Every run builds a debug APK and an unsigned release (proves
# the code and the R8 rules); with the signing secrets set it also
# signs the release APK and the Play bundle (AAB).
#
# Secrets (Settings → Secrets and variables → Actions), the same upload
# key as the PWABuilder package:
#   OROS_KEYSTORE_BASE64   base64 of signing.keystore
#   OROS_KEYSTORE_PASSWORD, OROS_KEY_ALIAS, OROS_KEY_PASSWORD
#
# On main, the signed APKs are also published to the GitHub release
# "android-apks" with fixed file names, so the download page can link
# to them directly (no GitHub account needed), e.g.
#   https://github.com/koulaxizis/oros/releases/download/android-apks/oros.apk
#   https://github.com/koulaxizis/oros/releases/download/android-apks/oros-notes.apk
# the Glarolykoi app (net.glarolykoi.android, glarolykoi-android/) as
# oros-glarolykoi.apk,
# and orOS Drive (online.useoros.drive, built from koulaxizis/oros-drive
# android/ at the commit in .github/oros-drive.env) as oros-drive.apk,
# and Waymark (site.waymarked.app, built from koulaxizis/waymark
# app/android at the commit in .github/waymark.env) as oros-waymark.apk.

on:
  push:
    branches: [main]
    paths: ['android/**', 'phone.js', 'manifest.webmanifest', '*/manifest.webmanifest', 'studio/remote/manifest.webmanifest', 'icons/solo/**', 'shell.js', '.github/oros-drive.env', '.github/waymark.env', 'glarolykoi-android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'phone.js', 'manifest.webmanifest', '*/manifest.webmanifest', 'studio/remote/manifest.webmanifest', 'icons/solo/**', '.github/oros-drive.env', '.github/waymark.env', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      diag:
        description: 'Diagnostic build: show each phone-bridge step as a toast'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # job takes 8-16 min
    permissions:
      contents: write   # only the "Publish APKs" step uses it (main only)
    # One build per branch at a time, so two quick main pushes cannot
    # upload their APKs out of order.
    concurrency:
      group: android-${{ github.ref }}
      cancel-in-progress: false
    env:
      OROS_DIAG: ${{ inputs.diag && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: 8.11.1

      # orOS Drive (DRIVE-APP): koulaxizis/oros-drive at a pinned commit
      # (.github/oros-drive.env), its Go core bound with gomobile into
      # the library its Android app embeds (android/app/libs there, not
      # committed). Moving the pin is a deliberate change, like any
      # dependency update. The orOS app itself no longer embeds Drive
      # (wave 5): its Drive button opens the orOS Drive app.
      - name: orOS Drive pin
        id: drive
        run: grep -E '^(commit|version)=' .github/oros-drive.env >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: koulaxizis/oros-drive
          ref: ${{ steps.drive.outputs.commit }}
          path: oros-drive-src
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: oros-drive-src/go.mod
          cache-dependency-path: oros-drive-src/go.sum
      - name: Build the orOS Drive library (gomobile)
        working-directory: oros-drive-src
        run: |
          go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          mkdir -p android/app/libs
          # Phones (arm64, arm) and x86_64 Chromebooks; no 32-bit x86.
          gomobile bind -target=android/arm64,android/arm,android/amd64 -androidapi 24 -javapkg online.useoros.drive -o android/app/libs/orosdrive.aar ./mobile
          test -s android/app/libs/orosdrive.aar

      # The runner image ships the Android SDK (ANDROID_HOME); Gradle
      # fetches a missing platform or build-tools on its own.
      - name: Generate manifests and resources (orOS + single apps)
        run: node android/tools/gen.js

      - name: Build debug APK and unsigned release
        run: gradle -p android --no-daemon assembleDebug assembleRelease

      - name: Sign release APK and bundle
        if: github.event_name != 'pull_request'
        env:
          KS_B64: ${{ secrets.OROS_KEYSTORE_BASE64 }}
          OROS_KEYSTORE_PASSWORD: ${{ secrets.OROS_KEYSTORE_PASSWORD }}
          OROS_KEY_ALIAS: ${{ secrets.OROS_KEY_ALIAS }}
          OROS_KEY_PASSWORD: ${{ secrets.OROS_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::notice::No signing secrets: release left unsigned."
            exit 0
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/oros.keystore"
          OROS_KEYSTORE_FILE="$RUNNER_TEMP/oros.keystore" gradle -p android --no-daemon assembleRelease bundleRelease
          rm -f "$RUNNER_TEMP/oros.keystore"

      # The orOS Drive app (online.useoros.drive, DRIVE-APP): that
      # library in oros-drive's own small native app, signed with the
      # orOS key on main. Published as oros-drive.apk below and in the
      # F-Droid repo (tools/fdroid-metadata.js).
      - name: Build the orOS Drive app
        env:
          DRIVE_VERSION: ${{ steps.drive.outputs.version }}
          KS_B64: ${{ github.event_name != 'pull_request' && secrets.OROS_KEYSTORE_BASE64 || '' }}
          OROS_KEYSTORE_PASSWORD: ${{ secrets.OROS_KEYSTORE_PASSWORD }}
          OROS_KEY_ALIAS: ${{ secrets.OROS_KEY_ALIAS }}
          OROS_KEY_PASSWORD: ${{ secrets.OROS_KEY_PASSWORD }}
        run: |
          src=oros-drive-src/android
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/oros.keystore"
            export OROS_KEYSTORE_FILE="$RUNNER_TEMP/oros.keystore"
          fi
          gradle -p "$src" --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/oros.keystore"
          ls -l "$src/app/build/outputs/apk/release/"
          # Signed: next to the orOS APKs, so "Publish APKs" names it
          # oros-drive.apk (flavour folder "drive").
          if [ -f "$src/app/build/outputs/apk/release/app-release.apk" ]; then
            mkdir -p android/app/build/outputs/apk/drive/release
            cp "$src/app/build/outputs/apk/release/app-release.apk" android/app/build/outputs/apk/drive/release/app-drive-release.apk
          fi
      # The Glarolykoi app (net.glarolykoi.android, GL-1: glarolykoi-android/,
      # checked by glarolykoi-android.yml), signed with the orOS key on
      # main (decision 2026-11-18). Published as oros-glarolykoi.apk below
      # and in the F-Droid repository (tools/fdroid-metadata.js).
      - name: Build the Glarolykoi app
        env:
          KS_B64: ${{ github.event_name != 'pull_request' && secrets.OROS_KEYSTORE_BASE64 || '' }}
          GLAROLYKOI_KEYSTORE_PASSWORD: ${{ secrets.OROS_KEYSTORE_PASSWORD }}
          GLAROLYKOI_KEY_ALIAS: ${{ secrets.OROS_KEY_ALIAS }}
          GLAROLYKOI_KEY_PASSWORD: ${{ secrets.OROS_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/glarolykoi.keystore"
            export GLAROLYKOI_KEYSTORE_FILE="$RUNNER_TEMP/glarolykoi.keystore"
          fi
          gradle -p glarolykoi-android --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/glarolykoi.keystore"
          src=glarolykoi-android/app/build/outputs/apk/release
          ls -l "$src/"
          if [ -f "$src/app-release.apk" ]; then
            mkdir -p android/app/build/outputs/apk/glarolykoi/release
            cp "$src/app-release.apk" android/app/build/outputs/apk/glarolykoi/release/app-glarolykoi-release.apk
          fi

      # Waymark (site.waymarked.app): the phone Controller of Waymark
      # Remote, from koulaxizis/waymark (app/android, which packs that
      # repository's remote/ web page) at the commit in .github/waymark.env,
      # signed with the orOS key on main (decision 2026-11-21: published
      # in this F-Droid repository, so Koulaxizis Apps lists it).
      - name: Waymark pin
        id: waymark
        run: grep -E '^(commit|version|build)=' .github/waymark.env >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: koulaxizis/waymark
          ref: ${{ steps.waymark.outputs.commit }}
          path: waymark-src
      - name: Build the Waymark app
        env:
          WAYMARK_VERSION: ${{ steps.waymark.outputs.version }}
          WAYMARK_BUILD: ${{ steps.waymark.outputs.build }}
          KS_B64: ${{ github.event_name != 'pull_request' && secrets.OROS_KEYSTORE_BASE64 || '' }}
          WAYMARK_KEYSTORE_PASSWORD: ${{ secrets.OROS_KEYSTORE_PASSWORD }}
          WAYMARK_KEY_ALIAS: ${{ secrets.OROS_KEY_ALIAS }}
          WAYMARK_KEY_PASSWORD: ${{ secrets.OROS_KEY_PASSWORD }}
        run: |
          src=waymark-src/app/android
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/waymark.keystore"
            export WAYMARK_KEYSTORE="$RUNNER_TEMP/waymark.keystore"
          fi
          gradle -p "$src" --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/waymark.keystore"
          out="$src/app/build/outputs/apk/release"
          ls -l "$out/"
          if [ -f "$out/app-release.apk" ]; then
            mkdir -p android/app/build/outputs/apk/waymark/release
            cp "$out/app-release.apk" android/app/build/outputs/apk/waymark/release/app-waymark-release.apk
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: oros-drive-android
          path: oros-drive-src/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      # The orOS app itself (flavour "oros", online.useoros.twa).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: oros-android
          path: |
            android/app/build/outputs/apk/oros/**/*.apk
            android/app/build/outputs/bundle/orosRelease/*.aab
          if-no-files-found: error
          retention-days: 14

      # Single apps for Google Play (wave 7, android/solo-apps.json):
      # one folder per app, e.g. apk/notes/release/app-notes-release.apk
      # and bundle/notesRelease/app-notes-release.aab.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: oros-single-apps
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
            !android/app/build/outputs/apk/oros/**
            !android/app/build/outputs/bundle/orosRelease/**
          if-no-files-found: error
          retention-days: 14

      # Direct downloads for people who do not use a store (and until
      # the store listings exist). Only signed APKs, only from main.
      - name: Publish APKs to the android-apks release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !inputs.diag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=android/app/build/outputs/apk
          mkdir -p "$RUNNER_TEMP/apks"
          for f in "$out"/*/release/app-*-release.apk; do
            [ -e "$f" ] || continue
            flavour=$(basename "$(dirname "$(dirname "$f")")")
            if [ "$flavour" = "oros" ]; then name=oros.apk; else name="oros-$flavour.apk"; fi
            cp "$f" "$RUNNER_TEMP/apks/$name"
          done
          if [ -z "$(ls -A "$RUNNER_TEMP/apks")" ]; then
            echo "::notice::No signed APKs: nothing published."
            exit 0
          fi
          ver=$(sed -n 's/.*var APP_VERSION = "\([0-9.]*\)".*/\1/p' shell.js)
          notes="orOS Android apps, built from main at orOS $ver ($(date -u +%Y-%m-%d)). Install: open the .apk on the phone and allow installing from this source. An APK from here and the Google Play version are signed with different keys: to switch, uninstall first (sync brings your data back)."
          if ! gh release view android-apks >/dev/null 2>&1; then
            gh release create android-apks --target "$GITHUB_SHA" --prerelease --latest=false --title "orOS Android apps" --notes "$notes"
          fi
          gh release upload android-apks "$RUNNER_TEMP"/apks/*.apk --clobber
          gh release edit android-apks --title "orOS Android apps $ver" --notes "$notes"
          ls -l "$RUNNER_TEMP/apks"
