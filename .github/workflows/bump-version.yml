name: Bump orOS version

# Version stamping is FULLY AUTOMATED — this workflow never
# edits APP_VERSION itself:
#   • push to main  → stamp assets to the CURRENT APP_VERSION
#     (APP_VERSION is bumped MANUALLY in shell.js —
#     that file is the single source of truth and is NEVER
#     touched by this workflow)
#   • manual run    → re-stamp on demand (same rules)
#   • bot commits carry [skip ci] → no feedback loops
#   • docs-only pushes (*.md) never burn a version
# Stamps in ONE pass: read shell.js APP_VERSION → sw.js
# CACHE_VERSION → manifest version → ?v= on every app asset.
# Guards: G1 CACHE_VERSION exists · G2 offline coverage of
# registered (apps.json) app folders in PRECACHE_URLS · G3 palette contract per app · G4
# apps.json <-> folders · G5 root files of index.html in PRECACHE_URLS.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      message:
        description: 'Optional note for your own records (not used in commit)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # job takes about 15 s
    steps:
      # Loop guard (belt+braces on top of GitHub's native [skip ci]):
      # our own stamp commits must never re-trigger this workflow.
      # The commit message reaches the shell through an ENVIRONMENT
      # VARIABLE, never pasted into the script text: pasted, a message
      # with an unbalanced quote broke this step (job fails → no
      # stamps → the release ships with the old CACHE_VERSION and no
      # device updates), and a backtick or $( … ) in it was executed.
      - name: Loop guard
        id: guard
        env:
          HEAD_MSG: ${{ github.event.head_commit && github.event.head_commit.message || '' }}
        run: |
          if [[ "$HEAD_MSG" == *"[skip ci]"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Bot stamp commit — nothing to bump."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Read APP_VERSION from shell.js (single source of truth)
        if: steps.guard.outputs.skip != 'true'
        id: ver
        run: |
          VERSION=$(grep -oP 'APP_VERSION\s*=\s*"\K[^"]+' shell.js | head -1)
          if [ -z "$VERSION" ]; then
            echo "ERROR: APP_VERSION not found in shell.js" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using APP_VERSION from shell.js: $VERSION"
          echo "NOTE: shell.js is NEVER modified by this workflow. Manual bump only."

      - name: Stamp sw.js CACHE_VERSION
        if: steps.guard.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          if grep -q 'var CACHE_VERSION' sw.js; then
            sed -i "s|var CACHE_VERSION = \"[^\"]*\";|var CACHE_VERSION = \"oros-v$VERSION\";|" sw.js
            echo "sw.js CACHE_VERSION -> oros-v$VERSION"
          else
            echo "ERROR: CACHE_VERSION line not found in sw.js" >&2
            exit 1
          fi

      - name: Stamp manifest.webmanifest version
        if: steps.guard.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          if grep -q '"version"' manifest.webmanifest; then
            sed -i 's|"version"[[:space:]]*:[[:space:]]*"[^"]*"|"version": "'"$VERSION"'"|' manifest.webmanifest
            echo "manifest version -> $VERSION"
          else
            echo "ERROR: no \"version\" key in manifest.webmanifest" >&2
            exit 1
          fi

      - name: Cache-bust app assets + offline & palette guards
        if: steps.guard.outputs.skip != 'true'
        env:
          OROS_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          node .github/scripts/stamp-assets.js

      - name: Check for changes
        if: steps.guard.outputs.skip != 'true'
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit version stamps
        if: steps.guard.outputs.skip != 'true' && steps.diff.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          git config user.name  "orOS version bot"
          git config user.email "actions@github.com"
          git add -u
          git commit -m "chore: sync orOS assets to v$VERSION (auto) [skip ci]"
          git push