<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Memory · orOS</title>

  <link rel="stylesheet" href="memory.css?v=0.65.07">

</head>
<body>

  <!-- Toolbar: one line on a wide screen, two scrolling strips on a phone -->
  <header id="toolbar">
    <div class="tb-row" id="tb-a">
      <div class="seg" id="level-seg" role="group">
        <button type="button" class="seg-btn" data-level="e" data-i18n="level.e">Easy</button>
        <button type="button" class="seg-btn" data-level="m" data-i18n="level.m">Medium</button>
        <button type="button" class="seg-btn" data-level="h" data-i18n="level.h">Hard</button>
        <button type="button" class="seg-btn" data-level="x" data-i18n="level.x">Expert</button>
      </div>
      <button type="button" class="icon-btn" id="new-btn"></button>
    </div>
    <div class="tb-row" id="tb-b">
      <div class="seg" id="mode-seg" role="group">
        <button type="button" class="seg-btn" data-mode="solo" data-i18n="mode.solo">Solo</button>
        <button type="button" class="seg-btn" data-mode="duo" data-i18n="mode.duo">2 players</button>
      </div>
      <select id="set-select" aria-label="Symbols">
        <option value="shapes" data-i18n="set.shapes">Shapes</option>
        <option value="icons" data-i18n="set.icons">Icons</option>
        <option value="letters" data-i18n="set.letters">Letters</option>
      </select>
      <span class="spacer"></span>
      <button type="button" class="icon-btn" id="stats-btn"></button>
      <button type="button" class="icon-btn" id="sfx-btn" aria-pressed="false"></button>
    </div>
  </header>

  <!-- Status: solo (moves · time · best) or duo (two scores + turn) -->
  <div id="status">
    <div id="solo-stats">
      <span class="stat"><small data-i18n="stat.moves">Moves</small><strong id="moves">0</strong></span>
      <span class="stat"><small data-i18n="stat.time">Time</small><strong id="time">00:00</strong></span>
      <span class="stat"><small data-i18n="stat.best">Best</small><strong id="best">—</strong></span>
    </div>
    <div id="duo-stats" hidden>
      <span class="player" id="p0"><small data-i18n="player.1">Player 1</small><strong id="score0">0</strong></span>
      <span class="player" id="p1"><small data-i18n="player.2">Player 2</small><strong id="score1">0</strong></span>
    </div>
  </div>

  <main id="board-wrap">
    <div id="board"></div>
  </main>

  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="memory.js?v=0.65.07"></script>

</body>
</html>
