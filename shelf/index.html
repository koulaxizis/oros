<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-eA6ySnIV3Ch621H7U9wU22Vwl9MF4lT5AMWE755vNzY='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=shelf" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Media Shelf · orOS</title>

  <link rel="stylesheet" href="shelf.css?v=4.99.00">

</head>
<body>

  <header id="toolbar">
    <span id="app-name" class="app-name"></span>
    <span class="spacer"></span>
    <button type="button" class="txt-btn primary" id="add-btn"></button>
    <button type="button" class="icon-btn" id="more-btn"></button>
  </header>

  <nav id="tabs" role="tablist">
    <button type="button" role="tab" data-tab="now"><span data-i18n="tab.now">Now</span><span class="cnt" id="cnt-now"></span></button>
    <button type="button" role="tab" data-tab="want"><span data-i18n="tab.want">Wishlist</span><span class="cnt" id="cnt-want"></span></button>
    <button type="button" role="tab" data-tab="hist"><span data-i18n="tab.hist">History</span><span class="cnt" id="cnt-hist"></span></button>
    <button type="button" role="tab" data-tab="stats"><span data-i18n="tab.stats">Statistics</span></button>
  </nav>

  <main id="main">
    <div id="list-bar">
      <div id="types" class="chips"></div>
      <div class="find">
        <label class="q-wrap">
          <span id="q-ic" class="q-ic" aria-hidden="true"></span>
          <input id="q" type="search" autocomplete="off" maxlength="80">
        </label>
        <select id="sort"></select>
      </div>
    </div>

    <div id="goal-box" hidden></div>
    <ul id="list"></ul>
    <div id="empty" class="empty" hidden></div>
    <div id="stats" hidden></div>
  </main>

  <div id="toast" role="status"></div>

  <script src="../i18n.js?v=4.99.00" data-app="shelf,recordpkg,google-import"></script>
  <script src="../google-import.js?v=4.99.00"></script>
  <script src="gbooks.js?v=4.99.00"></script>
  <script src="../importkit.js?v=4.99.00"></script>
  <script src="../atelier/zip.js?v=4.99.00"></script>
  <script src="import.js?v=4.99.00"></script>
  <script src="../bundle.js?v=4.99.00"></script>
  <script src="../recordpkg.js?v=4.99.00"></script>
  <script src="package.js?v=4.99.00"></script>
  <script src="shelf.js?v=4.99.00"></script>

</body>
</html>
