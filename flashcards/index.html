<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-73/L6m0pXioJ+5gfmg5aN+woHpgeaFdSOpa+w4tVo1I='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=flashcards" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Flashcards · orOS</title>
  <link rel="stylesheet" href="app.css?v=5.03.00">
</head>
<body>

  <header id="toolbar">
    <button type="button" id="back-btn" class="icon-btn" hidden data-i18n-label="btn.back"><span aria-hidden="true">←</span></button>
    <h1 id="title" data-i18n="app.name">Flashcards</h1>
    <div class="tb-btns">
      <button type="button" id="browse-btn" class="chip" data-i18n-label="btn.browse"><span class="ic" aria-hidden="true">☰</span><span class="lb" data-i18n="btn.browse">Browse</span></button>
      <button type="button" id="new-deck-btn" class="chip" data-i18n="btn.newDeck">New deck</button>
      <button type="button" id="add-card-btn" class="chip pri" data-i18n="btn.addCard">Add card</button>
      <button type="button" id="settings-btn" class="icon-btn" data-i18n-label="btn.settings"><span aria-hidden="true">⚙</span></button>
    </div>
  </header>

  <p id="nofs" class="banner" hidden data-i18n="nofs">Flashcards keeps cards on the orOS disk. Open it inside orOS to save them.</p>

  <!-- Home: the decks -->
  <main id="home" class="view">
    <ul id="deck-list" class="rows"></ul>
    <div id="home-empty" class="empty" hidden>
      <p class="big" data-i18n="home.emptyTitle">No decks yet</p>
      <p class="hint" data-i18n="home.empty">A deck holds cards on one subject. Make your first deck, then add cards to it.</p>
      <button type="button" id="first-deck-btn" class="chip pri" data-i18n="btn.newDeck">New deck</button>
      <button type="button" id="first-import-btn" class="chip" data-i18n="btn.import">Import</button>
    </div>
  </main>

  <!-- One deck: counts, study, its cards -->
  <main id="deck-view" class="view" hidden>
    <section class="deck-head">
      <div id="deck-counts" class="counts"></div>
      <div class="deck-btns">
        <button type="button" id="study-btn" class="chip pri" data-i18n="btn.study">Study</button>
        <button type="button" id="deck-edit-btn" class="chip" data-i18n="btn.deckSettings">Deck settings</button>
        <button type="button" id="deck-stats-btn" class="chip" data-i18n="btn.stats">Stats</button>
        <button type="button" id="deck-export-btn" class="chip" data-i18n="btn.export">Export</button>
      </div>
      <p id="deck-note" class="hint"></p>
    </section>
    <div class="filter-row">
      <label for="filter" class="sr-only" data-i18n="filter.label">Find a card</label>
      <input type="search" id="filter" maxlength="200" data-i18n-ph="filter.ph">
    </div>
    <ul id="card-list" class="rows"></ul>
    <button type="button" id="more-cards" class="chip" hidden data-i18n="btn.more">Show more</button>
    <p id="deck-empty" class="hint" hidden data-i18n="deck.empty">No cards in this deck yet. Press Add card.</p>
  </main>

  <!-- Card browser: every card, filters, actions on many cards -->
  <main id="browse" class="view" hidden>
    <div class="br-filters">
      <label for="br-q" class="sr-only" data-i18n="filter.label">Find a card</label>
      <input type="search" id="br-q" maxlength="200" data-i18n-ph="filter.ph">
      <label class="sr-only" for="br-deck" data-i18n="f.deck">Deck</label>
      <select id="br-deck"></select>
      <label class="sr-only" for="br-tag" data-i18n="br.tag">Tag</label>
      <select id="br-tag"></select>
      <label class="sr-only" for="br-state" data-i18n="br.state">State</label>
      <select id="br-state"></select>
    </div>
    <div class="br-bar">
      <label class="br-all"><input type="checkbox" id="br-all"> <span id="br-count"></span></label>
      <div id="br-acts" class="br-acts" hidden>
        <button type="button" class="chip" id="br-move" data-i18n="br.move">Move</button>
        <button type="button" class="chip" id="br-tagadd" data-i18n="br.tagAdd">Add tag</button>
        <button type="button" class="chip" id="br-tagdel" data-i18n="br.tagDel">Remove tag</button>
        <button type="button" class="chip" id="br-sus" data-i18n="br.suspend">Suspend</button>
        <button type="button" class="chip" id="br-res" data-i18n="br.resume">Resume</button>
        <button type="button" class="chip danger" id="br-del" data-i18n="btn.delete">Delete</button>
      </div>
    </div>
    <ul id="br-list" class="rows"></ul>
    <button type="button" id="br-more" class="chip" hidden data-i18n="btn.more">Show more</button>
    <p id="br-empty" class="hint" hidden></p>
  </main>

  <!-- Stats: all decks or one deck -->
  <main id="stats" class="view" hidden>
    <div class="st-top">
      <label for="st-scope" data-i18n="st.scope">Show</label>
      <select id="st-scope"></select>
    </div>
    <div id="st-body"></div>
  </main>

  <!-- Study -->
  <main id="study" class="view" hidden>
    <div class="study-top">
      <div id="study-counts" class="counts"></div>
      <div class="study-tools">
        <button type="button" id="undo-btn" class="chip" disabled data-i18n="btn.undo">Undo</button>
        <button type="button" id="edit-cur-btn" class="chip" data-i18n="btn.edit">Edit</button>
        <div class="menu-wrap">
          <button type="button" id="more-btn" class="chip" aria-haspopup="true" aria-expanded="false" data-i18n-label="btn.moreActions"><span aria-hidden="true">⋯</span></button>
          <div id="study-menu" class="menu" role="menu" hidden>
            <button type="button" role="menuitem" id="bury-btn" data-i18n="btn.bury">Hide until tomorrow</button>
            <button type="button" role="menuitem" id="suspend-btn" data-i18n="btn.suspend">Suspend card</button>
          </div>
        </div>
      </div>
    </div>
    <article id="card-box" aria-live="polite">
      <button type="button" id="speak-btn" class="icon-btn speak" hidden data-i18n-label="btn.speak"><span aria-hidden="true">🔊</span></button>
      <div id="side-front" class="side"></div>
      <hr id="side-line" hidden>
      <div id="side-back" class="side" hidden></div>
    </article>
    <div id="done-box" class="empty" hidden>
      <p class="big" data-i18n="study.doneTitle">Done for now</p>
      <p id="done-text" class="hint"></p>
      <button type="button" id="done-back" class="chip" data-i18n="btn.backDecks">Back to decks</button>
    </div>
    <footer id="study-foot">
      <button type="button" id="show-btn" class="chip pri wide" data-i18n="btn.show">Show answer</button>
      <div id="grade-btns" hidden>
        <button type="button" class="grade g1" data-g="1"><span class="gl" data-i18n="g.1">Again</span><span class="gi"></span></button>
        <button type="button" class="grade g2" data-g="2"><span class="gl" data-i18n="g.2">Hard</span><span class="gi"></span></button>
        <button type="button" class="grade g3" data-g="3"><span class="gl" data-i18n="g.3">Good</span><span class="gi"></span></button>
        <button type="button" class="grade g4" data-g="4"><span class="gl" data-i18n="g.4">Easy</span><span class="gi"></span></button>
      </div>
    </footer>
  </main>

  <!-- Dialogs (one at a time, centred) -->
  <div id="veil" hidden>
    <div id="dlg" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <h2 id="dlg-title"></h2>
      <div id="dlg-body"></div>
      <div class="dlg-btns">
        <button type="button" id="dlg-del" class="chip danger" hidden data-i18n="btn.delete">Delete</button>
        <span class="grow"></span>
        <button type="button" id="dlg-cancel" class="chip" data-i18n="btn.cancel">Cancel</button>
        <button type="button" id="dlg-alt" class="chip" hidden></button>
        <button type="button" id="dlg-ok" class="chip pri"></button>
      </div>
    </div>
  </div>

  <div id="toast" role="status"></div>

  <script src="../i18n.js?v=5.03.00" data-app="flashcards"></script>
  <script src="fsrs.js?v=5.03.00"></script>
  <script src="core.js?v=5.03.00"></script>
  <script src="media.js?v=5.03.00"></script>
  <script src="make.js?v=5.03.00"></script>
  <script src="due.js?v=5.03.00"></script>
  <script src="stats.js?v=5.03.00"></script>
  <script src="package.js?v=5.03.00"></script>
  <script src="app.js?v=5.03.00"></script>

</body>
</html>
