<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-CrcySCDSSpaCk60D8Y1vJIiQ02XOBsQM7MqorBRz980='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=characters" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Characters</title>
  <link rel="stylesheet" href="characters.css?v=4.99.00">
</head>
<body>
  <!-- Topbar: [New] | tabs | [Export][Help] -->
  <header id="topbar">
    <div id="tb-left">
      <button id="tb-new" class="tb-btn accent" type="button" aria-label=""></button>
    </div>
    <nav id="tb-tabs" aria-label="">
      <button type="button" class="tb-tab active" data-tab="chars"></button>
      <button type="button" class="tb-tab" data-tab="rels"></button>
    </nav>
    <div id="tb-right">
      <button id="tb-export" class="tb-btn" type="button" aria-label=""></button>
      <button id="tb-help" class="tb-btn" type="button" aria-label=""></button>
    </div>
  </header>

  <main id="main">
    <section id="view-chars" class="view"></section>
    <section id="view-rels" class="view" hidden></section>
  </main>

  <!-- Character editor (all controls JS-painted for i18n) -->
  <dialog id="dlg-editor"></dialog>
  <!-- Generic confirm dialog -->
  <dialog id="dlg-confirm"></dialog>
  <!-- Help / shortcuts -->
  <dialog id="dlg-help"></dialog>
  <!-- Relationship editor (matrix cell) -->
  <dialog id="dlg-rel"></dialog>
  <!-- Export menu (popover) -->
  <div id="export-pop" hidden></div>

  <div id="toast-host"></div>

  <script src="../i18n.js?v=4.99.00" data-app="characters"></script>
  <script src="characters.js?v=4.99.00"></script>
</body>
</html>
