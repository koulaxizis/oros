<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-RVL47rAk5/jD6jijSq3NBg/uURcxGXfcQ6ApHAfkLNA='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=contacts" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Contacts · orOS</title>
  <link rel="stylesheet" href="contacts.css?v=4.99.00">
</head>
<body>
  <main id="cmain">

    <!-- ===== Top bar ===== -->
    <header id="ct-top">
      <button id="ct-import" type="button" class="nav-mini" data-i18n="ct.import"></button>
      <button id="ct-export" type="button" class="nav-mini" data-i18n="ct.export"></button>
      <button id="ct-phone" type="button" class="nav-mini" data-i18n="ct.phone" hidden></button>
      <button id="ct-acct" type="button" class="nav-mini" data-i18n="ac.btn"></button>
      <button id="ct-dav" type="button" class="nav-mini" data-i18n="cd.btn"></button>
      <button id="ct-mirror" type="button" class="nav-mini" data-i18n="ph.btn" hidden></button>
      <button id="ct-dedup" type="button" class="nav-mini" data-i18n="dup.scan"></button>
      <button id="ct-enrich" type="button" class="nav-mini" data-i18n="en.btn"></button>
      <button id="ct-scan" type="button" class="nav-mini" data-i18n="sc.btn"></button>
      <button id="ct-avall" type="button" class="nav-mini" data-i18n="av.btn"></button>
      <h2 id="ct-title" data-i18n="app.contacts.self"></h2>
    </header>

    <!-- ===== Search + add ===== -->
    <div id="view-bar">
      <input id="search-in" type="search" autocomplete="off"
             data-i18n-ph="ct.search.ph">
      <button id="ct-add" type="button" class="btn prim" data-i18n="ct.add"></button>
    </div>

    <!-- ===== Label filter chips ===== -->
    <div id="lbl-chips"></div>

    <!-- ===== Reach out: the reminder switch (device-local) ===== -->
    <div id="reach-bar" hidden>
      <label class="reach-on"><input id="reach-on" type="checkbox"> <span data-i18n="kt.rem"></span></label>
      <select id="reach-hour" data-i18n-aria="kt.rem"></select>
      <p class="reach-hint" data-i18n="kt.rem.hint"></p>
    </div>

    <!-- ===== Contact list ===== -->
    <ul id="ct-list"></ul>

    <!-- ===== Import results (shown after a vCard import) ===== -->
    <section class="sec" id="import-sec" hidden>
      <div class="sec-head">
        <span id="imp-title"></span>
        <button id="imp-done" type="button" class="mini" data-i18n="lbl.done"></button>
      </div>
      <ul id="imp-list"></ul>
    </section>

    <!-- Dedup scan results (shown after scanning for duplicates) -->
    <section class="sec" id="dedup-sec" hidden>
      <div class="sec-head">
        <span id="dedup-title"></span>
        <button id="dedup-done" type="button" class="mini" data-i18n="lbl.done"></button>
      </div>
      <div id="dedup-groups"></div>
      <p id="dedup-none" class="empty" hidden></p>
    </section>
  </main>

  <!-- Hidden file input for vCard/CSV import (single reliable path) -->
  <input type="file" id="vcard-file" accept=".vcf,.csv,text/vcard,text/csv" hidden>

  <!-- Contact dialog (add & edit share it) -->
  <dialog id="ct-dlg">
    <h3 id="ct-dlg-title" data-i18n="ct.dlg.new"></h3>
    <div class="ev-form">

      <label for="ct-given" data-i18n="ct.field.given"></label>
      <input id="ct-given" type="text" maxlength="60" data-i18n-ph="ct.ph.given">

      <label for="ct-middle" data-i18n="ct.field.middle"></label>
      <input id="ct-middle" type="text" maxlength="60" data-i18n-ph="ct.ph.middle">

      <label for="ct-family" data-i18n="ct.field.family"></label>
      <input id="ct-family" type="text" maxlength="60" data-i18n-ph="ct.ph.family">

      <label for="ct-nickname" data-i18n="ct.field.nickname"></label>
      <input id="ct-nickname" type="text" maxlength="60" data-i18n-ph="ct.ph.nickname">

      <label for="ct-org" data-i18n="ct.field.org"></label>
      <input id="ct-org" type="text" maxlength="80" data-i18n-ph="ct.ph.org">

      <label for="ct-jobtitle" data-i18n="ct.field.jobtitle"></label>
      <input id="ct-jobtitle" type="text" maxlength="80" data-i18n-ph="ct.ph.jobtitle">

      <label data-i18n="ct.field.phones"></label>
      <div id="ct-phones" class="mf-holder"></div>
      <button id="ct-phone-add" type="button" class="mini mf-add" data-i18n="ct.add.phone"></button>

      <label data-i18n="ct.field.emails"></label>
      <div id="ct-emails" class="mf-holder"></div>
      <button id="ct-email-add" type="button" class="mini mf-add" data-i18n="ct.add.email"></button>

      <label data-i18n="ct.field.addresses"></label>
      <div id="ct-addresses" class="mf-holder"></div>
      <button id="ct-addr-add" type="button" class="mini mf-add" data-i18n="ct.add.address"></button>

      <label data-i18n="ct.field.websites"></label>
      <div id="ct-websites" class="mf-holder"></div>
      <button id="ct-web-add" type="button" class="mini mf-add" data-i18n="ct.add.website"></button>

      <label data-i18n="ct.field.im"></label>
      <div id="ct-im" class="mf-holder"></div>
      <button id="ct-im-add" type="button" class="mini mf-add" data-i18n="ct.add.im"></button>

      <label data-i18n="ct.field.events"></label>
      <div id="ct-events" class="mf-holder"></div>
      <button id="ct-ev-add" type="button" class="mini mf-add" data-i18n="ct.add.event"></button>

      <label data-i18n="ct.field.relations"></label>
      <div id="ct-relations" class="mf-holder"></div>
      <button id="ct-rel-add" type="button" class="mini mf-add" data-i18n="ct.add.relation"></button>
      <div id="ct-rel-in" class="rel-incoming"></div>

      <label for="ct-keep-u" data-i18n="kt.field"></label>
      <div class="keep-row">
        <span data-i18n="kt.every"></span>
        <input id="ct-keep-n" type="number" min="1" max="99" step="1" inputmode="numeric" value="1" data-i18n-aria="kt.field">
        <select id="ct-keep-u">
          <option value="" data-i18n="kt.off"></option>
          <option value="w" data-i18n="kt.weeks"></option>
          <option value="m" data-i18n="kt.months"></option>
        </select>
      </div>

      <label data-i18n="ct.lbl.filter"></label>
      <div id="ct-label-row" class="chip-row"></div>

      <label class="chk">
        <input id="ct-starred" type="checkbox">
        <span data-i18n="ct.starred"></span>
      </label>

      <label data-i18n="ct.avatar"></label>
      <div class="avatar-pick">
        <span id="avatar-preview" class="avatar-preview"></span>
        <label><input id="ct-av-ini" type="radio" name="ct-av"> <span data-i18n="ct.avatar.ini"></span></label>
        <label><input id="ct-av-px" type="radio" name="ct-av"> <span data-i18n="ct.avatar.px"></span></label>
        <button id="ct-av-new" type="button" class="mini" hidden data-i18n="ct.avatar.new"></button>
      </div>

      <label for="ct-note" data-i18n="ct.field.note"></label>
      <textarea id="ct-note" rows="3" maxlength="2000" data-i18n-ph="ct.ph.note"></textarea>
    </div>
    <p id="ct-dav-ro" class="del-text cd-ro-note" data-i18n="ct.dav.ro" hidden></p>
    <div class="dlg-row">
      <button id="ct-save" type="button" class="btn prim" data-i18n="ct.save"></button>
      <button id="ct-cancel" type="button" class="btn" data-i18n="ct.cancel"></button>
    </div>
    <div class="dlg-row" id="ct-del-row">
      <button id="ct-enrich-one" type="button" class="btn" data-i18n="en.one"></button>
      <button id="ct-delete" type="button" class="btn danger" data-i18n="ct.delete"></button>
    </div>
  </dialog>

  <!-- Delete confirmation (R14 themed dialog) -->
  <dialog id="del-dlg">
    <h3 data-i18n="ct.delete"></h3>
    <p id="del-dlg-text" class="del-name"></p>
    <p class="del-text" data-i18n="ct.delete.confirm"></p>
    <div class="dlg-row">
      <button id="del-dlg-yes" type="button" class="btn danger" data-i18n="ct.del.yes"></button>
      <button id="del-dlg-no" type="button" class="btn" data-i18n="ct.cancel"></button>
    </div>
  </dialog>

  <!-- Import review: every import path (file, phone, account, BR-FILE-IMPORT) -->
  <dialog id="rev-dlg" aria-labelledby="rev-dlg-title">
    <h3 id="rev-dlg-title" data-i18n="rv.title"></h3>
    <p id="rev-src" class="del-name"></p>
    <p id="rev-sum" class="del-text" aria-live="polite"></p>
    <label class="rev-pref" id="rev-pref-row">
      <span data-i18n="rv.pref"></span>
      <select id="rev-pref">
        <option value="merge" data-i18n="rv.act.merge"></option>
        <option value="theirs" data-i18n="rv.act.theirs"></option>
      </select>
    </label>
    <div id="rev-list"></div>
    <p class="del-text" data-i18n="rv.safe"></p>
    <div class="dlg-row">
      <button id="rev-go" type="button" class="btn prim" data-i18n="rv.go"></button>
      <button id="rev-no" type="button" class="btn" data-i18n="ct.cancel"></button>
    </div>
  </dialog>

  <!-- One-time import from an online account -->
  <dialog id="ac-dlg" aria-labelledby="ac-dlg-title">
    <h3 id="ac-dlg-title" data-i18n="ac.title"></h3>
    <p class="del-text" data-i18n="ac.text"></p>
    <div class="ac-provs">
      <button id="ac-google" type="button" class="btn ac-prov" data-p="google">Google</button>
      <button id="ac-microsoft" type="button" class="btn ac-prov" data-p="microsoft">Microsoft · Outlook</button>
    </div>
    <p id="ac-stat" class="del-text" aria-live="polite"></p>
    <p class="del-text" data-i18n="ac.others"></p>
    <details id="ac-own">
      <summary data-i18n="ac.own"></summary>
      <p class="del-text" data-i18n="ac.own.text"></p>
      <p class="del-text ac-uri"><code id="ac-uri"></code></p>
      <div class="ev-form">
        <label for="ac-id-google">Google</label>
        <input id="ac-id-google" type="text" maxlength="200" autocomplete="off" spellcheck="false">
        <label for="ac-id-microsoft">Microsoft</label>
        <input id="ac-id-microsoft" type="text" maxlength="200" autocomplete="off" spellcheck="false">
        <label for="ac-key-google" data-i18n="ac.own.key"></label>
        <input id="ac-key-google" type="text" maxlength="120" autocomplete="off" spellcheck="false">
      </div>
      <div class="dlg-row">
        <button id="ac-id-save" type="button" class="mini" data-i18n="ac.own.save"></button>
      </div>
    </details>
    <div class="dlg-row">
      <button id="ac-close" type="button" class="btn" data-i18n="ph.close"></button>
    </div>
  </dialog>

  <!-- Picture for every contact at once (CT-NP global switch) -->
  <dialog id="av-dlg" aria-labelledby="av-dlg-title">
    <h3 id="av-dlg-title" data-i18n="av.title"></h3>
    <p class="del-text" data-i18n="av.text"></p>
    <div class="dlg-row">
      <button id="av-ini" type="button" class="btn" data-i18n="av.ini"></button>
      <button id="av-px" type="button" class="btn prim" data-i18n="av.px"></button>
      <button id="av-close" type="button" class="btn" data-i18n="ph.close"></button>
    </div>
  </dialog>

  <!-- Server address book (CardDAV wave 4) -->
  <dialog id="cd-dlg" aria-labelledby="cd-dlg-title">
    <h3 id="cd-dlg-title" data-i18n="cd.title"></h3>
    <p class="del-text" data-i18n="cd.text"></p>
    <p id="cd-noacct" class="del-text" data-i18n="cd.noacct" hidden></p>
    <div id="cd-set-row" class="dlg-row" hidden>
      <button id="cd-settings" type="button" class="btn" data-i18n="cd.settings"></button>
    </div>
    <ul id="cd-list" class="cd-list"></ul>
    <div id="cd-prev" class="cd-prev" hidden>
      <p id="cd-prev-text" class="del-text" aria-live="polite"></p>
      <div class="dlg-row">
        <button id="cd-prev-go" type="button" class="btn prim" data-i18n="cd.link"></button>
        <button id="cd-prev-no" type="button" class="btn" data-i18n="ct.cancel"></button>
      </div>
    </div>
    <div class="dlg-row">
      <button id="cd-done" type="button" class="btn" data-i18n="ph.close"></button>
    </div>
  </dialog>

  <!-- On this phone (BR-PHONE, Android app only) -->
  <dialog id="ph-dlg" aria-labelledby="ph-dlg-title">
    <h3 id="ph-dlg-title" data-i18n="ph.title"></h3>
    <p class="del-text" data-i18n="ph.text"></p>
    <label class="ph-row"><input id="ph-on" type="checkbox"> <span data-i18n="ph.on"></span></label>
    <p id="ph-stat" class="del-text" aria-live="polite"></p>
    <div class="dlg-row">
      <button id="ph-allow" type="button" class="btn prim" data-i18n="ph.allow"></button>
      <button id="ph-close" type="button" class="btn" data-i18n="ph.close"></button>
    </div>
  </dialog>

  <!-- Merge confirmation (shows proposed merged data) -->
  <dialog id="merge-dlg">
    <h3 id="merge-title" data-i18n="dup.merge"></h3>
    <div class="dup-via" id="merge-via"></div>
    <div id="merge-preview" class="ev-form"></div>
    <div class="chg-row" id="chg-row">
      <button id="merge-flip" type="button" class="btn prim" data-i18n="dup.flip"></button>
      <button id="merge-do" type="button" class="btn prim" data-i18n="dup.do"></button>
    </div>
    <div class="dlg-row">
      <button id="merge-cancel" type="button" class="btn" data-i18n="ct.cancel"></button>
    </div>
  </dialog>

  <!-- Interaction log entry (keep in touch) -->
  <dialog id="ix-dlg" aria-labelledby="ix-dlg-title">
    <h3 id="ix-dlg-title" data-i18n="ix.new"></h3>
    <p id="ix-who" class="del-name"></p>
    <div class="ev-form">
      <label for="ix-kind" data-i18n="ix.kind"></label>
      <select id="ix-kind"></select>
      <label for="ix-date" data-i18n="ix.date"></label>
      <input id="ix-date" type="date">
      <label for="ix-text" data-i18n="ix.text"></label>
      <textarea id="ix-text" rows="4" maxlength="1000" data-i18n-ph="ix.ph"></textarea>
    </div>
    <div class="dlg-row">
      <button id="ix-save" type="button" class="btn prim" data-i18n="ct.save"></button>
      <button id="ix-cancel" type="button" class="btn" data-i18n="ct.cancel"></button>
    </div>
    <div class="dlg-row" id="ix-del-row" hidden>
      <button id="ix-del" type="button" class="btn danger" data-i18n="ix.del"></button>
    </div>
  </dialog>

  <!-- CSV column mapping (any CSV that is not Google's own format) -->
  <dialog id="csv-dlg" aria-labelledby="csv-dlg-title">
    <h3 id="csv-dlg-title" data-i18n="cm.title"></h3>
    <p id="csv-src" class="del-name"></p>
    <p class="del-text" data-i18n="cm.text"></p>
    <label class="ph-row"><input id="csv-head" type="checkbox" checked> <span data-i18n="cm.header"></span></label>
    <label class="rev-pref" id="csv-order-row">
      <span data-i18n="cm.dates"></span>
      <select id="csv-order">
        <option value="dmy" data-i18n="cm.dmy"></option>
        <option value="mdy" data-i18n="cm.mdy"></option>
      </select>
    </label>
    <div id="csv-cols"></div>
    <p id="csv-prev-title" class="rev-grp"></p>
    <div id="csv-prev"></div>
    <div class="dlg-row">
      <button id="csv-go" type="button" class="btn prim" data-i18n="cm.next"></button>
      <button id="csv-no" type="button" class="btn" data-i18n="ct.cancel"></button>
    </div>
  </dialog>

  <!-- Business card scan: photo → on-device text recognition → form -->
  <dialog id="scan-dlg" aria-labelledby="scan-dlg-title">
    <h3 id="scan-dlg-title" data-i18n="sc.title"></h3>
    <p class="del-text" data-i18n="sc.text"></p>
    <div class="scan-btns">
      <button id="scan-photo" type="button" class="btn" data-i18n="sc.photo"></button>
      <button id="scan-pick" type="button" class="btn" data-i18n="sc.pick"></button>
    </div>
    <input id="scan-cam" type="file" accept="image/*" capture="environment" hidden>
    <input id="scan-file" type="file" accept="image/*" hidden>
    <div id="scan-dl" class="scan-dl" hidden>
      <p class="del-text" data-i18n="sc.dl.text"></p>
      <button id="scan-dl-go" type="button" class="btn prim" data-i18n="sc.dl.go"></button>
    </div>
    <canvas id="scan-img" hidden></canvas>
    <p id="scan-stat" class="del-text" aria-live="polite"></p>
    <label for="scan-text" class="scan-lbl" data-i18n="sc.paste"></label>
    <textarea id="scan-text" rows="7" maxlength="4000" data-i18n-ph="sc.ph"></textarea>
    <div class="dlg-row">
      <button id="scan-go" type="button" class="btn prim" data-i18n="sc.fill"></button>
      <button id="scan-no" type="button" class="btn" data-i18n="ph.close"></button>
    </div>
  </dialog>

  <!-- Label management -->
  <dialog id="lbl-dlg">
    <h3 data-i18n="lbl.manage"></h3>
    <div id="lbl-list"></div>
    <div class="lbl-add-row">
      <input id="lbl-new-name" type="text" maxlength="40" data-i18n-ph="lbl.ph.name">
      <button id="lbl-add" type="button" class="btn prim" data-i18n="lbl.new"></button>
    </div>
    <div id="lbl-add-colors" class="lbl-palette lbl-add-palette"></div>
    <div class="dlg-row">
      <button id="lbl-done" type="button" class="btn prim" data-i18n="lbl.done"></button>
    </div>
  </dialog>

  <script src="../i18n.js?v=4.99.00" data-app="contacts,recordpkg,enrichui"></script>
  <script src="merge.js?v=4.99.00"></script>
  <script src="keep.js?v=4.99.00"></script>
  <script src="csvmap.js?v=4.99.00"></script>
  <script src="cardtext.js?v=4.99.00"></script>
  <script src="importplan.js?v=4.99.00"></script>
  <script src="accounts.js?v=4.99.00"></script>
  <script src="../bundle.js?v=4.99.00"></script>
  <script src="../recordpkg.js?v=4.99.00"></script>
  <script src="package.js?v=4.99.00"></script>
  <script src="contacts.js?v=4.99.00"></script>
</body>
</html>
