<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-YCH5JSThA96/4WZ+1exxTd9vqtUjwyoeD1tzX5JLt28='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=television" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Television</title>
  <link rel="stylesheet" href="television.css?v=5.02.00">
  <!-- hls.js: STATIC tag, requested unversioned so the sw.js precache
       entry matches (Part II sw.js contract: dynamically loaded
       assets must be requested WITHOUT a query string). -->
  <script src="../i18n.js?v=5.02.00" data-app="television"></script>
  <script src="../vendor/hls.light.min.js?v=5.02.00"></script>
  <!-- Wave 43: the Reader's shared network layer (direct, then the Mail
       relay) for playlist / guide addresses, and the pure logic. -->
  <script src="../feeds/core.js?v=5.02.00" defer></script>
  <script src="../feeds/fetch.js?v=5.02.00" defer></script>
  <script src="core.js?v=5.02.00" defer></script>
  <script src="television.js?v=5.02.00" defer></script>
</head>
<body>
  <div id="tv-app">

    <!-- ===== Toolbar: tabs + search + filters ===== -->
    <header class="tv-top">
      <div class="tv-tabs" role="tablist">
        <button class="tv-tab" data-tab="browse" role="tab" data-i18n="tab.browse"></button>
        <button class="tv-tab" data-tab="lists" role="tab" data-i18n="tab.lists"></button>
        <button class="tv-tab" data-tab="guide" role="tab" data-i18n="tab.guide"></button>
        <button class="tv-tab" data-tab="favorites" role="tab" data-i18n="tab.favorites"></button>
        <button class="tv-tab" data-tab="recents" role="tab" data-i18n="tab.recents"></button>
        <button id="tv-manage" class="tv-manage" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h11M4 12h11M4 18h7"/><path d="M19 14v8M15 18h8"/></svg>
          <span id="tv-manage-txt"></span>
        </button>
      </div>
      <div class="tv-tools">
        <div class="tv-search-wrap">
          <input id="tv-search" type="search" autocomplete="off" spellcheck="false">
          <div id="tv-ac" hidden></div>
        </div>
        <label class="tv-filter"><span class="tv-filter-cap" id="tv-country-cap"></span><select id="tv-country"></select></label>
        <label class="tv-filter"><span class="tv-filter-cap" id="tv-category-cap"></span><select id="tv-category"></select></label>
        <label class="tv-filter"><span class="tv-filter-cap" id="tv-lang-cap"></span><select id="tv-lang"></select></label>
        <label class="tv-filter" id="tv-group-wrap" hidden><span class="tv-filter-cap" id="tv-group-cap"></span><select id="tv-group"></select></label>
      </div>
    </header>

    <!-- ===== Channel grid ===== -->
    <main id="tv-main">
      <div id="tv-loading">
        <div class="tv-spin"></div>
        <p data-i18n="loading"></p>
      </div>
      <div id="tv-guide" hidden></div>
      <div id="tv-grid"></div>
      <div id="tv-empty" hidden>
        <p id="tv-empty-msg"></p>
        <button id="tv-empty-act" class="tv-btn" type="button" hidden></button>
      </div>
      <div id="tv-more-row">
        <button id="tv-more" hidden data-i18n="more"></button>
      </div>
    </main>

    <!-- ===== Player (native <dialog>, centered per R32) ===== -->
    <dialog id="tv-player">
      <div class="tvp-head">
        <span id="tvp-title"></span>
        <button id="tvp-close" class="tv-icon" data-i18n-title="close"></button>
      </div>
      <div class="tvp-video">
        <video id="tvp-video" autoplay playsinline></video>
        <div id="tvp-status" class="tvp-badge" hidden></div>
      </div>
      <div class="tvp-info">
        <span id="tvp-meta"></span>
        <span id="tvp-labels"></span>
      </div>
      <p id="tvp-epg" hidden></p>
      <select id="tvp-streampick" hidden></select>
      <div class="tvp-controls">
        <button id="tvp-play" class="tv-icon"></button>
        <button id="tvp-mute" class="tv-icon"></button>
        <input id="tvp-vol" type="range" min="0" max="1" step="0.05" value="1">
        <span class="tv-spacer"></span>
        <button id="tvp-fav" class="tv-icon"></button>
        <button id="tvp-ext" class="tv-icon" data-i18n-title="openExt"></button>
        <button id="tvp-fs" class="tv-icon" data-i18n-title="fullscreen"></button>
      </div>
    </dialog>

    <!-- ===== Lists & guides (Wave 43) ===== -->
    <dialog id="tv-src" class="tv-dlg">
      <div class="tvp-head">
        <span class="tv-dlg-title" id="tvs-title"></span>
        <button id="tvs-close" class="tv-icon" type="button"></button>
      </div>
      <section class="tvs-sec">
        <h3 id="tvs-pl-h"></h3>
        <p class="tvs-hint" id="tvs-pl-hint"></p>
        <div id="tvs-pl-list" class="tvs-list"></div>
        <form id="tvs-pl-form" class="tvs-add">
          <input id="tvs-pl-url" type="url" inputmode="url" autocomplete="off" spellcheck="false">
          <button id="tvs-pl-add" class="tv-btn" type="submit"></button>
        </form>
        <button id="tvs-pl-file" class="tv-btn ghost" type="button"></button>
        <input id="tvs-pl-input" type="file" accept=".m3u,.m3u8,.txt,audio/x-mpegurl,audio/mpegurl,application/vnd.apple.mpegurl,application/x-mpegurl" hidden>
      </section>
      <section class="tvs-sec">
        <h3 id="tvs-epg-h"></h3>
        <p class="tvs-hint" id="tvs-epg-hint"></p>
        <div id="tvs-epg-list" class="tvs-list"></div>
        <form id="tvs-epg-form" class="tvs-add">
          <input id="tvs-epg-url" type="url" inputmode="url" autocomplete="off" spellcheck="false">
          <button id="tvs-epg-add" class="tv-btn" type="submit"></button>
        </form>
        <button id="tvs-epg-file" class="tv-btn ghost" type="button"></button>
        <input id="tvs-epg-input" type="file" accept=".xml,.xmltv,.gz,application/xml,text/xml,application/gzip" hidden>
      </section>
      <div class="tvs-foot"><button id="tvs-refresh" class="tv-btn ghost" type="button"></button></div>
    </dialog>

    <!-- ===== Programme details (Wave 43) ===== -->
    <dialog id="tv-prog" class="tv-dlg tv-dlg-sm">
      <div class="tvp-head">
        <span class="tv-dlg-title" id="tvpg-title"></span>
        <button id="tvpg-close" class="tv-icon" type="button"></button>
      </div>
      <p id="tvpg-when" class="tvpg-when"></p>
      <p id="tvpg-sub" class="tvpg-sub" hidden></p>
      <p id="tvpg-desc" class="tvpg-desc" hidden></p>
      <div class="tvs-foot"><button id="tvpg-cal" class="tv-btn ghost" type="button" hidden></button><button id="tvpg-watch" class="tv-btn" type="button"></button></div>
    </dialog>

    <!-- Local toast fallback ONLY (shell transient toast is primary,
         Part VI Toasts contract). Single slot, per Bible. -->
    <div id="tv-toast" hidden></div>
  </div>
</body>
</html>
