<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-9bEZnVKqCLglgeoIQly5VuORkl86rKorHnKw1zdEKyE='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=montage" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Montage · orOS</title>

  <link rel="stylesheet" href="montage.css?v=5.02.00">

</head>
<body>

  <header id="toolbar">
    <button type="button" id="back-btn" class="icon-btn" hidden></button>
    <div class="title">
      <span id="title-main" class="title-main"></span>
      <span id="title-sub" class="title-sub"></span>
    </div>
    <span class="spacer"></span>
    <button type="button" id="undo-btn" class="icon-btn" hidden></button>
    <button type="button" id="redo-btn" class="icon-btn" hidden></button>
    <button type="button" id="proj-btn" class="icon-btn" hidden></button>
    <button type="button" id="export-btn" class="btn primary" data-i18n="btn.export" hidden>Export</button>
  </header>

  <!-- Projects -->
  <main id="home" class="view">
    <div class="home-head">
      <h1 data-i18n="home.title">Your projects</h1>
      <span class="spacer"></span>
      <button type="button" id="open-btn" class="btn" data-i18n="btn.open" hidden>Open file…</button>
      <button type="button" id="new-btn" class="btn primary" data-i18n="btn.new">New project</button>
    </div>
    <button type="button" id="folder-btn" class="link-btn" data-i18n="oros.folder" hidden>Unzipped orOS folder…</button>
    <ul id="proj-list" class="proj-list"></ul>
    <div id="home-empty" class="empty" hidden>
      <p class="empty-title" data-i18n="home.emptyTitle">No projects yet</p>
      <p class="hint" data-i18n="home.empty">Start a project, add your videos, pictures and music, and export a video file.</p>
    </div>
    <p id="storage" class="hint small"></p>
  </main>

  <!-- Editor -->
  <main id="editor" class="view" hidden>
    <div id="stage-wrap">
      <canvas id="stage" width="1280" height="720"></canvas>
      <div id="stage-empty" class="stage-empty" hidden>
        <p data-i18n="ed.empty">Add your first video or picture</p>
        <button type="button" id="first-add" class="btn primary" data-i18n="tool.media">Media</button>
      </div>
    </div>

    <div id="transport">
      <span id="tc" class="tc">0:00.00</span>
      <span class="spacer"></span>
      <button type="button" id="prev-btn" class="icon-btn"></button>
      <button type="button" id="play-btn" class="icon-btn play"></button>
      <button type="button" id="next-btn" class="icon-btn"></button>
      <span class="spacer"></span>
      <button type="button" id="zout-btn" class="icon-btn"></button>
      <button type="button" id="zin-btn" class="icon-btn"></button>
    </div>

    <div id="tl-wrap">
      <div id="tl-heads" aria-hidden="true"></div>
      <div id="timeline" tabindex="0" role="application">
        <div id="tl-inner">
          <div id="ruler"></div>
          <div id="tracks"></div>
        </div>
      </div>
      <div id="playhead" aria-hidden="true"></div>
    </div>

    <nav id="tools" aria-label="Tools" data-i18n-aria="aria.tools"></nav>
  </main>

  <!-- Dialogs (centered, R32) -->
  <div id="scrim" hidden></div>
  <div id="dlg" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title" hidden>
    <div class="dlg-head">
      <h2 id="dlg-title"></h2>
      <span class="spacer"></span>
      <button type="button" id="dlg-close" class="icon-btn"></button>
    </div>
    <div id="dlg-body"></div>
  </div>

  <div id="busy" class="busy" hidden>
    <div class="busy-card" role="status" aria-live="polite">
      <p id="busy-text"></p>
      <progress id="busy-prog" max="1" value="0"></progress>
      <button type="button" id="busy-cancel" class="btn" data-i18n="btn.cancel" hidden>Cancel</button>
    </div>
  </div>

  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="../i18n.js?v=5.02.00" data-app="montage"></script>
  <script src="../vendor/mediabunny.min.js?v=5.02.00"></script>
  <script src="core.js?v=5.02.00"></script>
  <script src="package.js?v=5.02.00"></script>
  <script src="hash.js?v=5.02.00"></script>
  <script src="gl.js?v=5.02.00"></script>
  <script src="media.js?v=5.02.00"></script>
  <script src="player.js?v=5.02.00"></script>
  <script src="export.js?v=5.02.00"></script>
  <script src="reframe.js?v=5.02.00"></script>
  <script src="denoise.js?v=5.02.00"></script>
  <script src="asr.js?v=5.02.00"></script>
  <script src="../bundle.js?v=5.02.00"></script>
  <script src="montage.js?v=5.02.00"></script>

</body>
</html>
