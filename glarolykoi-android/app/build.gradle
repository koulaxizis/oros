plugins {
    id 'com.android.application'
}

// The version comes from GLAROLYKOI_VERSION ("1.2.3" → versionCode
// 1002003); a build without it is 1.0.0. Raise it in
// .github/workflows/glarolykoi-android.yml for each release.
def appVersion = {
    def v = System.getenv('GLAROLYKOI_VERSION') ?: '1.0.0'
    def m = (v =~ /^v?(\d+)\.(\d+)\.(\d+)$/)
    if (!m.find()) throw new GradleException("GLAROLYKOI_VERSION must look like 1.2.3, not ${v}")
    [name: "${m.group(1)}.${m.group(2)}.${m.group(3)}",
     code: Math.max(1, (m.group(1) as int) * 1000000 + (m.group(2) as int) * 1000 + (m.group(3) as int))]
}()

// Release signing comes from the environment (GitHub secrets in CI),
// never from a file in the repository.
def ks = System.getenv('GLAROLYKOI_KEYSTORE_FILE')

android {
    namespace 'net.glarolykoi.android'
    compileSdk 36

    defaultConfig {
        // PERMANENT (decision 2026-11-17): never change it.
        applicationId 'net.glarolykoi.android'
        minSdk 24
        targetSdk 36
        versionCode appVersion.code
        versionName appVersion.name
    }

    signingConfigs {
        if (ks) {
            release {
                storeFile file(ks)
                storePassword System.getenv('GLAROLYKOI_KEYSTORE_PASSWORD')
                keyAlias System.getenv('GLAROLYKOI_KEY_ALIAS')
                keyPassword System.getenv('GLAROLYKOI_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            // Own id: installs next to the real app.
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ks) signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // F-Droid: no Google dependency information block in the APK.
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    lint {
        checkReleaseBuilds false
    }
}

// No dependencies in the app on purpose: only the Android framework (no
// AndroidX, no Google Play services, no Firebase). CI fails if any
// appears. JUnit is for the unit tests only and never ships.
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
