<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-eIMrqygZthNQEkSZiGFz2mr6lGpdz6b4upgXDHioTug='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=starchart" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Star Chart · orOS</title>

  <link rel="stylesheet" href="../fonts.css?v=8.81.00">
  <link rel="stylesheet" href="starchart.css?v=8.81.00">
  <link rel="stylesheet" href="../gamekit/layout.css?v=8.81.00">

</head>
<body>

  <!-- Toolbar: the name and season, New season, Observatory, atlas, how to play, records, sound -->
  <header id="toolbar">
    <div class="tb-row" id="tb-a">
      <h1 class="tb-title" data-i18n="app.name">Star Chart</h1>
      <span class="tb-isle" id="tb-season"></span>
      <span class="spacer"></span>
      <button type="button" class="main-btn" id="season-btn" hidden><span class="ic"></span><span class="lb" data-i18n="btn.season">New season</span></button>
      <button type="button" class="main-btn" id="obs-btn"><span class="ic"></span><span class="lb" data-i18n="btn.obs">Observatory</span></button>
      <button type="button" class="icon-btn" id="atlas-btn"></button>
      <button type="button" class="icon-btn" id="help-btn"></button>
      <button type="button" class="icon-btn" id="stats-btn"></button>
      <button type="button" class="icon-btn" id="sfx-btn"></button>
    </div>
  </header>

  <!-- Status: starlight (and per minute), constellations, the moon, the sky now -->
  <div id="status">
    <span class="stat coins" id="s-sl"><span class="ic"></span><span class="v"></span><span class="r"></span></span>
    <span class="stat" id="s-cs"><span class="ic"></span><span class="v"></span></span>
    <span class="stat" id="s-moon"><span class="ic"></span><span class="v"></span></span>
    <span class="stat" id="s-sky"><span class="ic"></span><span class="v"></span></span>
  </div>

  <!-- The sky of the next hours -->
  <div id="fc" role="list"></div>

  <main id="scene">
    <canvas id="view" tabindex="0" role="application"></canvas>
  </main>

  <!-- The drawing, the chosen constellation, or what comes next -->
  <section id="panel" aria-live="off"></section>

  <dialog class="sc-dlg" id="dlg"></dialog>

  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="../i18n.js?v=8.81.00" data-app="starchart"></script>

  <script src="../gamekit/haptics.js?v=8.81.00"></script>
  <script src="engine.js?v=8.81.00"></script>
  <script src="starchart.js?v=8.81.00"></script>

  <script src="../pickers.js?v=8.81.00" defer></script>
</body>
</html>
