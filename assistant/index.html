<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-0Ocf1awmSvd+s7/P/eu1wiS/+yr+8/fzQbpX3o2eQcI='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=assistant" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>Assistant · orOS</title>

  <link rel="stylesheet" href="assistant.css?v=5.02.00">

</head>
<body data-side="closed">

  <header id="toolbar">
    <button type="button" class="icon-btn" id="nav-btn"></button>
    <div id="bar-title" class="bar-title"></div>
    <span class="spacer"></span>
    <button type="button" class="icon-btn" id="new-btn"></button>
    <button type="button" class="icon-btn" id="settings-btn"></button>
  </header>

  <div id="net" class="net" role="status" hidden></div>

  <main id="app">
    <!-- Conversations (device-local) -->
    <nav id="side" aria-label="Conversations">
      <button type="button" class="side-new" id="side-new"></button>
      <div id="chats"></div>
      <p id="chats-foot" class="hint pad"></p>
      <button type="button" class="side-hist" id="side-hist"></button>
    </nav>
    <div id="scrim" hidden></div>

    <!-- The conversation -->
    <section id="conv">
      <div id="scroll">
        <div id="welcome" hidden>
          <div class="wel-box">
            <div id="wel-icon" class="wel-icon" aria-hidden="true"></div>
            <h1 data-i18n="wel.title">Your AI assistant</h1>
            <p id="wel-text"></p>
            <button type="button" class="dlg-btn primary" id="wel-setup" data-i18n="btn.setup">Set up the assistant</button>
            <button type="button" class="dlg-btn primary" id="wel-brief" data-i18n="brief.btn" hidden>Briefing</button>
            <p id="wel-brief-hint" class="hint" data-i18n="brief.hint" hidden></p>
          </div>
        </div>
        <div id="msgs" aria-live="polite"></div>
      </div>
      <div id="composer">
        <div id="who" class="who" hidden></div>
        <div id="att-row" class="att-row" hidden></div>
        <div class="compose-row">
          <button type="button" class="icon-btn attach" id="att-btn"></button>
          <input type="file" id="att-file" multiple hidden>
          <textarea id="input" rows="1" maxlength="20000" autocomplete="off"></textarea>
          <button type="button" class="icon-btn send" id="send-btn"></button>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" role="status"></div>

  <script src="../i18n.js?v=5.02.00" data-app="assistant,recipes"></script>
  <script src="../importkit.js?v=5.02.00"></script>
  <script src="../atelier/zip.js?v=5.02.00"></script>
  <script src="../recipes/core.js?v=5.02.00"></script>
  <script src="../recipes/share.js?v=5.02.00"></script>
  <script src="../atelier/commands.js?v=5.02.00"></script>
  <script src="../designkit/model.js?v=5.02.00"></script>
  <script src="../layout/recipesteps.js?v=5.02.00"></script>
  <script src="../layout/commands.js?v=5.02.00"></script>
  <script src="../photolab/commands.js?v=5.02.00"></script>
  <script src="doctext.js?v=5.02.00"></script>
  <script src="core.js?v=5.02.00"></script>
  <script src="imgai.js?v=5.02.00"></script>
  <script src="summary.js?v=5.02.00"></script>
  <script src="edits.js?v=5.02.00"></script>
  <script src="create.js?v=5.02.00"></script>
  <script src="import.js?v=5.02.00"></script>
  <script src="assistant.js?v=5.02.00"></script>

</body>
</html>
