<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-pn9p0gf+J2mNsVlv304J+N0ZYZ4QuDMCm1gexOM8llE='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=podcasts" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Podcasts · orOS</title>

  <link rel="stylesheet" href="podcasts.css?v=4.99.00">

</head>
<body>

  <header id="toolbar">
    <span id="app-name" class="app-name"></span>
    <span class="spacer"></span>
    <button type="button" class="icon-btn" id="refresh-btn"></button>
    <button type="button" class="icon-btn" id="add-btn"></button>
    <button type="button" class="icon-btn" id="more-btn"></button>
  </header>

  <nav id="tabs" role="tablist">
    <button type="button" role="tab" data-tab="now"><span data-i18n="tab.now">Listening</span></button>
    <button type="button" role="tab" data-tab="new"><span data-i18n="tab.new">New</span><span class="cnt" id="cnt-new"></span></button>
    <button type="button" role="tab" data-tab="lib"><span data-i18n="tab.lib">Library</span></button>
    <button type="button" role="tab" data-tab="dl"><span data-i18n="tab.dl">Downloads</span></button>
    <button type="button" role="tab" data-tab="find"><span data-i18n="tab.find">Discover</span></button>
  </nav>

  <main id="main"></main>

  <div id="player" hidden>
    <div class="pl-prog"><div id="pl-prog"></div></div>
    <button type="button" id="pl-open" class="pl-open">
      <span id="pl-art" class="pl-art"></span>
      <span class="pl-text"><span id="pl-title" class="pl-title"></span><span id="pl-show" class="pl-show"></span></span>
    </button>
    <button type="button" class="icon-btn" id="pl-back"></button>
    <button type="button" class="icon-btn play" id="pl-play"></button>
    <button type="button" class="icon-btn" id="pl-fwd"></button>
  </div>

  <div id="toast" role="status"></div>

  <script src="../i18n.js?v=4.99.00" data-app="podcasts,recordpkg"></script>
  <script src="../feeds/core.js?v=4.99.00"></script>
  <script src="../feeds/fetch.js?v=4.99.00"></script>
  <script src="../feeds/sanitize.js?v=4.99.00"></script>
  <script src="core.js?v=4.99.00"></script>
  <script src="store.js?v=4.99.00"></script>
  <script src="gpodder.js?v=4.99.00"></script>
  <script src="../bundle.js?v=4.99.00"></script>
  <script src="../recordpkg.js?v=4.99.00"></script>
  <script src="package.js?v=4.99.00"></script>
  <script src="podcasts.js?v=4.99.00"></script>

</body>
</html>
