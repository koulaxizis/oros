<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator</title>


<link rel="stylesheet" href="calculator.css?v=0.49.02">

</head>
<body>
<div id="calc-root">

  <header class="calc-bar">
    <span class="calc-title" data-i18n="calc.title">Calculator</span>
    <button id="troll-toggle" type="button" aria-pressed="false">
      <span data-i18n="calc.troll" class="troll-label">Troll mode</span>
      <span aria-hidden="true">·</span>
      <span id="troll-state">Off</span>
      <span id="troll-intensity" class="troll-lvl" aria-hidden="true"></span>
    </button>
  </header>

  <main class="calc-main">

    <!-- Display -->
    <section class="calc-display" aria-live="polite">
      <div id="calc-expr"></div>
      <div id="calc-res" title="Click to copy">0</div>
    </section>

    <!-- Keypad -->
    <section class="calc-pad" id="calc-pad">
      <button type="button" class="key fn fnrow" data-k="mc">MC</button>
      <button type="button" class="key fn fnrow" data-k="mr">MR</button>
      <button type="button" class="key fn fnrow" data-k="mplus">M+</button>
      <button type="button" class="key fn fnrow" data-k="fx" aria-pressed="false">fx</button>

      <button type="button" class="key fn sci" data-k="sqrt">&radic;</button>
      <button type="button" class="key fn sci" data-k="sqr">x&sup2;</button>
      <button type="button" class="key fn sci" data-k="inv">1/x</button>
      <button type="button" class="key fn sci" data-k="sign">&plusmn;</button>

      <button type="button" class="key fn" data-k="ac" data-i18n="calc.key.ac">AC</button>
      <button type="button" class="key fn" data-k="back" aria-label="Backspace">&#9003;</button>
      <button type="button" class="key fn" data-k="pcnt">%</button>
      <button type="button" class="key op" data-k="div">&divide;</button>

      <button type="button" class="key num" data-k="7">7</button>
      <button type="button" class="key num" data-k="8">8</button>
      <button type="button" class="key num" data-k="9">9</button>
      <button type="button" class="key op" data-k="mul">&times;</button>

      <button type="button" class="key num" data-k="4">4</button>
      <button type="button" class="key num" data-k="5">5</button>
      <button type="button" class="key num" data-k="6">6</button>
      <button type="button" class="key op" data-k="sub">&minus;</button>

      <button type="button" class="key num" data-k="1">1</button>
      <button type="button" class="key num" data-k="2">2</button>
      <button type="button" class="key num" data-k="3">3</button>
      <button type="button" class="key op" data-k="add">+</button>

      <button type="button" class="key ans" data-k="ans" data-i18n="calc.key.ans">Ans</button>
      <button type="button" class="key num" data-k="0">0</button>
      <button type="button" class="key fn" data-k="dot">.</button>
      <button type="button" class="key eq" data-k="eq">=</button>
    </section>

    <!-- History -->
    <aside class="calc-history">
      <div class="calc-history-head">
        <span data-i18n="calc.history">History</span>
        <div class="calc-history-actions">
          <button type="button" id="history-csv">CSV</button>
          <button type="button" id="history-clear" data-i18n="calc.history.clear">Clear</button>
        </div>
      </div>
      <ul id="calc-history" class="calc-history-list"></ul>
      <div id="history-empty" class="calc-history-empty" data-i18n="calc.history.empty">
        Nothing here yet.
      </div>
    </aside>

  </main>
</div>

<script src="calculator.js?v=0.49.02"></script>

</body>
</html>
