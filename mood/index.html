<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mood · orOS</title>
<link rel="stylesheet" href="mood.css?v=0.25.2">
</head>
<body>
<header id="topbar">
  <span id="app-title" data-i18n="app.title">Mood</span>
  <span class="spacer"></span>
  <button id="cap-btn" type="button" aria-label="Capture"></button>
  <button id="ent-btn" type="button" aria-label="Entries"></button>
  <button id="ins-btn" type="button" aria-label="Insights"></button>
</header>

<main id="moodmain">
  <!-- 7-day thread (colored dots, JS-built; capture view only) -->
  <div id="thread" hidden></div>

  <!-- capture card: the whole L1–L4 flow, JS builds internals -->
  <section id="capture"></section>

  <!-- entries view (JS-built rows, newest first) -->
  <section id="recent" hidden>
    <h2 class="sec-title" data-i18n="recent.title">Entries</h2>
    <ul id="entry-list"></ul>
  </section>
  <section id="insights" hidden></section>
</main>

<script src="mood.js?v=0.25.2"></script>
</body>
</html>
