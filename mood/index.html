<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && !/[?&]standalone\b/.test(location.search)) location.replace("../?open=mood" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mood · orOS</title>

<link rel="stylesheet" href="mood.css?v=1.88.02">

</head>
<body>
<header id="topbar">
  <span id="app-title" data-i18n="app.title">Mood</span>
  <span class="spacer"></span>
  <button id="cap-btn" type="button"></button>
  <button id="ent-btn" type="button"></button>
  <button id="ins-btn" type="button"></button>
</header>

<main id="moodmain">
  <!-- 7-day thread (colored dots, JS-built; capture view only) -->
  <div id="thread" hidden></div>

  <!-- capture card: the whole L1–L4 flow, JS builds internals -->
  <section id="capture"></section>

  <!-- entries view (JS-built rows, newest first) -->
  <section id="recent" hidden>
    <h2 class="sec-title" data-i18n="recent.title">Entries</h2>
    <ul id="entry-list"></ul>
  </section>
  <section id="insights" hidden></section>
</main>

<script src="mood.js?v=1.88.02"></script>

</body>
</html>
