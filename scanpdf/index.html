<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-VyncIXtaqe3myen+RNx765PPKVDwK0BqkrR2FOaf//g='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=scanpdf" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Scanner &amp; PDF · orOS</title>

  <link rel="stylesheet" href="scanpdf.css?v=5.03.00">

</head>
<body>

  <header id="toolbar">
    <div class="title">
      <span id="title-main" class="title-main" data-i18n="app.name">Scanner &amp; PDF</span>
      <span id="title-sub" class="title-sub" data-i18n="app.sub"></span>
    </div>
    <span class="spacer"></span>
    <button type="button" id="undo-btn" class="icon-btn" disabled></button>
    <button type="button" id="redo-btn" class="icon-btn" disabled></button>
    <button type="button" id="scan-btn" class="icon-btn"></button>
    <button type="button" id="add-btn" class="icon-btn"></button>
    <button type="button" id="clear-btn" class="icon-btn" hidden></button>
  </header>

  <div id="selbar" hidden>
    <span id="sel-info" class="sel-info" aria-live="polite"></span>
    <span class="spacer"></span>
    <div class="sel-btns" role="toolbar" id="sel-tools">
      <button type="button" class="icon-btn" id="sel-all"></button>
      <button type="button" class="icon-btn" id="sel-left"></button>
      <button type="button" class="icon-btn" id="sel-right"></button>
      <button type="button" class="icon-btn" id="sel-rotl"></button>
      <button type="button" class="icon-btn" id="sel-rotr"></button>
      <button type="button" class="icon-btn" id="sel-dup"></button>
      <button type="button" class="icon-btn" id="sel-extract"></button>
      <button type="button" class="icon-btn danger" id="sel-del"></button>
    </div>
  </div>

  <main id="main">
    <div class="wrap">

      <section id="drop" class="drop">
        <p class="drop-title" data-i18n="drop.title">Drop PDFs or pictures here</p>
        <p class="drop-hint hint small" data-i18n="drop.hint"></p>
        <div class="drop-btns">
          <button type="button" id="scan-start" class="btn primary" data-i18n="btn.scan">Scan with the camera</button>
          <button type="button" id="dev-start" class="btn" data-i18n="btn.device" hidden>Add from scanner</button>
          <button type="button" id="add-files" class="btn" data-i18n="btn.add">Add PDFs or pictures</button>
        </div>
        <p class="hint small local" data-i18n="drop.local"></p>
      </section>

      <section id="pages-sec" hidden>
        <p id="pages-hint" class="hint small" data-i18n="pages.hint"></p>
        <ul id="grid" class="grid" aria-labelledby="title-main"></ul>
        <div class="add-more">
          <button type="button" id="scan-more" class="btn" data-i18n="btn.scan">Scan with the camera</button>
          <button type="button" id="dev-more" class="btn" data-i18n="btn.device" hidden>Add from scanner</button>
          <button type="button" id="add-more" class="btn" data-i18n="btn.addMore">Add more</button>
        </div>
      </section>

    </div>
  </main>

  <footer id="foot" hidden>
    <div id="foot-info" class="foot-info"></div>
    <div class="foot-btns">
      <button type="button" id="text-btn" class="btn" data-i18n="btn.read">Read text</button>
      <button type="button" id="opt-btn" class="btn" data-i18n="btn.options">Options</button>
      <button type="button" id="split-btn" class="btn" data-i18n="btn.split">Split</button>
      <button type="button" id="save-btn" class="btn primary" data-i18n="btn.save">Save PDF</button>
    </div>
  </footer>

  <div id="editor" role="dialog" aria-modal="true" aria-labelledby="ed-title" hidden>
    <header class="ed-bar">
      <button type="button" id="ed-cancel" class="icon-btn"></button>
      <span id="ed-title" class="ed-title"></span>
      <button type="button" id="ed-done" class="btn primary" data-i18n="btn.done">Done</button>
    </header>
    <div class="ed-tools">
      <button type="button" id="ed-prev" class="icon-btn"></button>
      <button type="button" id="ed-next" class="icon-btn"></button>
      <span class="spacer"></span>
      <button type="button" id="ed-sig" class="btn small"></button>
      <button type="button" id="ed-text" class="btn small"></button>
      <button type="button" id="ed-date" class="btn small"></button>
      <button type="button" id="ed-shape" class="btn small" aria-expanded="false" aria-controls="ed-shapes"></button>
      <button type="button" id="ed-pen" class="btn small" aria-pressed="false"></button>
      <button type="button" id="ed-marker" class="btn small" aria-pressed="false"></button>
      <button type="button" id="ed-cover" class="btn small"></button>
      <button type="button" id="ed-pic" class="btn small"></button>
    </div>
    <div id="ed-shapes" class="ed-tools ed-sub" role="group" hidden>
      <button type="button" class="btn small" data-k="rect"></button>
      <button type="button" class="btn small" data-k="ellipse"></button>
      <button type="button" class="btn small" data-k="line"></button>
      <button type="button" class="btn small" data-k="arrow"></button>
      <button type="button" class="btn small" data-k="check"></button>
      <button type="button" class="btn small" data-k="cross"></button>
    </div>
    <div id="ed-props" class="ed-props" hidden>
      <input type="text" id="ed-input" maxlength="200" spellcheck="false">
      <div id="ed-colors" class="ed-colors" role="group">
        <button type="button" class="swatch" data-color="black"></button>
        <button type="button" class="swatch" data-color="blue"></button>
        <button type="button" class="swatch" data-color="red"></button>
        <button type="button" class="swatch" data-color="green"></button>
        <button type="button" class="swatch" data-color="yellow"></button>
        <button type="button" class="swatch" data-color="white"></button>
      </div>
      <div id="ed-widths" class="ed-widths" role="group">
        <button type="button" class="wbtn" data-w="0"><span></span></button>
        <button type="button" class="wbtn" data-w="1"><span></span></button>
        <button type="button" class="wbtn" data-w="2"><span></span></button>
      </div>
      <button type="button" id="ed-fill" class="btn small" aria-pressed="false"></button>
      <button type="button" id="ed-unstroke" class="btn small"></button>
      <button type="button" id="ed-all" class="btn small"></button>
      <button type="button" id="ed-del" class="btn small"></button>
      <p id="ed-note" class="ed-note hint small" hidden></p>
    </div>
    <div id="ed-stage" class="ed-stage">
      <div id="ed-page" class="ed-page"><canvas id="ed-canvas"></canvas><div id="ed-layer"></div></div>
    </div>
    <p class="ed-hint hint small" data-i18n="ed.hint"></p>
  </div>

  <div id="scanner" role="dialog" aria-modal="true" aria-labelledby="sc-title" hidden>
    <header class="ed-bar">
      <button type="button" id="sc-close" class="icon-btn"></button>
      <span id="sc-title" class="ed-title" data-i18n="sc.title">Scan</span>
      <button type="button" id="sc-done" class="btn primary" hidden></button>
    </header>

    <div id="sc-cam" class="sc-view">
      <div id="sc-camstage" class="sc-stage">
        <video id="sc-video" playsinline muted></video>
        <canvas id="sc-outline" aria-hidden="true"></canvas>
        <p id="sc-tip" class="sc-tip" aria-live="polite"></p>
        <div id="sc-msg" class="sc-msg" hidden>
          <p id="sc-msg-text"></p>
          <button type="button" id="sc-msg-photos" class="btn primary" data-i18n="sc.photos">Choose photos</button>
        </div>
      </div>
      <div id="sc-dev" class="sc-dev" hidden>
        <div class="sc-devbox">
          <p id="dv-msg" class="dv-msg" aria-live="polite"></p>
          <div id="dv-pair" class="form" hidden>
            <p class="hint small" data-i18n="dv.pair"></p>
            <button type="button" id="dv-show" class="btn" data-i18n="dv.showCode">Show the code</button>
            <label class="field"><span class="field-l" data-i18n="dv.code">Code</span><input type="text" id="dv-code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" spellcheck="false"></label>
            <button type="button" id="dv-pairgo" class="btn primary" data-i18n="dv.pairGo">Pair</button>
          </div>
          <div id="dv-form" class="form" hidden>
            <label class="field"><span class="field-l" data-i18n="dv.scanner">Scanner</span><select id="dv-scanner"></select></label>
            <div class="dv-row">
              <label class="field"><span class="field-l" data-i18n="dv.source">Paper</span><select id="dv-source"></select></label>
              <label class="field"><span class="field-l" data-i18n="dv.mode">Colour</span><select id="dv-mode"></select></label>
              <label class="field"><span class="field-l" data-i18n="dv.dpi">Resolution</span><select id="dv-dpi"></select></label>
            </div>
            <label class="opt"><input type="checkbox" id="dv-read"><span class="opt-t" data-i18n="dv.read">Read the text after scanning</span></label>
            <p class="hint small" data-i18n="dv.hint"></p>
          </div>
        </div>
      </div>
      <div class="sc-bar sc-devbar" id="sc-devbar" hidden>
        <button type="button" id="dv-again" class="btn small" data-i18n="dv.again">Look again</button>
        <span class="spacer"></span>
        <button type="button" id="dv-cancel" class="btn" data-i18n="dv.cancel" hidden>Cancel</button>
        <button type="button" id="dv-scan" class="btn primary" data-i18n="dv.scan" disabled>Scan</button>
      </div>
      <div class="sc-bar sc-shootbar">
        <button type="button" id="sc-photos" class="icon-btn"></button>
        <label class="sc-auto" id="sc-auto-l"><input type="checkbox" id="sc-auto" checked><span data-i18n="sc.auto">Auto</span></label>
        <button type="button" id="sc-shoot" class="sc-shoot"></button>
        <button type="button" id="sc-torch" class="icon-btn" hidden></button>
      </div>
      <ul id="sc-strip" class="sc-strip"></ul>
    </div>

    <div id="sc-adjust" class="sc-view" hidden>
      <p class="sc-tip-top hint small" data-i18n="sc.adjust"></p>
      <div id="sc-adjstage" class="sc-stage">
        <div id="sc-adjbox" class="sc-adjbox">
          <canvas id="sc-photo"></canvas>
          <svg id="sc-quad" class="sc-quad" aria-hidden="true"><polygon id="sc-poly"></polygon></svg>
          <button type="button" class="sc-h" data-i="0"></button>
          <button type="button" class="sc-h" data-i="1"></button>
          <button type="button" class="sc-h" data-i="2"></button>
          <button type="button" class="sc-h" data-i="3"></button>
          <canvas id="sc-loupe" class="sc-loupe" width="240" height="240" hidden></canvas>
        </div>
      </div>
      <div class="sc-bar">
        <button type="button" id="sc-whole" class="btn small" data-i18n="sc.whole">Whole picture</button>
        <button type="button" id="sc-retake" class="btn small" data-i18n="sc.retake">Take again</button>
        <span class="spacer"></span>
        <button type="button" id="sc-next" class="btn primary" data-i18n="sc.next">Next</button>
      </div>
    </div>

    <div id="sc-review" class="sc-view" hidden>
      <div id="sc-revstage" class="sc-stage"><canvas id="sc-result"></canvas></div>
      <div id="sc-filters" class="sc-filters" role="radiogroup"></div>
      <div class="sc-bar">
        <button type="button" id="sc-rotl" class="icon-btn"></button>
        <button type="button" id="sc-rotr" class="icon-btn"></button>
        <button type="button" id="sc-corners" class="btn small" data-i18n="sc.corners">Corners</button>
        <button type="button" id="sc-del" class="icon-btn danger" hidden></button>
        <span class="spacer"></span>
        <button type="button" id="sc-keep" class="btn primary" data-i18n="sc.keep">Keep page</button>
      </div>
    </div>
  </div>

  <div id="modal-veil" hidden>
    <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div class="modal-btns">
        <button type="button" id="modal-cancel" class="btn" data-i18n="btn.cancel">Cancel</button>
        <button type="button" id="modal-ok" class="btn primary"></button>
      </div>
    </div>
  </div>

  <div id="busy" hidden><div class="busy-box"><span class="spin" aria-hidden="true"></span><span id="busy-text"></span><button type="button" id="busy-stop" class="btn" data-i18n="ocr.stop" hidden>Stop</button></div></div>
  <div id="drag-veil" hidden><span data-i18n="drop.veil">Drop to add</span></div>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="../i18n.js?v=5.03.00" data-app="scanpdf"></script>
  <script src="../vendor/pdf-lib/pdf-lib.min.js?v=5.03.00"></script>
  <script src="core.js?v=5.03.00"></script>
  <script src="scan.js?v=5.03.00"></script>
  <script src="device.js?v=5.03.00"></script>
  <script src="ocr.js?v=5.03.00"></script>
  <script src="pdfops.js?v=5.03.00"></script>
  <script src="../bundle.js?v=5.03.00"></script>
  <script src="scanpdf.js?v=5.03.00"></script>

</body>
</html>
