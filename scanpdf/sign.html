<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="A document sent with orOS for you to sign. It opens right here, in your browser.">
  <meta property="og:title" content="orOS: a document to sign">
  <meta property="og:description" content="Open the link to read the document and sign it in your browser. No account needed.">
  <title>orOS · Sign</title>
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../fonts.css?v=6.29.00">
  <link rel="stylesheet" href="../share/share.css?v=6.29.00">
  <link rel="stylesheet" href="sign.css?v=6.29.00">
</head>
<body>
  <header id="top">
    <a id="brand" href="../"><img src="../icon.svg" alt="" width="26" height="26"><span>orOS</span></a>
    <span id="top-sub">Sign</span>
  </header>

  <main id="card" aria-live="polite">
    <p id="state" class="state">Opening…</p>
  </main>

  <div id="pages" class="sg-pages" hidden></div>
  <section id="finish" class="sg-finish" hidden></section>

  <p id="privacy" class="foot">The document travelled encrypted. Only this browser could open it, with the key that is in the link.</p>
  <p class="foot"><a href="../" id="what">What is orOS?</a></p>

  <div id="pad-veil" class="sg-veil" hidden>
    <div id="pad" class="sg-pad" role="dialog" aria-modal="true" aria-labelledby="pad-title">
      <h2 id="pad-title"></h2>
      <div class="sg-tabs" role="tablist">
        <button type="button" id="pad-draw" role="tab"></button>
        <button type="button" id="pad-type" role="tab"></button>
      </div>
      <div id="pad-drawbox" class="sg-drawbox">
        <canvas id="pad-canvas" width="600" height="200"></canvas>
        <p class="hint small" id="pad-hint"></p>
      </div>
      <div id="pad-typebox" class="sg-typebox" hidden>
        <input type="text" id="pad-name" maxlength="80" autocomplete="name" spellcheck="false">
        <p id="pad-preview" class="sg-preview" aria-hidden="true"></p>
      </div>
      <p id="pad-msg" class="sg-msg" hidden></p>
      <div class="acts">
        <button type="button" id="pad-clear"></button>
        <button type="button" id="pad-cancel"></button>
        <button type="button" id="pad-ok" class="prim"></button>
      </div>
    </div>
  </div>

  <script src="../i18n.js?v=6.29.00" data-app="scanpdf"></script>
  <script src="../vendor/pdf-lib/pdf-lib.min.js?v=6.29.00"></script>
  <script src="../share/relay.js?v=6.29.00"></script>
  <script src="core.js?v=6.29.00"></script>
  <script src="pdfops.js?v=6.29.00"></script>
  <script src="sign-core.js?v=6.29.00"></script>
  <script src="sign.js?v=6.29.00"></script>
</body>
</html>
