<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && !/[?&]standalone\b/.test(location.search)) location.replace("../?open=habits" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Habits · orOS</title>
  <link rel="stylesheet" href="habits.css?v=1.70.00">
</head>
<body>
  <header class="top">
    <button class="btn prim" id="btn-add" type="button"></button>
    <div class="seg" role="group">
      <button class="seg-btn" id="btn-vlist" type="button"></button>
      <button class="seg-btn" id="btn-vcal" type="button"></button>
      <button class="seg-btn" id="btn-vstats" type="button"></button>
    </div>
    <div class="spacer"></div>
    <div class="period">
      <button class="btn ghost pbtn" id="btn-prev" type="button"></button>
      <button class="btn ghost pbtn" id="btn-now" type="button"></button>
      <span class="plabel" id="period-label"></span>
      <button class="btn ghost pbtn" id="btn-next" type="button"></button>
    </div>
  </header>
  <main class="view" id="view"></main>
  <div class="toast" id="toast" role="status" hidden></div>
  <!-- App feeds: read-only rows from other apps (window.orosHabitFeeds) -->
  <script src="../water/core.js?v=1.70.00"></script>
  <script src="../fitness/core.js?v=1.70.00"></script>
  <script src="../zen/core.js?v=1.70.00"></script>
  <script src="core.js?v=1.70.00"></script>
  <script src="habits.js?v=1.70.00"></script>
</body>
</html>
