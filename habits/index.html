<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Habits · orOS</title>
  <link rel="stylesheet" href="habits.css?v=0.1.0">
</head>
<body>
  <header class="top">
    <button class="btn prim" id="btn-add" type="button"></button>
    <div class="spacer"></div>
    <div class="period">
      <button class="btn ghost pbtn" id="btn-prev" type="button" aria-label="Previous week"></button>
      <span class="plabel" id="period-label"></span>
      <button class="btn ghost pbtn" id="btn-next" type="button" aria-label="Next week"></button>
    </div>
  </header>
  <main class="view" id="view"></main>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="habits.js?v=0.1.0"></script>
</body>
</html>
