<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-YBGrlVM9X27jky28XllNXSQhDtG9M2XyyRUW6KelkFM='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=nonogram" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nonogram · orOS</title>

  <link rel="stylesheet" href="nonogram.css?v=4.99.00">

</head>
<body>

  <!-- Toolbar: one line on a wide screen, two scrolling strips on a phone -->
  <header id="toolbar">
    <div class="tb-row" id="tb-a">
      <div class="seg" id="size-seg" role="group">
        <button type="button" class="seg-btn" data-size="5">5×5</button>
        <button type="button" class="seg-btn" data-size="10">10×10</button>
        <button type="button" class="seg-btn" data-size="15">15×15</button>
      </div>
      <div class="seg" id="mode-seg" role="group">
        <button type="button" class="seg-btn" data-mode="f"><span class="mi mi-f"></span><span data-i18n="mode.f">Fill</span></button>
        <button type="button" class="seg-btn" data-mode="x"><span class="mi mi-x"></span><span data-i18n="mode.x">Mark</span></button>
      </div>
    </div>
    <div class="tb-row" id="tb-b">
      <span class="spacer"></span>
      <button type="button" class="icon-btn" id="zoom-btn" aria-pressed="false"></button>
      <button type="button" class="icon-btn" id="undo-btn"></button>
      <button type="button" class="icon-btn" id="hint-btn"></button>
      <button type="button" class="icon-btn" id="new-btn"></button>
      <button type="button" class="icon-btn" id="daily-btn"></button>
      <button type="button" class="icon-btn" id="stats-btn"></button>
      <button type="button" class="icon-btn" id="sfx-btn" aria-pressed="false"></button>
    </div>
  </header>

  <!-- Status: time, message, best time -->
  <div id="status">
    <span class="stat"><span data-i18n="st.time">Time</span><strong id="time">0:00</strong></span>
    <span id="turn" aria-live="polite"></span>
    <span class="stat"><strong id="best">–</strong><span data-i18n="st.best">Best</span></span>
  </div>

  <main id="board-wrap">
    <div id="pic" tabindex="0"></div>
  </main>

  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="../i18n.js?v=4.99.00" data-app="nonogram"></script>
  <script src="../gamekit/daily.js?v=4.99.00"></script>
  <script src="nonogram.js?v=4.99.00"></script>

</body>
</html>
