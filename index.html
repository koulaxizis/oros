<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="orOS — A static operating system in your browser. Bilingual, dark-first, open source.">
  <title>orOS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%236d4aff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= TOP BAR (persistent) ================= -->
  <header id="oros-bar">
    <div class="bar-left">
      <button id="btn-menu" data-i18n-title="bar.menu" title="Applications">⊞ <span id="btn-menu-label">Applications</span></button>
    </div>
        <div class="bar-right">
      <button id="btn-lang" title="Language"></button>
      <span id="bar-clock" data-i18n-title="bar.clock.tooltip" title="Time (24h)">--:--</span>
    </div>
  </header>

  <!-- ================= APPLICATIONS MENU ================= -->
  <nav id="app-menu"></nav>

  <!-- ================= DESKTOP ================= -->
  <main id="oros-desktop"></main>

  <!-- ================= RUNNING APP VIEW ================= -->
  <section id="oros-running">
    <iframe id="app-frame" title="orOS application"></iframe>
  </section>

  <script src="translations.js"></script>
  <script src="shell.js"></script>
</body>
</html>
