<!DOCTYPE html>
<html lang="en" data-theme="dark" data-skin="oros">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="orOS — A static operating system in your browser. Works offline, no cookies, no tracking.">
  <title>orOS</title>

  <!-- ============ PWA ============ -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1b1a18">

  <!-- Icons -->
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- iOS standalone behaviour -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="orOS">

  <!-- ============ Shell ============ -->
  <link rel="stylesheet" href="style.css?v=0.18.0">

  <noscript>
    <div style="font-family: system-ui, sans-serif; background:#1b1a18; color:#e8eaf0;
                min-height:100vh; display:flex; align-items:center; justify-content:center;
                text-align:center; padding:24px;">
      <p>orOS needs JavaScript to run.<br>Ενεργοποίησε τη JavaScript και ξαναδοκίμασε.</p>
    </div>
  </noscript>
</head>
<body>

  <!-- ================= TOP BAR (persistent) ================= -->
  <header id="oros-bar">
    <div class="bar-left">
      <button id="btn-menu" data-i18n-title="bar.menu" title="Applications"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span id="btn-menu-label">Applications</span><span id="btn-menu-version"></span></button>
    </div>
    <div class="bar-right">
      <button id="btn-lang" title="Language"></button>
      <span id="bar-clock" data-i18n-title="bar.clock.tooltip" title="Time (24h)">--:--</span>
    </div>
  </header>

  <!-- ================= APPLICATIONS MENU ================= -->
  <nav id="app-menu"></nav>

  <!-- ================= DESKTOP ================= -->
  <main id="oros-desktop"></main>

  <!-- ================= RUNNING APP VIEW ================= -->
  <section id="oros-running">
    <iframe id="app-frame" title="orOS application"></iframe>
  </section>

<script>
/* orOS update broker — inline in index.html so it is ALWAYS fresh
   (index.html is served network-first by the service worker; the
   cached shell.js can never be trusted to manage its own update).
   v0.6.2 — AUTO-UPDATE: the worker calls skipWaiting() on install,
   so the lifecycle is: install -> activate -> controllerchange ->
   reload. No user gate, no toast — the version toast in shell.js
   is the sole update confirmation. Byte-check forced on every
   load + hourly re-check for long-lived sessions. */
(function () {
  "use strict";
  if (!("serviceWorker" in navigator)) return;

  navigator.serviceWorker.register("sw.js").then(function (r) {
    // Force a byte-check on EVERY load — never rely on browser mood.
    r.update().catch(function () {});
    // Gentle hourly re-check for long-lived sessions
    setInterval(function () { r.update().catch(function () {}); }, 60 * 60 * 1000);
  }).catch(function () {});

  var reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", function () {
    if (reloading) return;
    reloading = true;
    window.location.reload();
  });
})();
</script>
  <script src="translations.js?v=0.18.0"></script>
  <script src="sync.js?v=0.18.0"></script>
  <script src="shell.js?v=0.18.0"></script>
</body>
</html>
