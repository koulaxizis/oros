<!DOCTYPE html>
<html lang="en" data-theme="dark" data-skin="oros">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="orOS — A static operating system in your browser. Works offline, no cookies, no tracking.">
  <title>orOS</title>

  <!-- ============ PWA ============ -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1b1a18">

  <!-- Icons -->
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- iOS standalone behaviour -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="orOS">

  <!-- ============ Shell ============ -->
  <link rel="stylesheet" href="style.css">

  <noscript>
    <div style="font-family: system-ui, sans-serif; background:#1b1a18; color:#e8eaf0;
                min-height:100vh; display:flex; align-items:center; justify-content:center;
                text-align:center; padding:24px;">
      <p>orOS needs JavaScript to run.<br>Ενεργοποίησε τη JavaScript και ξαναδοκίμασε.</p>
    </div>
  </noscript>
</head>
<body>

  <!-- ================= TOP BAR (persistent) ================= -->
  <header id="oros-bar">
    <div class="bar-left">
      <button id="btn-menu" data-i18n-title="bar.menu" title="Applications">⊞ <span id="btn-menu-label">Applications</span></button>
    </div>
    <div class="bar-right">
      <button id="btn-lang" title="Language"></button>
      <span id="bar-clock" data-i18n-title="bar.clock.tooltip" title="Time (24h)">--:--</span>
    </div>
  </header>

  <!-- ================= APPLICATIONS MENU ================= -->
  <nav id="app-menu"></nav>

  <!-- ================= DESKTOP ================= -->
  <main id="oros-desktop"></main>

  <!-- ================= RUNNING APP VIEW ================= -->
  <section id="oros-running">
    <iframe id="app-frame" title="orOS application"></iframe>
  </section>

<script>
/* orOS update broker — inline in index.html so it is ALWAYS fresh
   (index.html is served network-first by the service worker; the
   cached shell.js can never be trusted to manage its own update).
   Lifecycle: detect waiting worker -> toast -> SKIP_WAITING ->
   controllerchange -> reload. Sole owner of the toast. The shell only
   mirrors "update ready" into its menu button via the event. */
(function () {
  "use strict";
  if (!("serviceWorker" in navigator)) return;

  function txt(en, el) {
    return localStorage.getItem("oros-lang") === "el" ? el : en;
  }

  var reg = null;
  var toastShown = false;

  window.orosActivateUpdate = function () {
    if (reg && reg.waiting) reg.waiting.postMessage("SKIP_WAITING");
  };

  function showUpdate() {
    if (toastShown) return;
    toastShown = true;
    window.__orosUpdateReady = true;

    // Tell the (possibly cached) shell so the menu button flips
    try { window.dispatchEvent(new CustomEvent("oros-update-ready")); } catch (e) {}

    setTimeout(function () {
      // An older shell may already have spawned its own toast — yield.
      if (document.getElementById("update-toast")) return;

      var t = document.createElement("div");
      t.id = "update-toast";
      t.setAttribute("role", "button");
      t.appendChild(document.createTextNode(
        txt("A new version of orOS is ready.", "Μια νέα έκδοση του orOS είναι έτοιμη.") + " "
      ));
      var b = document.createElement("strong");
      b.textContent = txt("Update", "Ανανέωση");
      b.style.color = "var(--accent, #d4af37)";
      t.appendChild(b);

      // Fully self-contained styling: never depends on cached CSS
      t.style.cssText =
        "position:fixed;top:calc(48px + env(safe-area-inset-top,0px));right:12px;" +
        "z-index:2100;display:flex;align-items:center;gap:10px;cursor:pointer;" +
        "background:var(--panel-bg,#222);color:var(--text,#eee);" +
        "border:1px solid var(--border,#444);border-radius:8px;" +
        "box-shadow:0 4px 16px rgba(0,0,0,.4);padding:10px 14px;font-size:13px;" +
        "font-family:inherit;opacity:0;transition:opacity .35s ease;";

      t.addEventListener("click", function () {
        window.orosActivateUpdate();
      });
      document.body.appendChild(t);
      requestAnimationFrame(function () { t.style.opacity = "1"; });
    }, 500);
  }

  function watchWorker(w) {
    if (!w) return;
    w.addEventListener("statechange", function () {
      if (w.state === "installed" && navigator.serviceWorker.controller) showUpdate();
    });
    if (w.state === "installed" && navigator.serviceWorker.controller) showUpdate();
  }

  navigator.serviceWorker.register("sw.js").then(function (r) {
    reg = r;

    // Already waiting from a previous ignored update
    if (r.waiting && navigator.serviceWorker.controller) showUpdate();
    // Already installing when we attached (the boot race, covered)
    watchWorker(r.installing);
    // Discovered during this session
    r.addEventListener("updatefound", function () {
      watchWorker(r.installing);
    });

    // Force a byte-check on EVERY load — never rely on browser mood.
    r.update().catch(function () {});
    // Gentle hourly re-check for long-lived sessions
    setInterval(function () { r.update().catch(function () {}); }, 60 * 60 * 1000);
  }).catch(function () {});

  var reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", function () {
    if (reloading) return;
    reloading = true;
    window.location.reload();
  });
})();
</script>
  <script src="translations.js"></script>
  <script src="sync.js"></script>
  <script src="shell.js"></script>
</body>
</html>
