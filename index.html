  <noscript>

  <!-- ================= BOOT SPLASH =================
       Static in HTML: visible BEFORE any JS parses, styled inline
       (FOUC-proof). TIMER-based, not lifecycle-based: hides on
       load + 700ms (fail-safe 10s) — it does NOT wait for the SW
       update check. The broker's update-path reload bypasses this
       splash entirely via the "oros-skip-splash" flag. Survives
       even if shell.js fails to load (see onerror below). -->
  <div id="oro-splash" role="status"
       style="position:fixed;inset:0;z-index:9999;background:#14120d;color:#e8eaf0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-family:system-ui,sans-serif;font-size:15px;line-height:1.6;transition:opacity .4s;">
    <span id="oro-splash-text">Welcome to orOS. Searching for updates, please wait…</span>
  </div>

  <script>
  (function () {
    "use strict";
    var s = document.getElementById("oro-splash");
    var txt = document.getElementById("oro-splash-text");
    if (!s) return;

    // Mobile visibility: a failed boot must not look like waiting —
    // the splash is the only surface that exists before shell.js.
    window.addEventListener("error", function (ev) {
      if (done) return;
      // IN-4: capture=true — resource load failures (script/link)
      // never bubble: the error dies on the element unless we listen
      // in the CAPTURE phase. ev.target (not ev.message) identifies
      // the failed asset. Decorative assets (icons, manifest) never
      // count as boot failures — a missing favicon is not a broken OS.
      var failedSrc = "";
      if (ev && ev.target && ev.target !== window) {
        // IN-5: only a failed SCRIPT or stylesheet LINK is a boot
        // failure. Every other element (img, audio, video, source)
        // reports here too in the capture phase, with no message:
        // it used to print "Startup error: unknown" and hold the
        // screen for 45s over one broken image.
        if (ev.target.tagName !== "SCRIPT" && ev.target.tagName !== "LINK") return;
        failedSrc = String(ev.target.src || ev.target.href || "");
        if (!failedSrc || /icon|manifest/i.test(failedSrc)) return;
      }
      // IP1: a throw INSIDE this handler (blocked localStorage →
      // SecurityError in hardened browsers) fires ANOTHER window
      // error event → this listener again → recursion. Diagnostics
      // must never crash the diagnostics.
      var lang = "en";
      try { lang = localStorage.getItem("oros-lang") || "en"; } catch (e0) {}
      if (txt) {
        var why;
        if (ev.message) why = ev.message;
        else if (failedSrc) why = "failed to load " + failedSrc.split("/").pop();
        else why = (lang === "el") ? "άγνωστο" : "unknown";
        txt.textContent = (lang === "el")
          ? "Σφάλμα εκκίνησης: " + why + " — δοκίμασε hard refresh. (Πάτησε για κλείσιμο.)"
          : "Startup error: " + why + " — try a hard refresh. (Tap to dismiss.)";
        txt.style.color = "#e06c75";
        // IN-6: the update-reload path keeps the splash hidden (see
        // below); a boot error must still be seen there.
        s.style.display = "flex";
        s.style.cursor = "pointer";
        // IP2: keep the message readable. Without this, the load+700ms
        // hide() erases it almost instantly — and the desktop behind
        // the splash never rendered (that's WHY the error exists).
        // hideNotBefore is hoisted (var) with `done` below — safe.
        hideNotBefore = Date.now() + 45000;
      }
    }, true);
    // (β) update-triggered reload: NO second splash — the user was
    // already looking at this same screen. The broker sets the flag
    // right before reloading (controllerchange); consume it here.
    try {
      if (sessionStorage.getItem("oros-skip-splash") === "1") {
        sessionStorage.removeItem("oros-skip-splash");
        // IN-6: hide, do not remove, and do not return. The splash is
        // the only surface for a boot error, and an update reload is
        // exactly when a broken new bundle arrives. The normal hide()
        // below removes the node after load.
        s.style.display = "none";
      }
    } catch (e) {}
    // Greek from the very first frame if it's the stored language
    // (translations.js loads too late to matter for the splash)
    try {
      if (localStorage.getItem("oros-lang") === "el" && txt) {
        // Ι2: singular "Καλώς ήρθες" for personal tone (single user,
        // personal OS — not corporate "you guys"). Matches the
        // welcoming aesthetic better than formal plural.
        // Δ6: singular throughout — matches the Ι2 personal tone
        // ("ήρθες" was already singular; "περιμένετε" broke the register).
        txt.textContent = "Καλώς ήρθες στο orOS. Γίνεται αναζήτηση ενημερώσεων, περίμενε λίγο…";
        document.documentElement.lang = "el";
      }
    } catch (e) {}

    var done = false;
    var hideNotBefore = 0;    // IP2: boot-error message visibility window
    function hide() {
      if (done) return;
      if (Date.now() < hideNotBefore) {
        // IP2: defer every hide attempt (load+700ms AND the 10s
        // fail-safe re-arm themselves here) until the error message
        // window lapses. Never a permanent trap: hide eventually
        // runs — the window is bounded (45s).
        setTimeout(hide, hideNotBefore - Date.now() + 50);
        return;
      }
      done = true;
      s.classList.add("hide");
      s.style.opacity = "0";   // inline fallback: hides even without style.css
      setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 400);
    }
    // IN-6: a boot-error message holds the screen for up to 45s, and
    // not every uncaught error is fatal: one tap lets the user through.
    s.addEventListener("click", function () {
      if (!hideNotBefore) return;
      hideNotBefore = 0;
      hide();
    });
    if (document.readyState === "complete") setTimeout(hide, 700);
    else window.addEventListener("load", function () { setTimeout(hide, 700); });
    setTimeout(hide, 10000);   // fail-safe: never a stuck splash
  })();
  </script>

<script>
/* orOS update broker — inline in index.html so it is ALWAYS fresh
   (index.html is served network-first by the service worker; the
   cached shell.js can never be trusted to manage its own update).
   AUTO-UPDATE: the worker calls skipWaiting() on install,
   so the lifecycle is: install -> activate -> controllerchange ->
   reload. No user gate, no toast — the version toast in shell.js
   is the sole update confirmation. Byte-check forced on every
   load + hourly re-check for long-lived sessions. */
(function () {
  "use strict";
  if (!("serviceWorker" in navigator)) return;

  // D1-4: resilient registration. A single silent register() rejection
  // (bad worker state, Android WebView quirks) leaves the PWA with no
  // controller → no offline, forever, invisibly. Retry with backoff;
  // after final failure, SAY so in the console.
  var SW_RETRY_MAX  = 3;
  var SW_RETRY_WAIT = 4000;
  var swAttempts = 0;

  function watchRegistration(r) {
    // Force a byte-check on EVERY load — never rely on browser mood.
    r.update().catch(function () {});
    // Gentle hourly re-check for long-lived sessions
    setInterval(function () { r.update().catch(function () {}); }, 60 * 60 * 1000);
  }

  function tryRegister() {
    navigator.serviceWorker.register("sw.js").then(function (r) {
      watchRegistration(r);
    }).catch(function (err) {
      swAttempts++;
      if (swAttempts < SW_RETRY_MAX) {
        setTimeout(tryRegister, SW_RETRY_WAIT);
      } else {
        console.warn("[SW] registration failed after retries:", err);
      }
    });
  }

  tryRegister();

  // SW-2: the reload still needs no click, but it no longer lands in
  // the middle of work. A new worker took over → reload at the first
  // SAFE moment: desktop showing (no app open, menu and dialogs
  // closed), nothing playing, nothing ringing, and no unsynced change
  // that the engine is about to push (that one would also raise the
  // browser's "Leave site?" prompt). Everything is read defensively:
  // this broker must work against any cached shell.js.
  var reloading = false;
  var waitTimer = null;

  function safeToReload() {
    try {
      // SW-3: back from Dropbox with ?code= — sync.js is exchanging a
      // ONE-SHOT code. A reload now would replay it and the sign-in
      // would fail. sync.js cleans the URL when the exchange settles.
      if (/[?&]code=/.test(window.location.search) &&
          sessionStorage.getItem("oros-pkce-verifier")) return false;
      var run = document.getElementById("oros-running");
      if (run && run.classList.contains("active")) return false;      // an app is open
      var menu = document.getElementById("app-menu");
      if (menu && menu.classList.contains("open")) return false;      // user is in the menu
      if (document.querySelector("dialog[open]")) return false;        // a dialog is open
      if (document.getElementById("sc-info-overlay")) return false;    // Info modal
      if (document.getElementById("alarm-toast")) return false;        // an alarm is ringing
      var h = window.__orosRadioHost;
      if (h && h.audio && !h.audio.paused) return false;               // radio is playing
      var ph = window.__orosPodcastsHost;
      if (ph && ph.audio && !ph.audio.paused) return false;            // a podcast is playing
      var sy = window.orosSync;
      // Dirty blocks only while the engine can actually clear it
      // (connected + unlocked + online); otherwise waiting is pointless.
      if (sy && typeof sy.isDirty === "function" && sy.isDirty() &&
          navigator.onLine &&
          typeof sy.isConnected === "function" && sy.isConnected() &&
          typeof sy.hasPassphrase === "function" && sy.hasPassphrase()) return false;
    } catch (e) { /* unknown shell state — do not block the update */ }
    return true;
  }

  function reloadWhenSafe() {
    if (reloading) return;
    if (!safeToReload()) {
      // Poll ONLY while an update is waiting (no idle timer otherwise).
      if (!waitTimer) waitTimer = setInterval(reloadWhenSafe, 3000);
      return;
    }
    reloading = true;
    if (waitTimer) { clearInterval(waitTimer); waitTimer = null; }
    // The splash script consumes this flag: no second splash after
    // an update reload.
    try { sessionStorage.setItem("oros-skip-splash", "1"); } catch (e) {}
    window.location.reload();
  }

  // SW-4: sw.js claims its clients on activation, so the very FIRST
  // install also fires controllerchange — and reloaded a page that
  // had just loaded everything fresh from the network (a new user's
  // first impression: the screen restarting under their hands).
  // "First install" = no controller AND no active worker at load; a
  // hard refresh (no controller, but a worker exists) is not one.
  var skipFirstClaim = false;
  if (!navigator.serviceWorker.controller) {
    navigator.serviceWorker.getRegistration().then(function (r) {
      if (!r || !r.active) skipFirstClaim = true;
    }).catch(function () {});
  }

  // SW-5: while an update waits for a safe moment, the page runs the
  // OLD shell under the NEW worker — an app opened now would be the
  // new version inside the old shell. Close that window: the instant
  // the running app closes, check (no waiting for the 3s poll).
  var runWatch = null;
  function watchRunning() {
    if (runWatch || typeof MutationObserver !== "function") return;
    var run = document.getElementById("oros-running");
    if (!run) return;
    runWatch = new MutationObserver(function () { reloadWhenSafe(); });
    runWatch.observe(run, { attributes: true, attributeFilter: ["class"] });
  }

  navigator.serviceWorker.addEventListener("controllerchange", function () {
    if (skipFirstClaim) { skipFirstClaim = false; return; }
    reloadWhenSafe();
    if (!reloading) watchRunning();
  });
})();
</script>
