  <!-- ================= BOOT SPLASH =================
       Static in HTML: visible BEFORE any JS parses, styled inline
       (FOUC-proof). TIMER-based, not lifecycle-based: hides on
       load + 700ms (fail-safe 10s) — it does NOT wait for the SW
       update check. The broker's update-path reload bypasses this
       splash entirely via the "oros-skip-splash" flag. Survives
       even if shell.js fails to load (see onerror below). -->
        <div id="oro-splash" role="status"
       style="position:fixed;inset:0;z-index:9999;background:#14120d;color:#e8eaf0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-family:system-ui,sans-serif;font-size:15px;line-height:1.6;transition:opacity .4s;">
    <span id="oro-splash-text">Welcome to orOS. Searching for updates, please wait…</span>
  </div>

  <script>
  (function () {
    "use strict";
    var s = document.getElementById("oro-splash");
    var txt = document.getElementById("oro-splash-text");
    if (!s) return;

    // Mobile visibility: a failed boot must not look like waiting —
    // the splash is the only surface that exists before shell.js.
    window.addEventListener("error", function (ev) {
      if (done) return;
      // IP1: a throw INSIDE this handler (blocked localStorage →
      // SecurityError in hardened browsers) fires ANOTHER window
      // error event → this listener again → recursion. Diagnostics
      // must never crash the diagnostics.
      var lang = "en";
      try { lang = localStorage.getItem("oros-lang") || "en"; } catch (e0) {}
      if (txt) {
        txt.textContent = (lang === "el")
          ? "Σφάλμα εκκίνησης: " + (ev.message || "άγνωστο") + " — δοκίμασε hard refresh."
          : "Startup error: " + (ev.message || "unknown") + " — try a hard refresh.";
        txt.style.color = "#e06c75";
        // IP2: keep the message readable. Without this, the load+700ms
        // hide() erases it almost instantly — and the desktop behind
        // the splash never rendered (that's WHY the error exists).
        // hideNotBefore is hoisted (var) with `done` below — safe.
        hideNotBefore = Date.now() + 45000;
      }
    });
    // (β) update-triggered reload: NO second splash — the user was
    // already looking at this same screen. The broker sets the flag
    // right before reloading (controllerchange); consume it here.
    try {
      if (sessionStorage.getItem("oros-skip-splash") === "1") {
        sessionStorage.removeItem("oros-skip-splash");
        if (s.parentNode) s.parentNode.removeChild(s);
        return;
      }
    } catch (e) {}
    // Greek from the very first frame if it's the stored language
    // (translations.js loads too late to matter for the splash)
    try {
      if (localStorage.getItem("oros-lang") === "el" && txt) {
        txt.textContent = "Καλώς ήρθατε στο orOS. Γίνεται αναζήτηση ενημερώσεων, παρακαλώ περιμένετε…";
      }
    } catch (e) {}

    var done = false;
    var hideNotBefore = 0;    // IP2: boot-error message visibility window
    function hide() {
      if (done) return;
      if (Date.now() < hideNotBefore) {
        // IP2: defer every hide attempt (load+700ms AND the 10s
        // fail-safe re-arm themselves here) until the error message
        // window lapses. Never a permanent trap: hide eventually
        // runs — the window is bounded (45s).
        setTimeout(hide, hideNotBefore - Date.now() + 50);
        return;
      }
      done = true;
      s.classList.add("hide");
      s.style.opacity = "0";   // inline fallback: hides even without style.css
      setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 400);
    }
    if (document.readyState === "complete") setTimeout(hide, 700);
    else window.addEventListener("load", function () { setTimeout(hide, 700); });
    setTimeout(hide, 10000);   // fail-safe: never a stuck splash
  })();
  </script>

<script>
/* orOS update broker — inline in index.html so it is ALWAYS fresh
   (index.html is served network-first by the service worker; the
   cached shell.js can never be trusted to manage its own update).
   AUTO-UPDATE: the worker calls skipWaiting() on install,
   so the lifecycle is: install -> activate -> controllerchange ->
   reload. No user gate, no toast — the version toast in shell.js
   is the sole update confirmation. Byte-check forced on every
   load + hourly re-check for long-lived sessions. */
(function () {
  "use strict";
  if (!("serviceWorker" in navigator)) return;

  // D1-4: resilient registration. A single silent register() rejection
  // (bad worker state, Android WebView quirks) leaves the PWA with no
  // controller → no offline, forever, invisibly. Retry with backoff;
  // after final failure, SAY so in the console.
  var SW_RETRY_MAX  = 3;
  var SW_RETRY_WAIT = 4000;
  var swAttempts = 0;

  function watchRegistration(r) {
    // Force a byte-check on EVERY load — never rely on browser mood.
    r.update().catch(function () {});
    // Gentle hourly re-check for long-lived sessions
    setInterval(function () { r.update().catch(function () {}); }, 60 * 60 * 1000);
  }

  function tryRegister() {
    navigator.serviceWorker.register("sw.js").then(function (r) {
      watchRegistration(r);
    }).catch(function (err) {
      swAttempts++;
      if (swAttempts < SW_RETRY_MAX) {
        setTimeout(tryRegister, SW_RETRY_WAIT);
      } else {
        console.warn("[SW] registration failed after retries:", err);
      }
    });
  }

  tryRegister();

  var reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", function () {
    if (reloading) return;
    reloading = true;
    // BUG (found during D1-4 review): the splash script CONSUMES
    // "oros-skip-splash" but NOTHING ever wrote it — every silent-
    // update reload re-showed the 10s splash screen. This is the
    // missing writer, exactly where the consumer expects it.
    try { sessionStorage.setItem("oros-skip-splash", "1"); } catch (e) {}
    window.location.reload();
  });
})();
</script>
