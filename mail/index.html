<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-6YWSX69v2A4manzKRSI8LDG+vtWi/bPbWi3pTQGw1ZY='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=mail" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>Mail · orOS</title>

  <link rel="stylesheet" href="mail.css?v=4.99.00">

</head>
<body data-view="list">

  <header id="toolbar">
    <button type="button" class="icon-btn" id="nav-btn"></button>
    <div id="bar-title" class="bar-title"></div>
    <span class="spacer"></span>
    <button type="button" class="icon-btn" id="compose-btn"></button>
    <button type="button" class="icon-btn" id="refresh-btn"></button>
    <button type="button" class="icon-btn" id="settings-btn"></button>
  </header>

  <div id="net" class="net" role="status" hidden></div>

  <main id="app">
    <!-- Accounts + folders -->
    <nav id="side" aria-label="Folders">
      <div id="accts"></div>
      <button type="button" class="side-add" id="add-acct"></button>
    </nav>
    <div id="scrim" hidden></div>

    <!-- Message list -->
    <section id="listp" aria-labelledby="list-title">
      <div class="list-head">
        <h2 id="list-title"></h2>
        <span id="list-count" class="count"></span>
        <button type="button" class="link-btn" id="sel-btn"></button>
        <button type="button" class="icon-btn small" id="srch-btn"></button>
      </div>
      <div id="srch-bar" class="srch-bar" role="search" hidden>
        <input type="search" id="srch-q" maxlength="200" autocomplete="off" spellcheck="false" enterkeyhint="search">
        <select id="srch-where"></select>
        <button type="button" class="icon-btn small" id="srch-x"></button>
      </div>
      <div id="sel-bar" class="sel-bar" hidden></div>
      <ul id="list" role="list"></ul>
      <div id="list-foot" class="list-foot"></div>
    </section>

    <!-- Reading pane -->
    <section id="read" aria-live="polite">
      <div id="read-empty" class="read-empty"></div>
      <article id="msg" hidden>
        <header class="msg-head">
          <h1 id="msg-subj" class="msg-subj"></h1>
          <div class="msg-from">
            <span id="msg-av" class="av" aria-hidden="true"></span>
            <div class="msg-who">
              <div id="msg-sender" class="msg-sender"></div>
              <div id="msg-to" class="msg-to"></div>
            </div>
            <time id="msg-date" class="msg-date"></time>
          </div>
          <div id="msg-acts" class="msg-acts" hidden></div>
        </header>
        <div id="msg-bars"></div>
        <div id="msg-body" class="msg-body"></div>
        <div id="msg-atts" class="msg-atts" hidden></div>
      </article>
    </section>

    <!-- First run -->
    <section id="welcome" hidden>
      <div class="wel-box">
        <div id="wel-icon" class="wel-icon" aria-hidden="true"></div>
        <h1 data-i18n="wel.title">Your e-mail, inside orOS</h1>
        <p data-i18n="wel.text">Add an account to read your mail here, also offline.</p>
        <button type="button" class="dlg-btn primary" id="wel-add" data-i18n="acct.add">Add account</button>
      </div>
    </section>
  </main>

  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="../i18n.js?v=4.99.00" data-app="mail"></script>
  <script src="mime.js?v=4.99.00"></script>
  <script src="sanitize.js?v=4.99.00"></script>
  <script src="trust.js?v=4.99.00"></script>
  <script src="rules.js?v=4.99.00"></script>
  <script src="compose.js?v=4.99.00"></script>
  <script src="rich.js?v=4.99.00"></script>
  <script src="threads.js?v=4.99.00"></script>
  <script src="outbox.js?v=4.99.00"></script>
  <script src="people.js?v=4.99.00"></script>
  <script src="sieve.js?v=4.99.00"></script>
  <script src="snooze.js?v=4.99.00"></script>
  <script src="unsub.js?v=4.99.00"></script>
  <script src="pgpmime.js?v=4.99.00"></script>
  <script src="pgp.js?v=4.99.00"></script>
  <script src="mail.js?v=4.99.00"></script>

</body>
</html>
