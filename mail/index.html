<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mail</title>
  <!-- Inline CSS bridge — all styling lives in mail.css -->
  <link rel="stylesheet" href="mail.css">
  <!-- orOS theme variables are inherited from parent via CSS vars (--accent, etc.) -->
</head>
<body>
  <!-- Header: app title | folder-select | accounts button | compose button -->
  <header id="mail-header"></header>

  <!-- Empty state: no account yet -->
  <div id="mail-empty" class="ma-empty">
    <div class="me-content">
      <span class="me-icon">✉️</span>
      <div class="me-text">
        <p>No account configured</p>
        <p>Add your first account to start receiving emails</p>
      </div>
    </div>
  </div>

  <!-- Main layout: folders | list | reading pane -->
  <main id="mail-layout" class="ma-layout">
    <nav id="mail-folders" class="ma-folders"></nav>
    <section id="mail-list" class="ma-list"></section>
    <aside id="mail-reading" class="ma-reading"></aside>
  </main>

  <!-- App-local toast — uses --accent, --surface, --text vars from parent -->
  <div id="mail-toast" class="mail-toast" aria-live="polite"></div>

  <!-- Scripts -->
  <script src="mail.js"></script>
</body>
</html>
