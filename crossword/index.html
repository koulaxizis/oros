<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Crossword · orOS</title>

  <link rel="stylesheet" href="crossword.css?v=0.57.03">

</head>
<body>

  <!-- Toolbar: one line on a wide screen, two scrolling strips on a phone -->
  <header id="toolbar">
    <div class="tb-row" id="tb-a">
      <div class="seg" id="lang-seg" role="group">
        <button type="button" class="seg-btn" data-lang="en" data-i18n="lang.en">EN</button>
        <button type="button" class="seg-btn" data-lang="el" data-i18n="lang.el">ΕΛ</button>
      </div>
      <div class="seg" id="mode-seg" role="group">
        <button type="button" class="seg-btn" data-mode="d" data-i18n="mode.d">Daily</button>
        <button type="button" class="seg-btn" data-mode="f" data-i18n="mode.f">Free</button>
      </div>
      <div class="seg" id="size-seg" role="group">
        <button type="button" class="seg-btn" data-size="e">9×9</button>
        <button type="button" class="seg-btn" data-size="m">13×13</button>
        <button type="button" class="seg-btn" data-size="h">17×17</button>
      </div>
    </div>
    <div class="tb-row" id="tb-b">
      <button type="button" class="txt-btn" id="theme-btn"></button>
      <span class="spacer"></span>
      <button type="button" class="icon-btn" id="check-btn"></button>
      <button type="button" class="icon-btn" id="new-btn"></button>
      <button type="button" class="icon-btn" id="stats-btn"></button>
    </div>
  </header>

  <!-- Status: which puzzle, words placed, time -->
  <div id="status">
    <span id="info"></span>
    <span id="count"></span>
    <span id="clock"><span id="clock-ico"></span><strong id="time">0:00</strong></span>
  </div>

  <main id="play">
    <div id="grid-wrap">
      <div id="grid" role="grid" tabindex="0"></div>
    </div>
    <aside id="words">
      <p id="words-intro"></p>
      <div id="word-groups"></div>
    </aside>
  </main>

  <div id="kb" role="group"></div>

  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <!-- Word lists are shared with Word Search (precached there) -->
  <script src="../wordsearch/words-en.js?v=0.57.03"></script>
  <script src="../wordsearch/words-el.js?v=0.57.03"></script>
  <script src="crossword.js?v=0.57.03"></script>

</body>
</html>
