<!DOCTYPE html>
<html lang="en" data-skin="oros" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Files · orOS</title>
  <link rel="stylesheet" href="files.css?v=0.35.17">
</head>
<body>

  <!-- Toolbar: up-navigation | breadcrumbs | actions -->
  <header id="bar">
    <button id="up" class="tool" data-i18n-title="nav.up" title="Up"
            aria-label="Go to parent folder">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>

    <nav id="crumbs" aria-label="Path"></nav>

    <span class="spacer"></span>

    <div id="actions">
      <button id="new-folder" class="tool" data-i18n-title="act.newFolder" title="New folder"
              aria-label="New folder">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      </button>
      <button id="new-file" class="tool" data-i18n-title="act.newFile" title="New file"
              aria-label="New file">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      </button>
      <button id="rename" class="tool" data-i18n-title="act.rename" title="Rename"
              aria-label="Rename" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
      </button>
      <button id="delete" class="tool" data-i18n-title="act.delete" title="Delete"
              aria-label="Delete" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
    </div>
  </header>

  <!-- Split view: tree (left) + entries (right) -->
  <main id="split">

    <aside id="tree-wrap" aria-label="Folders">
      <div id="tree-root"></div>
    </aside>

    <section id="list-wrap">
      <ul id="entries"></ul>
      <div id="empty" hidden>
        <span data-i18n="empty.title">This folder is empty</span>
        <small data-i18n="empty.hint">Create a file or folder with the buttons above.</small>
      </div>
    </section>

  </main>

  <!-- Status bar -->
  <footer id="status">
    <span id="st-count"></span>
    <span class="spacer"></span>
    <span id="st-path"></span>
  </footer>

  <!-- Create / rename dialog (shared: mode set by JS) -->
  <dialog id="dlg-name">
    <form method="dialog" id="name-form" autocomplete="off">
      <h3 id="name-title" data-i18n="dlg.createFolder">New folder</h3>

      <label data-i18n="dlg.nameLabel">Name</label>
      <input id="name-input" type="text" required maxlength="255"
             autocomplete="off" spellcheck="false">

      <p class="hint" id="name-error" hidden></p>

      <menu>
        <button type="button" id="name-cancel"
                data-i18n="dlg.cancel">Cancel</button>
        <span class="spacer"></span>
        <button type="submit" data-i18n="dlg.ok">Create</button>
      </menu>
    </form>
  </dialog>

  <!-- Delete confirmation dialog (folder deletion warns about content) -->
  <dialog id="dlg-delete">
    <form method="dialog" id="delete-form" autocomplete="off">
      <h3 id="delete-title" data-i18n="dlg.deleteTitle">Delete</h3>
      <p id="delete-msg"></p>
      <menu>
        <button type="button" id="delete-cancel"
                data-i18n="dlg.cancel">Cancel</button>
        <span class="spacer"></span>
        <button type="submit" class="danger"
                data-i18n="dlg.deleteConfirm">Delete</button>
      </menu>
    </form>
  </dialog>

  <!-- Feedback toast -->
  <div id="toast" role="status"></div>

  <script src="files.js?v=0.35.17"></script>
</body>
</html>
