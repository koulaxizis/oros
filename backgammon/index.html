<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-Kj8TkLzvP6wbZl9tmlihXjMUemyKYlzBE4oCDzeM9E8='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=backgammon" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Backgammon · orOS</title>

  <link rel="stylesheet" href="backgammon.css?v=5.03.00">

</head>
<body>

  <!-- Toolbar: one line on a wide screen, two scrolling strips on a phone -->
  <header id="toolbar">
    <div class="tb-row" id="tb-a">
      <div class="seg" id="mode-seg" role="group">
        <button type="button" class="seg-btn" data-mode="ai" data-i18n="mode.ai">vs Computer</button>
        <button type="button" class="seg-btn" data-mode="duo" data-i18n="mode.duo">2 players</button>
      </div>
      <div class="seg" id="level-seg" role="group">
        <button type="button" class="seg-btn" data-level="e" data-i18n="level.e">Easy</button>
        <button type="button" class="seg-btn" data-level="m" data-i18n="level.m">Medium</button>
        <button type="button" class="seg-btn" data-level="h" data-i18n="level.h">Hard</button>
      </div>
    </div>
    <div class="tb-row" id="tb-b">
      <span class="spacer"></span>
      <button type="button" class="icon-btn" id="new-btn"></button>
      <button type="button" class="icon-btn" id="stats-btn"></button>
      <button type="button" class="icon-btn" id="net-btn"></button>
      <button type="button" class="icon-btn" id="sfx-btn" aria-pressed="false"></button>
    </div>
  </header>

  <!-- Status: the two sides with pip counts + whose turn -->
  <div id="status">
    <span class="side" id="side0"><i class="mark m0" aria-hidden="true"></i><span id="name0"></span><strong id="pips0"></strong></span>
    <span id="turn" aria-live="polite"></span>
    <span class="side" id="side1"><strong id="pips1"></strong><span id="name1"></span><i class="mark m1" aria-hidden="true"></i></span>
  </div>

  <main id="board-wrap">
    <svg id="board" role="application" tabindex="0" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
  </main>

  <!-- Turn actions: Roll · Undo · Done -->
  <div id="actions">
    <button type="button" class="act-btn" id="roll-btn"></button>
    <button type="button" class="act-btn" id="undo-btn"></button>
    <button type="button" class="act-btn" id="done-btn"></button>
  </div>

  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="../i18n.js?v=5.03.00" data-app="backgammon,remote-play"></script>
  <script src="../qr/qr-encode.js?v=5.03.00"></script>
  <script src="../remote-link.js?v=5.03.00"></script>
  <script src="../remote-play.js?v=5.03.00"></script>
  <script src="backgammon.js?v=5.03.00"></script>

</body>
</html>
