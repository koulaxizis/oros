<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-//+IXSEM1rR72mJ3F8ucY5vPIE3lVcLjJwojJWgI8e4=' https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=spreadsheet" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spreadsheet — orOS</title>
<link rel="stylesheet" href="spreadsheet.css?v=5.02.00">
</head>
<body>
<div id="app">
  <header id="shead">
    <div id="doc-title" data-i18n="title">Spreadsheet</div>
    <div id="fx-wrap">
      <span id="fx-ref" aria-live="polite">A1</span>
      <button id="fx-mark" type="button" title="Functions">ƒx</button>
      <input id="fx-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
  </header>
  <div id="sbar" role="toolbar" aria-label="Formatting">
    <button id="tb-undo" class="tbtn" type="button" title="Undo (Ctrl+Z)"></button>
    <button id="tb-redo" class="tbtn" type="button" title="Redo (Ctrl+Y)"></button>
    <span class="tsep"></span>
    <button id="tb-copy" class="tbtn" type="button" title="Copy (Ctrl+C)"></button>
    <button id="tb-cut" class="tbtn" type="button" title="Cut (Ctrl+X)"></button>
    <button id="tb-paste" class="tbtn" type="button" title="Paste (Ctrl+V)"></button>
    <span class="tsep"></span>
    <button id="tb-bold" class="tbtn tgl" type="button" title="Bold (Ctrl+B)"></button>
    <button id="tb-ital" class="tbtn tgl" type="button" title="Italic (Ctrl+I)"></button>
    <button id="tb-und" class="tbtn tgl" type="button" title="Underline (Ctrl+U)"></button>
    <span class="tsep"></span>
    <button id="tb-al-l" class="tbtn tgl" type="button" title="Align left"></button>
    <button id="tb-al-c" class="tbtn tgl" type="button" title="Align center"></button>
    <button id="tb-al-r" class="tbtn tgl" type="button" title="Align right"></button>
    <span class="tsep"></span>
    <select id="tb-nf" class="tsel" title="Number format">
      <option value="gen">auto</option>
      <option value="0">123</option>
      <option value="2">123.00</option>
      <option value="%">%</option>
      <option value="€">€</option>
      <option value="d">date</option>
    </select>
    <button id="tb-col" class="tbtn" type="button" title="Text color"></button>
    <button id="tb-clr" class="tbtn" type="button" title="Clear formatting"></button>
    <button id="tb-fmt" class="tbtn" type="button" title="Cell format" aria-haspopup="menu"></button>
    <span class="tsep"></span>
    <button id="tb-sort-a" class="tbtn" type="button" title="Sort A to Z"></button>
    <button id="tb-sort-z" class="tbtn" type="button" title="Sort Z to A"></button>
    <button id="tb-filter" class="tbtn tgl" type="button" title="Filter"></button>
    <button id="tb-chart" class="tbtn" type="button" title="Insert chart"></button>
    <button id="tb-more" class="tbtn" type="button" title="Rows, columns, freeze" aria-haspopup="menu"></button>
  </div>
  <div id="swatches" hidden></div>
  <main id="grid-wrap" tabindex="-1">
    <table id="grid"></table>
  </main>
  <nav id="stabs" aria-label="Sheets"></nav>
  <footer id="sstat">
    <span id="st-sel">A1</span>
    <span id="st-note"></span>
    <span id="st-flt" hidden><span id="st-flt-t"></span><button id="st-flt-x" type="button" title="Remove filter"></button></span>
    <span id="sstat-actions">
      <button id="btn-csv-imp" class="sbtn" type="button" title="Import CSV" aria-label="Import CSV"></button>
      <button id="btn-csv-exp" class="sbtn" type="button" title="Export CSV" aria-label="Export CSV"></button>
    </span>
  </footer>
</div>
<script src="../i18n.js?v=5.02.00" data-app="spreadsheet,google-import,links"></script>
<script src="../links/core.js?v=5.02.00"></script>
<script src="../links/sheets.js?v=5.02.00"></script>
<script src="platforms.js?v=5.02.00"></script>
<script src="functions.js?v=5.02.00"></script>
<script src="sheetkit.js?v=5.02.00"></script>
<script src="sheetimport.js?v=5.02.00"></script>
<script src="../bundle.js?v=5.02.00"></script>
<script src="../google-import.js?v=5.02.00"></script>
<script src="../files/gmedia.js?v=5.02.00"></script>
<script src="spreadsheet.js?v=5.02.00"></script>
</body>
</html>
