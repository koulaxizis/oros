<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-gulo6A70on4+7gQMAHg1K4GryraeQS6G0WB8dvbzXtg='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=fieldwarden" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fieldwarden · orOS</title>

  <link rel="stylesheet" href="../fonts.css?v=6.04.01">
  <link rel="stylesheet" href="fieldwarden.css?v=6.04.01">
  <link rel="stylesheet" href="../gamekit/layout.css?v=6.04.01">

</head>
<body>

  <!-- Toolbar: one line on a wide screen, two strips on a phone -->
  <header id="toolbar">
    <h1 class="sr-only" data-i18n="app.name">Fieldwarden</h1>
    <div class="tb-row" id="tb-a">
      <button type="button" class="icon-btn" id="new-btn"></button>
      <button type="button" class="icon-btn" id="threat-btn"></button>
      <button type="button" class="icon-btn" id="fast-btn"></button>
      <span class="spacer"></span>
      <button type="button" class="end-btn" id="end-btn" data-i18n="btn.end">End turn</button>
    </div>
    <div class="tb-row" id="tb-b">
      <span class="spacer"></span>
      <button type="button" class="icon-btn" id="undo-btn"></button>
      <button type="button" class="icon-btn" id="reset-btn"></button>
      <button type="button" class="icon-btn" id="rewind-btn" hidden></button>
      <button type="button" class="icon-btn" id="daily-btn" hidden></button>
      <button type="button" class="icon-btn" id="pz-btn"></button>
      <button type="button" class="icon-btn" id="stats-btn"></button>
      <button type="button" class="icon-btn" id="sfx-btn"></button>
    </div>
  </header>

  <!-- Status: turn, weather now and next, the harvest so far against the quota, coins -->
  <div id="status">
    <span class="stat" id="s-turn"><span class="ic"></span><span class="v"></span></span>
    <span class="stat" id="s-wx"><span class="ic"></span><span class="v"></span><span class="nx"></span></span>
    <span class="stat crop" id="s-crop"><span class="ic"></span><span class="v"></span></span>
    <span class="stat gold" id="s-coins"><span class="ic"></span><span class="v"></span></span>
  </div>
  <div id="msg" aria-hidden="true"></div>

  <main id="scene">
    <canvas id="view" tabindex="0" role="application"></canvas>
  </main>

  <!-- The three folk (tap one to choose it), or the market between seasons -->
  <nav id="acts"></nav>

  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="../i18n.js?v=6.04.01" data-app="fieldwarden"></script>

  <script src="../gamekit/haptics.js?v=6.04.01"></script>
  <script src="../gamekit/daily.js?v=6.04.01"></script>
  <script src="data.js?v=6.04.01"></script>
  <script src="engine.js?v=6.04.01"></script>
  <script src="fieldwarden.js?v=6.04.01"></script>

</body>
</html>
