name = "oros-mail-relay"
main = "worker.js"
compatibility_date = "2025-06-01"

# Studio Remote's meeting rooms (remote.js). In memory only; SQLite-backed
# class because that is what the free plan offers.
[[durable_objects.bindings]]
name = "REMOTE"
class_name = "RemoteRoom"

[[migrations]]
tag = "remote-v1"
new_sqlite_classes = ["RemoteRoom"]

# Newsletter's public sign-up forms and one-click unsubscribes
# (newsletter.js). Declared here: a binding added only in the dashboard is
# replaced on the next deploy from main.
[[d1_databases]]
binding = "NL_DB"
database_name = "oros-newsletter"
database_id = "ad575aa3-9d64-4506-bf69-c1b93aa45583"

# Send to someone links with an expiry (share.js): encrypted pieces
# only. Its own database because a Free D1 database holds 500 MB and
# NL_DB carries Newsletter and the CRM form. Without the binding the
# "shr" op and /s/ answer 503 "nostore".
[[d1_databases]]
binding = "SHR_DB"
database_name = "oros-share"
database_id = "bb524951-d4d8-44b3-a5f0-bb34f14b8c6b"

# Deletes expired share links and unfinished uploads (share.js purgeShares).
[triggers]
crons = ["17 * * * *"]

[vars]
# Comma-separated list of pages allowed to call the relay.
ALLOWED_ORIGINS = "https://useoros.online"

# Preview versions (Cloudflare builds one per pull request). They carry
# no data or bindings, so the same origin list is safe.
[previews.vars]
ALLOWED_ORIGINS = "https://useoros.online"
