<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-lT7lQo8IZQcHRt2fMDLkvQwgLLJ8BTf6kb3NH67IMzM='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=familytree" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Family Tree · orOS</title>

  <link rel="stylesheet" href="familytree.css?v=4.99.00">

</head>
<body>

  <header id="toolbar">
    <button type="button" class="txt-btn" id="tree-btn" aria-haspopup="dialog">
      <span id="tree-name" class="tree-name"></span>
    </button>
    <div class="seg" id="view-seg" role="group">
      <button type="button" data-view="hourglass" aria-pressed="true"></button>
      <button type="button" data-view="ancestors" aria-pressed="false"></button>
      <button type="button" data-view="descendants" aria-pressed="false"></button>
    </div>
    <span class="spacer"></span>
    <button type="button" class="icon-btn" id="people-btn"></button>
    <button type="button" class="icon-btn" id="fit-btn"></button>
    <button type="button" class="icon-btn" id="more-btn" aria-haspopup="menu"></button>
  </header>

  <main id="main">
    <section id="stage" aria-label="Family tree">
      <svg id="svg" role="img" aria-hidden="true"><g id="vp"></g></svg>
      <div id="empty" class="empty" hidden>
        <p id="empty-text"></p>
        <div class="empty-actions">
          <button type="button" class="dlg-btn primary" id="empty-add"></button>
          <button type="button" class="dlg-btn" id="empty-contacts"></button>
          <button type="button" class="dlg-btn" id="empty-import"></button>
        </div>
      </div>
      <div class="zoom" id="zoom">
        <button type="button" class="icon-btn" id="zoom-in"></button>
        <button type="button" class="icon-btn" id="zoom-out"></button>
      </div>
    </section>
    <aside id="side" hidden></aside>
  </main>

  <div id="print-host" aria-hidden="true"></div>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="../i18n.js?v=4.99.00" data-app="familytree"></script>
  <script src="ft-core.js?v=4.99.00"></script>
  <script src="../importkit.js?v=4.99.00"></script>
  <script src="gramps.js?v=4.99.00"></script>
  <script src="../bundle.js?v=4.99.00"></script>
  <script src="familytree.js?v=4.99.00"></script>

</body>
</html>
