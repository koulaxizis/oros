<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-X0ze/VxTUF0t/ArF9+UVr4u4zDmW3k7ICAJQX8/wfmc=' https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=writer" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Writer</title>
  <link rel="stylesheet" href="writer.css?v=5.02.00">
</head>
<body>
  <div id="w-app" class="w-app">

    <!-- TAB BAR (JS renders tabs + new-tab button) -->
    <div class="tab-bar" id="tab-bar" role="tablist"></div>

    <!-- TOOLBAR (buttons EMPTY per R9 — JS injects SVG icons) -->
    <div class="main-toolbar" id="main-toolbar">
      <div class="toolbar-group toolbar-left">
        <button type="button" class="tb-btn" id="btn-undo" data-i18n-title="tt.undo"></button>
        <button type="button" class="tb-btn" id="btn-redo" data-i18n-title="tt.redo"></button>
        <span class="tb-sep"></span>
        <select id="styles-select" class="styles-select" data-i18n-title="tt.styles">
          <option value="p" data-i18n="style.p"></option>
          <option value="h1" data-i18n="style.h1"></option>
          <option value="h2" data-i18n="style.h2"></option>
          <option value="h3" data-i18n="style.h3"></option>
          <option value="h4" data-i18n="style.h4"></option>
          <option value="blockquote" data-i18n="style.quote"></option>
          <option value="pre" data-i18n="style.code"></option>
        </select>
        <button type="button" class="tb-btn" id="btn-insert" data-i18n-title="tt.insert" aria-haspopup="menu"></button>
        <button type="button" class="tb-btn" id="btn-view" data-i18n-title="tt.view" aria-haspopup="menu"></button>
        <button type="button" class="tb-btn" id="btn-review" data-i18n-title="tt.review" aria-haspopup="menu"></button>
      </div>

      <div class="toolbar-group toolbar-center">
        <button type="button" class="tb-btn" id="btn-bold" data-i18n-title="tt.bold"></button>
        <button type="button" class="tb-btn" id="btn-italic" data-i18n-title="tt.italic"></button>
        <button type="button" class="tb-btn" id="btn-underline" data-i18n-title="tt.underline"></button>
        <button type="button" class="tb-btn" id="btn-strike" data-i18n-title="tt.strike"></button>
        <span class="tb-sep"></span>
        <button type="button" class="tb-btn" id="btn-indent" data-i18n-title="tt.indent"></button>
        <button type="button" class="tb-btn" id="btn-outdent" data-i18n-title="tt.outdent"></button>
        <span class="tb-sep"></span>
        <button type="button" class="tb-btn" id="btn-bullets" data-i18n-title="tt.bullets"></button>
        <button type="button" class="tb-btn" id="btn-numbers" data-i18n-title="tt.numbers"></button>
        <span class="tb-sep"></span>
        <button type="button" class="tb-btn" id="btn-align-left" data-i18n-title="tt.alignLeft"></button>
        <button type="button" class="tb-btn" id="btn-align-center" data-i18n-title="tt.alignCenter"></button>
        <button type="button" class="tb-btn" id="btn-align-right" data-i18n-title="tt.alignRight"></button>
        <button type="button" class="tb-btn" id="btn-align-justify" data-i18n-title="tt.alignJustify"></button>
      </div>

      <div class="toolbar-group toolbar-right">
        <button type="button" class="tb-btn" id="btn-hr" data-i18n-title="tt.hr"></button>
        <button type="button" class="tb-btn" id="btn-page-break" data-i18n-title="tt.pageBreak"></button>
        <span class="tb-sep"></span>
        <button type="button" class="tb-btn" id="btn-find" data-i18n-title="tt.find"></button>
        <button type="button" class="tb-btn" id="btn-chars" data-i18n-title="tt.chars"></button>
        <button type="button" class="tb-btn" id="btn-lorem" data-i18n-title="tt.lorem"></button>
        <span class="tb-sep"></span>
        <button type="button" class="tb-btn" id="btn-footnotes" data-i18n-title="tt.footnotes"></button>
        <button type="button" class="tb-btn" id="btn-comments" data-i18n-title="tt.comments"></button>
        <span class="tb-sep"></span>
        <button type="button" class="tb-btn" id="btn-toc" data-i18n-title="tt.toc"></button>
        <button type="button" class="tb-btn" id="btn-meta" data-i18n-title="tt.meta"></button>
        <button type="button" class="tb-btn" id="btn-page" data-i18n-title="tt.page"></button>
        <span class="tb-sep"></span>
        <button type="button" class="tb-btn" id="btn-templates" data-i18n-title="tt.templates"></button>
        <button type="button" class="tb-btn" id="btn-versions" data-i18n-title="tt.versions"></button>
        <button type="button" class="tb-btn" id="btn-goal" data-i18n-title="tt.goal"></button>
        <span class="tb-sep"></span>
        <button type="button" class="tb-btn" id="btn-export" data-i18n-title="tt.export"></button>
        <button type="button" class="tb-btn" id="btn-import" data-i18n-title="tt.import"></button>
        <span class="tb-sep"></span>
        <button type="button" class="tb-btn" id="btn-settings" data-i18n-title="tt.settings"></button>
      </div>
    </div>

    <!-- EDITOR -->
    <div class="rich-wrapper" id="rich-wrapper">
      <div class="reading-progress" id="reading-progress" hidden><div class="reading-progress-fill"></div></div>
      <div class="rich-editor" id="rich-editor" contenteditable="true" data-placeholder=""></div>
    </div>

    <!-- GOAL BAR (bottom strip) -->
    <div class="goal-bar" id="goal-bar" hidden>
      <div class="goal-info">
        <span class="goal-label" id="goal-label"></span>
        <span class="goal-stats" id="goal-stats"></span>
      </div>
      <div class="goal-meter"><div class="goal-fill" id="goal-fill"></div></div>
      <div class="goal-actions">
        <button type="button" class="goal-mini-btn" id="goal-lock" data-i18n-title="goal.lock"></button>
        <button type="button" class="goal-mini-btn" id="goal-clear" data-i18n-title="goal.clear"></button>
      </div>
    </div>

  </div>
  <script src="../i18n.js?v=5.02.00" data-app="writer,google-import"></script>
  <script src="core.js?v=5.02.00"></script>
  <script src="spell.js?v=5.02.00"></script>
  <script src="track.js?v=5.02.00"></script>
  <script src="merge.js?v=5.02.00"></script>
  <script src="io.js?v=5.02.00"></script>
  <script src="docxout.js?v=5.02.00"></script>
  <script src="pdfin.js?v=5.02.00"></script>
  <script src="../bundle.js?v=5.02.00"></script>
  <script src="../google-import.js?v=5.02.00"></script>
  <script src="../files/gmedia.js?v=5.02.00"></script>
  <script src="writer.js?v=5.02.00"></script>
</body>
</html>
