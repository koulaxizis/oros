<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-/eVhFy2QbYy3TrLxXSOs2kSoZ/sTHbc0V3Sryb4E7Hg='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=crm" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CRM · orOS</title>

  <link rel="stylesheet" href="crm.css?v=4.99.00">

</head>
<body>

  <header id="toolbar">
    <h1 id="app-title"></h1>
    <span class="spacer"></span>
    <button type="button" class="icon-btn" id="settings-btn"></button>
    <button type="button" class="txt-btn primary" id="add-btn"></button>
  </header>

  <!-- Tabs: under the toolbar on wide screens, a bottom bar on phones -->
  <nav id="tabbar" role="tablist">
    <button type="button" class="tab" id="tab-cust" role="tab" data-view="cust"></button>
    <button type="button" class="tab" id="tab-pipe" role="tab" data-view="pipe"></button>
    <button type="button" class="tab" id="tab-agenda" role="tab" data-view="agenda"></button>
    <button type="button" class="tab" id="tab-dash" role="tab" data-view="dash"></button>
  </nav>

  <main id="main">
    <!-- Customers: list + the open customer (two panes when wide) -->
    <section id="view-cust" class="view" role="tabpanel" aria-labelledby="tab-cust">
      <div id="cust-list-pane" class="pane">
        <div class="list-tools">
          <input type="search" id="cust-q" autocomplete="off">
          <select id="cust-sort"></select>
        </div>
        <div id="cust-filter" class="chips"></div>
        <div id="cust-list" class="rows"></div>
      </div>
      <div id="cust-detail" class="pane detail"></div>
    </section>

    <!-- Pipeline: deals by stage -->
    <section id="view-pipe" class="view" role="tabpanel" aria-labelledby="tab-pipe" hidden></section>

    <!-- Agenda: open follow-ups -->
    <section id="view-agenda" class="view" role="tabpanel" aria-labelledby="tab-agenda" hidden></section>

    <!-- Dashboard -->
    <section id="view-dash" class="view" role="tabpanel" aria-labelledby="tab-dash" hidden></section>
  </main>

  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="../i18n.js?v=4.99.00" data-app="crm,recordpkg,enrichui,links"></script>
  <script src="../invoices/core.js?v=4.99.00"></script>
  <script src="../quote/core.js?v=4.99.00"></script>
  <script src="core.js?v=4.99.00"></script>
  <script src="contactsync.js?v=4.99.00"></script>
  <script src="links.js?v=4.99.00"></script>
  <script src="overview.js?v=4.99.00"></script>
  <script src="timeline.js?v=4.99.00"></script>
  <script src="rs.js?v=4.99.00"></script>
  <script src="../bundle.js?v=4.99.00"></script>
  <script src="../recordpkg.js?v=4.99.00"></script>
  <script src="package.js?v=4.99.00"></script>
  <script src="../links/core.js?v=4.99.00"></script>
  <script src="../links/crm.js?v=4.99.00"></script>
  <script src="platforms.js?v=4.99.00"></script>
  <script src="webform.js?v=4.99.00"></script>
  <script src="crm.js?v=4.99.00"></script>

</body>
</html>
