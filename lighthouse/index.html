<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-VXQUp5Wta0sso9Lge5ODhjLzNrL3TffEILYgNQy3E6Y='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=lighthouse" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lighthouse Island · orOS</title>

  <link rel="stylesheet" href="../fonts.css?v=8.67.00">
  <link rel="stylesheet" href="lighthouse.css?v=8.67.00">
  <link rel="stylesheet" href="../gamekit/layout.css?v=8.67.00">

</head>
<body>

  <!-- Toolbar: the name and island, Hand over, Buildings, log, how to play, records, sound -->
  <header id="toolbar">
    <div class="tb-row" id="tb-a">
      <h1 class="tb-title" data-i18n="app.name">Lighthouse Island</h1>
      <span class="tb-isle" id="tb-isle"></span>
      <span class="spacer"></span>
      <button type="button" class="main-btn" id="hand-btn" hidden><span class="ic"></span><span class="lb" data-i18n="btn.hand">Hand over</span></button>
      <button type="button" class="main-btn" id="up-btn"><span class="ic"></span><span class="lb" data-i18n="btn.up">Buildings</span></button>
      <button type="button" class="icon-btn" id="log-btn"></button>
      <button type="button" class="icon-btn" id="help-btn"></button>
      <button type="button" class="icon-btn" id="stats-btn"></button>
      <button type="button" class="icon-btn" id="sfx-btn"></button>
    </div>
  </header>

  <!-- Status: coins (and per minute), supplies, fish, ships guided, the clock -->
  <div id="status">
    <span class="stat coins" id="s-coins"><span class="ic"></span><span class="v"></span><span class="r"></span></span>
    <span class="stat" id="s-sup"><span class="ic"></span><span class="v"></span></span>
    <span class="stat" id="s-fish"><span class="ic"></span><span class="v"></span></span>
    <span class="stat" id="s-ships"><span class="ic"></span><span class="v"></span></span>
    <span class="stat" id="s-clock"><span class="ic"></span><span class="v"></span></span>
  </div>

  <!-- The forecast: the weather of every quarter day ahead -->
  <div id="fc" role="list"></div>

  <main id="scene">
    <canvas id="view" tabindex="0" role="application"></canvas>
  </main>

  <!-- The chosen place: its buildings -->
  <section id="panel" aria-live="off"></section>

  <dialog class="lh-dlg" id="dlg"></dialog>

  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="../i18n.js?v=8.67.00" data-app="lighthouse"></script>

  <script src="../gamekit/haptics.js?v=8.67.00"></script>
  <script src="engine.js?v=8.67.00"></script>
  <script src="lighthouse.js?v=8.67.00"></script>

  <script src="../pickers.js?v=8.67.00" defer></script>
</body>
</html>
