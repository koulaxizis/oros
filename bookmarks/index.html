<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bookmarks · orOS</title>
  <link rel="stylesheet" href="bookmarks.css?v=0.36.12">
</head>
<body>

  <!-- Folder tabs + new folder button.
       Tab = click to switch, dblclick/pencil = rename, horizontal
       drag = reorder (Wave 2), long-press = move menu (mobile). -->
  <header id="tabbar-wrap">
    <nav id="tabs" role="tablist" aria-label="Folders"></nav>
    <button id="tab-add" data-i18n-title="tab.add" title="New folder"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </header>

  <!-- Quick-add bar: URL (auto-normalized) + optional title after '|'.
       Enter or button commits; duplicates detected + highlighted. -->
  <div id="addbar">
    <input id="quick-add" type="text" autocomplete="off" spellcheck="false"
           data-i18n-ph="quick.add">
    <button id="quick-add-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>

  <!-- List controls: search | import | export | folder settings -->
  <div id="controls">
    <div id="search-wrap">
      <input id="search" type="search" autocomplete="off" spellcheck="false"
             placeholder="Search…" data-i18n-ph="search.ph">
      <button type="button" id="search-clear" hidden aria-label="Clear search"
              data-i18n-title="search.clear" title="Clear">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <span class="spacer"></span>

    <!-- Selection mode toggle (folders / All view only) -->
    <button type="button" class="ctrl-btn icon" id="select-btn"
            data-i18n-title="sel.mode" title="Select bookmarks">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    </button>

    <!-- All-tags panel -->
    <button type="button" class="ctrl-btn icon" id="tags-btn"
            data-i18n-title="tags.all" title="All tags">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
    </button>

    <!-- Duplicate finder (same-address bookmarks) -->
    <button type="button" class="ctrl-btn icon" id="dupes-btn"
            data-i18n-title="dupe.title" title="Duplicate bookmarks">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
    </button>

    <!-- Sort dropdown -->
    <div id="sort-wrap">
      <select id="sort-select">
        <option value="recent" data-i18n="sort.recent">Recent</option>
        <option value="title" data-i18n="sort.title">Title A–Z</option>
        <option value="visited" data-i18n="sort.visited">Most visited</option>
        <option value="manual" data-i18n="sort.manual">Manual</option>
      </select>
    </div>

    <!-- Netscape HTML import (file picker — never any network) -->
    <input type="file" id="import-in" accept=".html,.htm" hidden>
    <button type="button" class="ctrl-btn icon" id="import-btn"
            data-i18n-title="import.title" title="Import bookmarks">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>

    <!-- Export: Netscape HTML file (round-trip safe with import) -->
    <button type="button" class="ctrl-btn icon" id="export-btn"
            data-i18n-title="export.title" title="Export bookmarks">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    </button>

    <!-- Rename / delete the active folder -->
    <button class="ctrl-btn icon" id="folder-settings"
            data-i18n-title="folder.settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
  </div>

  <!-- Active tag filters (populated at runtime, hidden when empty) -->
  <div id="tag-filter" hidden></div>

  <!-- Bookmark rows (also renders flattened cross-folder search
       results, with a source chip per row) -->
  <main id="list-scroll">
    <ul id="items"></ul>
    <div id="empty" hidden>
      <span data-i18n="empty.title">Nothing here yet</span>
      <small data-i18n="empty.hint">Paste a link above to save it.</small>
    </div>
    <div id="no-match" hidden>
      <span data-i18n="search.none">No matches</span>
      <small data-i18n="search.none.hint">Try another term or check the spelling.</small>
    </div>
    <div id="folder-empty" hidden>
      <span data-i18n="folder.empty.title">This folder is empty</span>
      <small data-i18n="folder.empty.hint">Links you add land in the open folder.</small>
    </div>
  </main>

  <!-- Bulk action bar (selection mode, bottom-fixed) -->
  <div id="bulk-bar">
    <span class="sel-count" id="sel-count"></span>
    <span class="spacer"></span>
    <button type="button" id="sel-move"></button>
    <button type="button" id="sel-delete" class="danger"></button>
    <button type="button" id="sel-done"></button>
  </div>

  <!-- Bookmark editor dialog (tap a row to open).
       Moving happens via the folder select here, drag & drop
       (desktop) or long-press move menu (mobile). -->
  <dialog id="dlg-item">
    <form method="dialog" id="item-form" autocomplete="off">
      <h3 data-i18n="item.title">Bookmark</h3>

      <label data-i18n="item.title.f">Title</label>
      <input id="f-title" type="text">

      <label data-i18n="item.url">Address</label>
      <input id="f-url" type="text" required inputmode="url" spellcheck="false">

      <label data-i18n="item.note">Description</label>
      <textarea id="f-note" rows="3"></textarea>

      <label data-i18n="item.tags">Tags</label>
      <div id="f-tags-editor" class="tags-editor">
        <input id="f-tags-input" type="text" autocomplete="off"
               spellcheck="false" data-i18n-ph="tags.hint">
      </div>
      <div id="f-tags-ac" class="tags-ac" hidden></div>

      <label data-i18n="item.folder">Folder</label>
      <select id="f-folder"></select>

      <menu>
        <button type="button" id="f-delete" class="danger" data-i18n="item.delete">Delete</button>
        <span class="spacer"></span>
        <button type="submit" data-i18n="save">Save</button>
      </menu>
    </form>
  </dialog>

  <!-- Folder settings dialog (rename, delete — Unsorted is
       undeletable, it is the root default) -->
  <dialog id="dlg-folder">
    <form method="dialog" id="folder-form" autocomplete="off">
      <h3 data-i18n="folder.settings.dlg">Folder settings</h3>

      <label data-i18n="folder.name">Name</label>
      <input id="l-name" type="text" required>

      <p class="hint" id="l-count"></p>

      <menu>
        <button type="button" id="l-delete" class="danger" data-i18n="folder.delete">Delete folder</button>
        <span class="spacer"></span>
        <button type="submit" data-i18n="save">Save</button>
      </menu>
    </form>
  </dialog>

  <!-- Undo / feedback toast -->
  <div id="toast" role="status"></div>

  <script src="bookmarks.js?v=0.36.12"></script>
</body>
</html>
