<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-iy33iw2UXv1QbUJR+AnjcpWTe+sBuuIzZNb6oOwKhiw='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=bookmarks" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bookmarks · orOS</title>
  <link rel="stylesheet" href="bookmarks.css?v=5.03.00">
</head>
<body>

  <!-- Folder tabs + new folder button.
       Tab = click to switch, dblclick/pencil = rename, horizontal
       drag = reorder (Wave 2), long-press = move menu (mobile). -->
  <header id="tabbar-wrap">
    <nav id="tabs" role="tablist" aria-label="Folders" data-i18n-aria="aria.folders"></nav>
    <button id="tab-add" data-i18n-title="tab.add" title="New folder"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </header>

  <!-- Quick-add bar: URL (auto-normalized) + optional title after '|'.
       Enter or button commits; duplicates detected + highlighted. -->
  <div id="addbar">
    <input id="quick-add" type="text" autocomplete="off" spellcheck="false"
           data-i18n-ph="quick.add">
    <button id="quick-add-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <!-- "Send to orOS": bookmarklet + Android share help -->
    <button type="button" class="ctrl-btn icon" id="send-btn"
            data-i18n-title="send.title" data-i18n-aria="send.title" title="Save from your browser" aria-label="Save from your browser">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
    </button>
  </div>

  <!-- List controls: search | import | export | folder settings -->
  <div id="controls">
    <div id="search-wrap">
      <input id="search" type="search" autocomplete="off" spellcheck="false"
             placeholder="Search…" data-i18n-ph="search.ph">
      <button type="button" id="search-clear" hidden aria-label="Clear search" data-i18n-aria="search.clear"
              data-i18n-title="search.clear" title="Clear">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <span class="spacer"></span>

    <!-- Selection mode toggle (folders / All view only) -->
    <button type="button" class="ctrl-btn icon" id="select-btn"
            data-i18n-title="sel.mode" title="Select bookmarks">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    </button>

    <!-- All-tags panel -->
    <button type="button" class="ctrl-btn icon" id="tags-btn"
            data-i18n-title="tags.all" title="All tags">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
    </button>

    <!-- Tidy up (wave 35): link check, broken links, duplicate finder -->
    <button type="button" class="ctrl-btn icon" id="dupes-btn"
            data-i18n-title="tools.title" title="Tidy up">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
    </button>

    <!-- Sort dropdown -->
    <div id="sort-wrap">
      <select id="sort-select">
        <option value="recent" data-i18n="sort.recent">Recent</option>
        <option value="title" data-i18n="sort.title">Title A–Z</option>
        <option value="visited" data-i18n="sort.visited">Most visited</option>
        <option value="manual" data-i18n="sort.manual">Manual</option>
      </select>
    </div>

    <!-- Netscape HTML import (unified dialog / localPickFile in JS) -->
    <button type="button" class="ctrl-btn icon" id="import-btn"
            data-i18n-title="import.title" title="Import bookmarks">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>

    <!-- Import from a connected Raindrop.io account (wave 6C; shown inside the shell) -->
    <button type="button" class="ctrl-btn icon" id="raindrop-btn" hidden
            title="Import from Raindrop.io">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9z"/><polyline points="9.5 13.5 12 16 14.5 13.5"/><line x1="12" y1="10" x2="12" y2="16"/></svg>
    </button>

    <!-- Export: Netscape HTML file (round-trip safe with import) -->
    <button type="button" class="ctrl-btn icon" id="export-btn"
            data-i18n-title="export.title" title="Export bookmarks">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    </button>

    <!-- Rename / delete the active folder -->
    <button class="ctrl-btn icon" id="folder-settings"
            data-i18n-title="folder.settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
  </div>

  <!-- Nested folders (wave 35): path of the open folder, its
       subfolders as chips, "New subfolder". Filled at runtime. -->
  <nav id="crumbs" hidden data-i18n-aria="folder.path" aria-label="Folder path"></nav>

  <!-- Active tag filters (populated at runtime, hidden when empty) -->
  <div id="tag-filter" hidden></div>

  <!-- Bookmark rows (also renders flattened cross-folder search
       results, with a source chip per row) -->
  <main id="list-scroll">
    <ul id="items"></ul>
    <div id="empty" hidden>
      <span data-i18n="empty.title">Nothing here yet</span>
      <small data-i18n="empty.hint">Paste a link above to save it.</small>
    </div>
    <div id="no-match" hidden>
      <span data-i18n="search.none">No matches</span>
      <small data-i18n="search.none.hint">Try another term or check the spelling.</small>
    </div>
    <div id="folder-empty" hidden>
      <span data-i18n="folder.empty.title">This folder is empty</span>
      <small data-i18n="folder.empty.hint">Links you add land in the open folder.</small>
    </div>
  </main>

  <!-- Bulk action bar (selection mode, bottom-fixed) -->
  <div id="bulk-bar">
    <span class="sel-count" id="sel-count"></span>
    <span class="spacer"></span>
    <button type="button" id="sel-move"></button>
    <button type="button" id="sel-share" hidden></button>
    <button type="button" id="sel-delete" class="danger"></button>
    <button type="button" id="sel-done"></button>
  </div>

  <!-- Bookmark editor dialog (tap a row to open).
       Moving happens via the folder select here, drag & drop
       (desktop) or long-press move menu (mobile). -->
  <dialog id="dlg-item">
    <form method="dialog" id="item-form" autocomplete="off">
      <h3 data-i18n="item.title">Bookmark</h3>

      <label data-i18n="item.title.f">Title</label>
      <input id="f-title" type="text">

      <label data-i18n="item.url">Address</label>
      <input id="f-url" type="text" required inputmode="url" spellcheck="false">

      <label data-i18n="item.note">Description</label>
      <textarea id="f-note" rows="3"></textarea>

      <label data-i18n="item.tags">Tags</label>
      <div id="f-tags-editor" class="tags-editor">
        <input id="f-tags-input" type="text" autocomplete="off"
               spellcheck="false" data-i18n-ph="tags.hint">
      </div>
      <div id="f-tags-ac" class="tags-ac" hidden></div>

      <label data-i18n="item.folder">Folder</label>
      <select id="f-folder"></select>

      <!-- Wave 35: last link check + saved readable copy -->
      <div id="f-extras" hidden></div>

      <menu>
        <button type="button" id="f-delete" class="danger" data-i18n="item.delete">Delete</button>
        <span class="spacer"></span>
        <button type="button" id="f-follow" data-i18n="item.follow" hidden>Follow in Reader</button>
        <button type="button" id="f-qr" data-i18n="item.qr" hidden>QR code</button>
        <button type="submit" data-i18n="save">Save</button>
      </menu>
    </form>
  </dialog>

  <!-- Folder settings dialog (rename, delete — Unsorted is
       undeletable, it is the root default) -->
  <dialog id="dlg-folder">
    <form method="dialog" id="folder-form" autocomplete="off">
      <h3 data-i18n="folder.settings.dlg">Folder settings</h3>

      <label data-i18n="folder.name">Name</label>
      <input id="l-name" type="text" required>

      <div id="l-parent-wrap">
        <label for="l-parent" data-i18n="folder.parent">Inside</label>
        <select id="l-parent"></select>
      </div>

      <p class="hint" id="l-count"></p>

      <menu>
        <button type="button" id="l-delete" class="danger" data-i18n="folder.delete">Delete folder</button>
        <span class="spacer"></span>
        <button type="submit" data-i18n="save">Save</button>
      </menu>
    </form>
  </dialog>

  <!-- "Send to orOS": how to save pages from the browser. The
       bookmarklet href is set at runtime (it needs this origin). -->
  <dialog id="dlg-send">
    <form method="dialog" autocomplete="off">
      <h3 data-i18n="send.title">Save from your browser</h3>
      <p class="hint" data-i18n="send.intro"></p>
      <label data-i18n="send.pc"></label>
      <p class="hint" data-i18n="send.pc.hint"></p>
      <div class="send-row">
        <a id="send-link" class="send-link" draggable="true" data-i18n="send.link">Save to orOS</a>
        <button type="button" id="send-copy" data-i18n="send.copy">Copy code</button>
      </div>
      <textarea id="send-code" rows="3" readonly spellcheck="false" hidden></textarea>
      <label data-i18n="send.android"></label>
      <p class="hint" data-i18n="send.android.hint"></p>
      <p class="hint" data-i18n="send.safe"></p>
      <menu>
        <span class="spacer"></span>
        <button type="submit" data-i18n="ok">OK</button>
      </menu>
    </form>
  </dialog>

  <!-- Folder picker (wave 35): every "Move to…" of a bookmark, the
       selection or a folder. Rows are filled at runtime. -->
  <dialog id="dlg-pick">
    <form method="dialog" autocomplete="off">
      <h3 id="pick-title">Move to folder</h3>
      <div id="pick-list" role="list"></div>
      <menu>
        <span class="spacer"></span>
        <button type="submit" data-i18n="cancel">Cancel</button>
      </menu>
    </form>
  </dialog>

  <!-- Saved readable copy (wave 35): the article from the orOS disk,
       sanitised again and shown in a sandboxed frame. -->
  <section id="reader" hidden role="dialog" aria-modal="true" aria-labelledby="rd-title">
    <header class="rd-bar">
      <button type="button" id="rd-back" class="rd-icon" data-i18n-title="arc.back" data-i18n-aria="arc.back" title="Back" aria-label="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="rd-head">
        <div id="rd-title"></div>
        <div id="rd-meta"></div>
      </div>
    </header>
    <div class="rd-tools">
      <button type="button" id="rd-open" data-i18n="arc.open">Original page</button>
      <button type="button" id="rd-again" data-i18n="arc.again">Save again</button>
      <label class="rd-img"><input type="checkbox" id="rd-img"> <span data-i18n="arc.img">Keep pictures</span></label>
      <span class="spacer"></span>
      <button type="button" id="rd-remove" class="danger" data-i18n="arc.remove">Remove copy</button>
    </div>
    <div id="rd-body"></div>
  </section>

  <!-- Undo / feedback toast -->
  <div id="toast" role="status"></div>

  <script src="../i18n.js?v=5.03.00" data-app="bookmarks,recordpkg,links"></script>
  <script src="../links/core.js?v=5.03.00"></script>
  <script src="../links/bookmarks.js?v=5.03.00"></script>
  <script src="platforms.js?v=5.03.00"></script>
  <script src="../importkit.js?v=5.03.00"></script>
  <script src="import.js?v=5.03.00"></script>
  <script src="core.js?v=5.03.00"></script>
  <script src="../bundle.js?v=5.03.00"></script>
  <script src="../recordpkg.js?v=5.03.00"></script>
  <script src="package.js?v=5.03.00"></script>
  <script src="bookmarks.js?v=5.03.00"></script>
</body>
</html>
