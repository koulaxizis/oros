<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pet World · orOS</title>

  <link rel="stylesheet" href="petworld.css?v=0.46.00">

</head>
<body>

  <!-- Toolbar: the pet's name (rename) + age, level + acorns, backpack, the desktop companion switch -->
  <header id="toolbar">
    <button type="button" id="name-btn">
      <strong id="pet-name"></strong>
      <small id="pet-age"></small>
    </button>
    <span class="spacer"></span>
    <button type="button" id="level-btn" hidden>
      <span id="level-num"></span>
      <span class="level-track"><span id="level-fill"></span></span>
      <span id="acorn-ico" aria-hidden="true"></span><span id="acorn-num"></span>
    </button>
    <button type="button" class="icon-btn" id="bag-btn"></button>
    <button type="button" class="icon-btn" id="companion-btn" aria-pressed="false"></button>
  </header>

  <!-- Food · happiness · energy, the same derived stats as the companion -->
  <div id="stats">
    <div class="stat" id="stat-food"><span class="stat-ico"></span><span class="stat-track"><span class="stat-fill"></span></span><span class="stat-num"></span></div>
    <div class="stat" id="stat-happy"><span class="stat-ico"></span><span class="stat-track"><span class="stat-fill"></span></span><span class="stat-num"></span></div>
    <div class="stat" id="stat-energy"><span class="stat-ico"></span><span class="stat-track"><span class="stat-fill"></span></span><span class="stat-num"></span></div>
  </div>

  <main id="scene-wrap">
    <canvas id="scene" role="img"></canvas>
    <div id="bubble" aria-hidden="true"></div>
    <div id="offline" hidden></div>
  </main>

  <!-- Care actions, play, walk, garden, nest (the backpack sits in the toolbar) -->
  <nav id="actions">
    <button type="button" class="act-btn" id="feed-btn"><span class="act-ico"></span><span class="act-lbl"></span></button>
    <button type="button" class="act-btn" id="pat-btn"><span class="act-ico"></span><span class="act-lbl"></span></button>
    <button type="button" class="act-btn" id="sleep-btn"><span class="act-ico"></span><span class="act-lbl"></span></button>
    <button type="button" class="act-btn" id="play-btn"><span class="act-ico"></span><span class="act-lbl"></span></button>
    <button type="button" class="act-btn" id="walk-btn"><span class="act-ico"></span><span class="act-lbl"></span></button>
    <button type="button" class="act-btn" id="garden-btn"><span class="act-ico"></span><span class="act-lbl"></span></button>
    <button type="button" class="act-btn" id="nest-btn"><span class="act-ico"></span><span class="act-lbl"></span></button>
  </nav>

  <!-- While a game runs: its name, score, time or tries, the dance pad, Stop -->
  <nav id="game-bar" hidden>
    <div id="game-head">
      <strong id="game-title"></strong>
      <span id="game-score"></span>
      <span id="game-info"></span>
      <span class="spacer"></span>
      <button type="button" class="dlg-btn small" id="game-quit"></button>
    </div>
    <div id="game-pad" hidden>
      <button type="button" class="act-btn" data-move="left"></button>
      <button type="button" class="act-btn" data-move="up"></button>
      <button type="button" class="act-btn" data-move="down"></button>
      <button type="button" class="act-btn" data-move="right"></button>
    </div>
  </nav>

  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="petworld.js?v=0.46.00"></script>

</body>
</html>
