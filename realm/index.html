<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-oSZ/RvLH2c5FreHtt/7ZX8Lcceh6nQWEKxd6R6+JN+s='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=realm" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Realm · orOS</title>

  <link rel="stylesheet" href="../fonts.css?v=6.17.00">
  <link rel="stylesheet" href="realm.css?v=6.17.00">
  <link rel="stylesheet" href="../gamekit/layout.css?v=6.17.00">

</head>
<body>

  <!-- Toolbar: one line on a wide screen, two strips on a phone -->
  <header id="toolbar">
    <h1 class="sr-only" data-i18n="app.name">Realm</h1>
    <div class="tb-row" id="tb-a">
      <button type="button" class="icon-btn" id="new-btn"></button>
      <button type="button" class="icon-btn" id="edx-btn" hidden></button>
      <button type="button" class="icon-btn" id="undo-btn"></button>
      <button type="button" class="end-btn" id="end-btn" data-i18n="btn.end">End turn</button>
    </div>
    <div class="tb-row" id="tb-b">
      <button type="button" class="icon-btn" id="zout-btn"></button>
      <button type="button" class="icon-btn" id="zin-btn"></button>
      <button type="button" class="icon-btn" id="center-btn"></button>
      <span class="spacer"></span>
      <button type="button" class="icon-btn" id="edm-btn" hidden></button>
      <button type="button" class="icon-btn" id="camp-btn"></button>
      <button type="button" class="icon-btn" id="daily-btn"></button>
      <button type="button" class="icon-btn" id="stats-btn"></button>
      <button type="button" class="icon-btn" id="sfx-btn" aria-pressed="false"></button>
    </div>
  </header>

  <!-- Status: whose turn and round; the selected region's treasury -->
  <aside id="status">
    <span class="stat who"><i id="sw" class="swatch" aria-hidden="true"></i><span id="turn" aria-live="polite"></span></span>
    <span class="stat" id="round"></span>
    <span class="stat purse"><strong id="gold"></strong> <span id="net"></span></span>
  </aside>

  <main id="map-wrap">
    <canvas id="map" tabindex="0" role="application"></canvas>
  </main>

  <!-- Buy bar: units, buildings; key 1-7 -->
  <nav id="buybar">
    <button type="button" class="buy" id="buy-u1"><span class="ic"></span><span class="nm"></span><span class="cost"></span></button>
    <button type="button" class="buy" id="buy-u2"><span class="ic"></span><span class="nm"></span><span class="cost"></span></button>
    <button type="button" class="buy" id="buy-u3"><span class="ic"></span><span class="nm"></span><span class="cost"></span></button>
    <button type="button" class="buy" id="buy-u4"><span class="ic"></span><span class="nm"></span><span class="cost"></span></button>
    <button type="button" class="buy" id="buy-tower"><span class="ic"></span><span class="nm"></span><span class="cost"></span></button>
    <button type="button" class="buy" id="buy-fort"><span class="ic"></span><span class="nm"></span><span class="cost"></span></button>
    <button type="button" class="buy" id="buy-mill"><span class="ic"></span><span class="nm"></span><span class="cost"></span></button>
  </nav>

  <!-- Editor brushes (map editor): key 1-9 -->
  <nav id="edbar" hidden>
    <button type="button" class="buy brush" id="br-0"><span class="ic"></span><span class="nm"></span></button>
    <button type="button" class="buy brush" id="br-1"><span class="ic"></span><span class="nm"></span></button>
    <button type="button" class="buy brush" id="br-2"><span class="ic"></span><span class="nm"></span></button>
    <button type="button" class="buy brush" id="br-3"><span class="ic"></span><span class="nm"></span></button>
    <button type="button" class="buy brush" id="br-4"><span class="ic"></span><span class="nm"></span></button>
    <button type="button" class="buy brush" id="br-5"><span class="ic"></span><span class="nm"></span></button>
    <button type="button" class="buy brush" id="br-6"><span class="ic"></span><span class="nm"></span></button>
    <button type="button" class="buy brush" id="br-7"><span class="ic"></span><span class="nm"></span></button>
    <button type="button" class="buy brush" id="br-8"><span class="ic"></span><span class="nm"></span></button>
  </nav>

  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="../i18n.js?v=6.17.00" data-app="realm"></script>

  <script src="../gamekit/haptics.js?v=6.17.00"></script>
  <script src="../gamekit/daily.js?v=6.17.00"></script>
  <script src="engine.js?v=6.17.00"></script>
  <script src="campaign.js?v=6.17.00"></script>
  <script src="realm.js?v=6.17.00"></script>

</body>
</html>
