<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-cfEtZB+xoMj5aTi3dEidv3v+lFU6TPi9LFzvJOH15b8='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=meals" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meal Planner · orOS</title>

  <link rel="stylesheet" href="meals.css?v=4.99.00">

</head>
<body>

  <header id="toolbar">
    <div id="tabs" role="tablist">
      <button type="button" role="tab" class="tab" id="tab-rc" data-tab="rc" aria-controls="view-rc"></button>
      <button type="button" role="tab" class="tab" id="tab-wk" data-tab="wk" aria-controls="view-wk"></button>
      <button type="button" role="tab" class="tab" id="tab-sh" data-tab="sh" aria-controls="view-sh"></button>
      <button type="button" role="tab" class="tab" id="tab-pa" data-tab="pa" aria-controls="view-pa"></button>
    </div>
    <span class="spacer"></span>
    <button type="button" class="icon-btn" id="set-btn"></button>
  </header>
  <div id="plans" class="chips plans" hidden></div>

  <main id="main">
    <!-- Recipes -->
    <section id="view-rc" class="view" role="tabpanel" aria-labelledby="tab-rc">
      <div class="bar">
        <div class="search-wrap">
          <input id="rc-search" type="search" autocomplete="off" maxlength="80">
        </div>
        <button type="button" class="txt-btn" id="rc-paste"></button>
        <button type="button" class="txt-btn primary" id="rc-new"></button>
      </div>
      <div class="chips" id="rc-filters"></div>
      <p class="hint" id="rc-ingmode" hidden></p>
      <div id="rc-list"></div>
      <p class="empty" id="rc-empty" hidden></p>
    </section>

    <!-- Week -->
    <section id="view-wk" class="view" role="tabpanel" aria-labelledby="tab-wk" hidden>
      <div class="bar wk-bar">
        <button type="button" class="icon-btn wk-prev"></button>
        <span class="wk-label"></span>
        <button type="button" class="icon-btn wk-next"></button>
        <button type="button" class="txt-btn wk-today"></button>
        <span class="spacer"></span>
        <div class="bar-scroll">
          <button type="button" class="txt-btn" id="wk-copy"></button>
          <button type="button" class="txt-btn" id="wk-fill"></button>
          <button type="button" class="txt-btn" id="wk-clear"></button>
          <button type="button" class="txt-btn" id="wk-sheet" hidden></button>
        </div>
      </div>
      <div id="wk-grid"></div>
    </section>

    <!-- Shopping -->
    <section id="view-sh" class="view" role="tabpanel" aria-labelledby="tab-sh" hidden>
      <div class="bar wk-bar">
        <button type="button" class="icon-btn wk-prev"></button>
        <span class="wk-label"></span>
        <button type="button" class="icon-btn wk-next"></button>
        <button type="button" class="txt-btn wk-today"></button>
        <span class="spacer"></span>
        <div class="bar-scroll">
          <button type="button" class="txt-btn" id="sh-from" aria-pressed="false"></button>
          <button type="button" class="txt-btn" id="sh-copy"></button>
          <button type="button" class="txt-btn" id="sh-share"></button>
          <button type="button" class="txt-btn" id="sh-todo" hidden></button>
          <button type="button" class="txt-btn" id="sh-sheet" hidden></button>
          <button type="button" class="txt-btn" id="sh-bud" hidden></button>
          <button type="button" class="txt-btn" id="sh-pantry"></button>
          <button type="button" class="txt-btn" id="sh-uncheck"></button>
        </div>
      </div>
      <div class="add-row">
        <input id="sh-add-in" maxlength="80" autocomplete="off">
        <button type="button" class="icon-btn" id="sh-add-btn"></button>
      </div>
      <p class="hint" id="sh-count"></p>
      <div id="sh-list"></div>
      <p class="empty" id="sh-empty" hidden></p>
      <div id="sh-home" class="sh-home" hidden></div>
      <div id="sh-excluded" class="excluded" hidden></div>
    </section>

    <!-- Pantry -->
    <section id="view-pa" class="view" role="tabpanel" aria-labelledby="tab-pa" hidden>
      <div class="bar pa-bar">
        <div class="add-row pa-add">
          <input id="pa-add-in" maxlength="80" autocomplete="off">
          <button type="button" class="icon-btn" id="pa-add-btn"></button>
        </div>
        <button type="button" class="txt-btn" id="pa-scan"></button>
      </div>
      <div class="bar pa-bar2">
        <div class="chips" id="pa-filters" role="group"></div>
        <span class="spacer"></span>
        <button type="button" class="txt-btn primary" id="pa-cook"></button>
      </div>
      <div id="pa-soon" class="pa-soon" hidden></div>
      <div id="pa-list"></div>
      <p class="empty" id="pa-empty" hidden></p>
    </section>
  </main>

  <div id="timers" hidden></div>
  <div id="print-area" aria-hidden="true"></div>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="../i18n.js?v=4.99.00" data-app="meals,recordpkg"></script>
  <script src="../importkit.js?v=4.99.00"></script>
  <script src="core.js?v=4.99.00"></script>
  <script src="nutrition.js?v=4.99.00"></script>
  <script src="pantry.js?v=4.99.00"></script>
  <script src="../household/core.js?v=4.99.00"></script>
  <script src="../household/whole.js?v=4.99.00"></script>
  <script src="../household/share.js?v=4.99.00"></script>
  <script src="house.js?v=4.99.00"></script>
  <script src="../bundle.js?v=4.99.00"></script>
  <script src="../recordpkg.js?v=4.99.00"></script>
  <script src="package.js?v=4.99.00"></script>
  <script src="meals.js?v=4.99.00"></script>

</body>
</html>
