<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hangman · orOS</title>

  <link rel="stylesheet" href="hangman.css?v=0.53.00">

</head>
<body>

  <!-- Toolbar: one line on a wide screen, two scrolling strips on a phone -->
  <header id="toolbar">
    <div class="tb-row" id="tb-a">
      <div class="seg" id="lang-seg" role="group">
        <button type="button" class="seg-btn" data-lang="en" data-i18n="lang.en">EN</button>
        <button type="button" class="seg-btn" data-lang="el" data-i18n="lang.el">ΕΛ</button>
      </div>
      <div class="seg" id="level-seg" role="group">
        <button type="button" class="seg-btn" data-level="e" data-i18n="level.e">Easy</button>
        <button type="button" class="seg-btn" data-level="m" data-i18n="level.m">Medium</button>
        <button type="button" class="seg-btn" data-level="h" data-i18n="level.h">Hard</button>
      </div>
    </div>
    <div class="tb-row" id="tb-b">
      <span class="spacer"></span>
      <button type="button" class="icon-btn" id="new-btn"></button>
      <button type="button" class="icon-btn" id="stats-btn"></button>
      <button type="button" class="icon-btn" id="sfx-btn" aria-pressed="false"></button>
    </div>
  </header>

  <!-- Status: misses, hint, streak -->
  <div id="status">
    <span class="stat"><strong id="misses">0/6</strong><span data-i18n="st.misses">Misses</span></span>
    <span id="turn" aria-live="polite"></span>
    <span class="stat"><strong id="streak">0</strong><span data-i18n="st.streak">Streak</span></span>
  </div>

  <main id="board-wrap">
    <div id="figure" aria-hidden="true"></div>
    <div id="word" role="group"></div>
  </main>

  <div id="kb" role="group"></div>

  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="words-en.js?v=0.53.00"></script>
  <script src="words-el.js?v=0.53.00"></script>
  <script src="hangman.js?v=0.53.00"></script>

</body>
</html>
