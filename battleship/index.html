<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Battleship · orOS</title>

  <link rel="stylesheet" href="battleship.css?v=0.65.01">

</head>
<body>

  <!-- Toolbar: one line on a wide screen, two scrolling strips on a phone -->
  <header id="toolbar">
    <div class="tb-row" id="tb-a">
      <div class="seg" id="level-seg" role="group">
        <button type="button" class="seg-btn" data-level="e" data-i18n="level.e">Easy</button>
        <button type="button" class="seg-btn" data-level="m" data-i18n="level.m">Medium</button>
        <button type="button" class="seg-btn" data-level="h" data-i18n="level.h">Hard</button>
      </div>
    </div>
    <div class="tb-row" id="tb-b">
      <span class="spacer"></span>
      <button type="button" class="icon-btn" id="opts-btn"></button>
      <button type="button" class="icon-btn" id="new-btn"></button>
      <button type="button" class="icon-btn" id="stats-btn"></button>
      <button type="button" class="icon-btn" id="sfx-btn" aria-pressed="false"></button>
    </div>
  </header>

  <!-- Status: your ships afloat, whose turn, enemy ships afloat -->
  <div id="status">
    <span class="stat"><strong id="mine-left">5</strong><span data-i18n="st.mine">Your ships</span></span>
    <span id="turn" aria-live="polite"></span>
    <span class="stat"><strong id="theirs-left">5</strong><span data-i18n="st.theirs">Enemy ships</span></span>
  </div>

  <main id="board-wrap">
    <div id="boards">
      <section class="panel" id="panel-enemy">
        <div class="cap" id="cap-enemy"></div>
        <div class="grid" id="grid-enemy" role="grid"></div>
      </section>
      <section class="panel" id="panel-mine">
        <div class="cap" id="cap-mine"></div>
        <div class="grid" id="grid-mine" role="grid"></div>
      </section>
      <section class="panel" id="dock">
        <div class="cap" id="cap-dock"></div>
        <div id="ships" role="group"></div>
        <div id="dock-acts">
          <button type="button" class="act" id="rotate-btn"></button>
          <button type="button" class="act" id="random-btn"></button>
          <button type="button" class="act" id="clear-btn"></button>
          <button type="button" class="act primary" id="start-btn"></button>
        </div>
      </section>
    </div>
  </main>

  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="battleship.js?v=0.65.01"></script>

</body>
</html>
