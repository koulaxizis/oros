<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Atelier · orOS</title>

  <link rel="stylesheet" href="atelier.css?v=0.48.01">

</head>
<body>

  <!-- ===== Home ===== -->
  <section id="home">
    <header class="bar">
      <div class="title">
        <span class="title-main" data-i18n="app.name">Atelier</span>
        <span class="title-sub" id="home-sub"></span>
      </div>
      <span class="spacer"></span>
      <button type="button" class="btn ghost" id="btn-import" data-i18n="home.import">Open package</button>
      <button type="button" class="btn primary" id="btn-custom" data-i18n="home.custom">Custom size</button>
    </header>
    <div class="home-scroll">
      <h2 class="home-h" data-i18n="home.make">What will you make?</h2>
      <div id="sizes" class="sizes"></div>
      <h2 class="home-h" data-i18n="home.templates">Start from a template</h2>
      <div id="tpls" class="tpls"></div>
      <div class="home-h-row">
        <h2 class="home-h" data-i18n="home.designs">Your designs</h2>
        <input type="search" id="home-search" class="inp sm" autocomplete="off" spellcheck="false" hidden>
      </div>
      <p id="home-empty" class="hint" data-i18n="home.empty" hidden></p>
      <div id="docs" class="docs"></div>
    </div>
  </section>

  <!-- ===== Editor ===== -->
  <section id="editor" hidden>
    <header class="bar" id="ed-bar">
      <button type="button" class="icon-btn" id="ed-back"></button>
      <button type="button" class="doc-name" id="ed-name"></button>
      <span class="spacer"></span>
      <div class="bar-group">
        <button type="button" class="icon-btn" id="ed-undo"></button>
        <button type="button" class="icon-btn" id="ed-redo"></button>
        <span class="sep"></span>
        <button type="button" class="icon-btn" id="ed-zout"></button>
        <button type="button" class="zoom-lbl" id="ed-zoom"></button>
        <button type="button" class="icon-btn" id="ed-zin"></button>
        <span class="sep"></span>
        <button type="button" class="icon-btn" id="ed-more"></button>
        <button type="button" class="btn primary small" id="ed-export"></button>
      </div>
    </header>

    <div id="work">
      <nav id="rail" role="tablist"></nav>
      <aside id="drawer" hidden>
        <header class="drawer-head">
          <span class="drawer-title" id="drawer-title"></span>
          <span class="spacer"></span>
          <button type="button" class="icon-btn" id="drawer-close"></button>
        </header>
        <div id="drawer-body"></div>
      </aside>
      <div id="main">
        <div id="ctx" role="toolbar"></div>
        <div id="stage">
          <canvas id="cv" tabindex="0"></canvas>
          <textarea id="tx-edit" class="tx-edit" spellcheck="true" hidden></textarea>
          <div id="crop-bar" class="banner" hidden>
            <span class="crop-hint" data-i18n="crop.hint"></span>
            <input type="range" id="crop-zoom" class="rng" min="100" max="500" step="1">
            <button type="button" class="btn small" id="crop-reset" data-i18n="crop.reset">Reset</button>
            <button type="button" class="btn primary small" id="crop-done" data-i18n="ctx.done">Done</button>
          </div>
        </div>
        <div id="pages" role="list"></div>
      </div>
    </div>
  </section>

  <div id="menu" class="menu" role="menu" hidden></div>
  <dialog id="dlg" class="dlg"></dialog>
  <div id="loading" class="loading"><span data-i18n="loading">Loading fonts…</span></div>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="../designkit/model.js?v=0.48.01"></script>
  <script src="../designkit/text.js?v=0.48.01"></script>
  <script src="../designkit/render.js?v=0.48.01"></script>
  <script src="../designkit/assets.js?v=0.48.01"></script>
  <script src="../designkit/fx.js?v=0.48.01"></script>
  <script src="../designkit/media.js?v=0.48.01"></script>
  <script src="../designkit/show.js?v=0.48.01"></script>
  <script src="library/icons.js?v=0.48.01"></script>
  <script src="presets.js?v=0.48.01"></script>
  <script src="templates.js?v=0.48.01"></script>
  <script src="ax.js?v=0.48.01"></script>
  <script src="anim.js?v=0.48.01"></script>
  <script src="core.js?v=0.48.01"></script>
  <script src="draw.js?v=0.48.01"></script>
  <script src="editor.js?v=0.48.01"></script>
  <script src="panels.js?v=0.48.01"></script>
  <script src="sources.js?v=0.48.01"></script>
  <script src="gif.js?v=0.48.01"></script>
  <script src="motion.js?v=0.48.01"></script>
  <script src="zip.js?v=0.48.01"></script>
  <script src="pptx.js?v=0.48.01"></script>
  <script src="canva.js?v=0.48.01"></script>
  <script src="io.js?v=0.48.01"></script>

</body>
</html>
