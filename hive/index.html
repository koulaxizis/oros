<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-MWpveqeAZ519VBVyVXOCIN1Hy8GAONKwb+IGWzxNRUQ='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=hive" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hive · orOS</title>

  <link rel="stylesheet" href="../fonts.css?v=9.03.00">
  <link rel="stylesheet" href="hive.css?v=9.03.00">
  <link rel="stylesheet" href="../gamekit/layout.css?v=9.03.00">

</head>
<body>

  <!-- Toolbar: the name, Improvements, how to play, records, sound -->
  <header id="toolbar">
    <div class="tb-row" id="tb-a">
      <h1 class="tb-title" data-i18n="app.name">Hive</h1>
      <span class="tb-hill" id="tb-hill"></span>
      <span class="spacer"></span>
      <button type="button" class="main-btn" id="sw-btn" hidden><span class="ic"></span><span class="lb" data-i18n="btn.swarm">Swarm</span></button>
      <button type="button" class="main-btn" id="up-btn"><span class="ic"></span><span class="lb" data-i18n="btn.up">Improvements</span></button>
      <button type="button" class="icon-btn" id="help-btn"></button>
      <button type="button" class="icon-btn" id="stats-btn"></button>
      <button type="button" class="icon-btn" id="sfx-btn"></button>
    </div>
  </header>

  <!-- Status: honey (and per minute), wax, bees / room, month and year -->
  <div id="status">
    <span class="stat honey" id="s-honey"><span class="ic"></span><span class="v"></span><span class="r"></span></span>
    <span class="stat" id="s-wax"><span class="ic"></span><span class="v"></span></span>
    <span class="stat" id="s-bees"><span class="ic"></span><span class="v"></span></span>
    <span class="stat" id="s-month"><span class="ic"></span><span class="v"></span></span>
  </div>

  <!-- The year: what blooms in each month, and the weather -->
  <div id="cal" role="list"></div>

  <main id="scene">
    <canvas id="view" tabindex="0" role="application"></canvas>
  </main>

  <!-- The chosen patch: plant, replace, tend -->
  <section id="panel" aria-live="off"></section>

  <dialog class="hv-dlg" id="dlg"></dialog>

  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="../i18n.js?v=9.03.00" data-app="hive"></script>

  <script src="../gamekit/haptics.js?v=9.03.00"></script>
  <script src="engine.js?v=9.03.00"></script>
  <script src="hive.js?v=9.03.00"></script>

  <script src="../pickers.js?v=9.03.00" defer></script>
</body>
</html>
