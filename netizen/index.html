<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Netizen ID · orOS</title>

  <link rel="stylesheet" href="netizen.css?v=0.45.14">

</head>
<body>

  <!-- Toolbar: one line on a wide screen, two scrolling strips on a phone -->
  <header id="toolbar">
    <div class="tb-row" id="tb-a">
      <select id="card-select"></select>
      <button type="button" class="icon-btn" id="new-btn"></button>
      <button type="button" class="icon-btn" id="dup-btn"></button>
      <button type="button" class="icon-btn danger" id="del-btn"></button>
    </div>
    <div class="tb-row" id="tb-b">
      <div class="seg" id="tab-seg" role="group">
        <button type="button" class="seg-btn" data-tab="edit" data-i18n="tab.edit">Edit</button>
        <button type="button" class="seg-btn" data-tab="card" data-i18n="tab.card">Card</button>
      </div>
      <span class="spacer"></span>
      <button type="button" class="icon-btn" id="flip-btn"></button>
      <button type="button" class="icon-btn" id="copy-btn"></button>
      <button type="button" class="icon-btn" id="share-btn"></button>
      <button type="button" class="icon-btn" id="export-btn"></button>
    </div>
  </header>

  <main id="main">
    <!-- Editor -->
    <form id="form" autocomplete="off" novalidate>
      <section class="sec">
        <h2 data-i18n="sec.identity">Identity</h2>
        <div class="fld" data-f="user">
          <label for="f-user" data-i18n="f.user">Username</label>
          <div class="in-row"><span class="at">@</span><input id="f-user" data-f="user" maxlength="32" spellcheck="false" autocapitalize="off"></div>
        </div>
        <div class="fld" data-f="disp">
          <label for="f-disp" data-i18n="f.disp">Display name</label>
          <div class="in-row"><input id="f-disp" data-f="disp" maxlength="48"></div>
        </div>
        <div class="fld" data-f="pron">
          <label for="f-pron" data-i18n="f.pron">Pronouns</label>
          <div class="in-row"><input id="f-pron" data-f="pron" maxlength="24"></div>
        </div>
        <div class="fld" data-f="loc">
          <label for="f-loc" data-i18n="f.loc">Location</label>
          <div class="in-row"><input id="f-loc" data-f="loc" maxlength="48"></div>
        </div>
        <div class="fld" data-f="langs">
          <label for="f-langs" data-i18n="f.langs">Languages</label>
          <div class="in-row"><input id="f-langs" data-f="langs" maxlength="48"></div>
        </div>
        <div class="fld" data-f="since">
          <label for="f-since" data-i18n="f.since">Netizen since (year)</label>
          <div class="in-row"><input id="f-since" data-f="since" maxlength="4" inputmode="numeric"></div>
        </div>
      </section>

      <section class="sec">
        <h2 data-i18n="sec.avatar">Pixel avatar</h2>
        <div class="fld av-fld" data-f="avatar">
          <div class="av-wrap">
            <div id="av-grid" role="grid"></div>
            <div class="av-side">
              <div id="av-pal" role="radiogroup"></div>
              <div class="av-acts">
                <button type="button" class="txt-btn" id="av-roll"></button>
                <label class="chk"><input type="checkbox" id="av-clear"><span data-i18n="av.clear">Transparent background</span></label>
              </div>
              <p class="hint" data-i18n="av.hint">Tap or drag on the grid to paint with the chosen colour.</p>
            </div>
          </div>
        </div>
      </section>

      <section class="sec">
        <h2 data-i18n="sec.contact">Contact</h2>
        <div class="fld" data-f="email">
          <label for="f-email" data-i18n="f.email">Email</label>
          <div class="in-row"><input id="f-email" data-f="email" type="email" maxlength="80" spellcheck="false" autocapitalize="off"></div>
        </div>
        <div class="fld" data-f="phone">
          <label for="f-phone" data-i18n="f.phone">Phone</label>
          <div class="in-row"><input id="f-phone" data-f="phone" type="tel" maxlength="32"></div>
        </div>
        <div class="fld" data-f="web">
          <label for="f-web" data-i18n="f.web">Website</label>
          <div class="in-row"><input id="f-web" data-f="web" type="url" maxlength="120" spellcheck="false" autocapitalize="off"></div>
        </div>
      </section>

      <section class="sec">
        <h2 data-i18n="sec.links">Sites &amp; socials</h2>
        <div class="fld" data-f="links">
          <div id="links"></div>
          <button type="button" class="txt-btn" id="link-add"></button>
        </div>
      </section>

      <section class="sec">
        <h2 data-i18n="sec.about">Bio &amp; motto</h2>
        <div class="fld" data-f="bio">
          <label for="f-bio" data-i18n="f.bio">Bio</label>
          <div class="in-row"><textarea id="f-bio" data-f="bio" maxlength="280" rows="4"></textarea></div>
        </div>
        <div class="fld" data-f="motto">
          <label for="f-motto" data-i18n="f.motto">Motto</label>
          <div class="in-row"><input id="f-motto" data-f="motto" maxlength="100"></div>
        </div>
      </section>

      <section class="sec">
        <h2 data-i18n="sec.tags">Tags &amp; traits</h2>
        <div class="fld" data-f="tags">
          <div id="tags"></div>
          <div class="in-row">
            <input id="tag-in" maxlength="24">
            <button type="button" class="txt-btn" id="tag-add"></button>
          </div>
        </div>
      </section>

      <section class="sec">
        <h2 data-i18n="sec.style">Card style</h2>
        <div id="styles" role="radiogroup"></div>
      </section>
    </form>

    <!-- Live card -->
    <section id="stage">
      <div id="flip">
        <div class="face front" id="face-front"></div>
        <div class="face back" id="face-back"></div>
      </div>
      <p id="side-label" class="hint"></p>
    </section>
  </main>

  <!-- Share-link viewer (the card from #c=…, view only) -->
  <div id="viewer" hidden>
    <div id="v-flip">
      <div class="face front" id="v-front"></div>
      <div class="face back" id="v-back"></div>
    </div>
    <div class="v-acts">
      <button type="button" class="dlg-btn" id="v-flip-btn"></button>
      <button type="button" class="dlg-btn primary" id="v-open"></button>
    </div>
  </div>

  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="../vendor/jspdf.umd.min.js?v=0.45.14"></script>
  <script src="netizen.js?v=0.45.14"></script>

</body>
</html>
