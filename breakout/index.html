<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Breakout · orOS</title>

  <link rel="stylesheet" href="breakout.css?v=0.47.02">

</head>
<body>

  <!-- Toolbar: one line on a wide screen, two scrolling strips on a phone -->
  <header id="toolbar">
    <div class="tb-row" id="tb-a">
      <div class="seg" id="pow-seg" role="group">
        <button type="button" class="seg-btn" data-pow="1" data-i18n="pow.on">Power-ups</button>
        <button type="button" class="seg-btn" data-pow="0" data-i18n="pow.off">No power-ups</button>
      </div>
    </div>
    <div class="tb-row" id="tb-b">
      <span class="spacer"></span>
      <button type="button" class="icon-btn" id="pause-btn"></button>
      <button type="button" class="icon-btn" id="new-btn"></button>
      <button type="button" class="icon-btn" id="stats-btn"></button>
      <button type="button" class="icon-btn" id="sfx-btn" aria-pressed="false"></button>
    </div>
  </header>

  <!-- Status: score, level + lives, best -->
  <div id="status">
    <span class="stat"><span data-i18n="st.score">Score</span><strong id="score">0</strong></span>
    <span id="turn" aria-live="polite"></span>
    <span class="stat"><strong id="best">0</strong><span data-i18n="st.best">Best</span></span>
  </div>

  <main id="board-wrap">
    <div id="field">
      <canvas id="board" role="img"></canvas>
      <div id="overlay">
        <div id="hint"></div>
        <button type="button" id="start-btn"></button>
        <div id="count" aria-hidden="true"></div>
      </div>
    </div>
  </main>

  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="breakout.js?v=0.47.02"></script>

</body>
</html>
