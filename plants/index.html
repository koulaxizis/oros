<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-jPs7Wy+29lQmKQYOAmSWC7p3UH2QfazTZ9Th79Gtooo='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=plants" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Plant Care · orOS</title>

  <link rel="stylesheet" href="plants.css?v=5.02.00">

</head>
<body>

  <header id="toolbar">
    <div class="tabs" role="tablist">
      <button type="button" class="tab" id="tab-today" role="tab" data-view="today"></button>
      <button type="button" class="tab" id="tab-plants" role="tab" data-view="plants"></button>
    </div>
    <span class="spacer"></span>
    <button type="button" class="icon-btn" id="settings-btn"></button>
    <button type="button" class="txt-btn primary" id="add-btn"></button>
  </header>

  <div id="gardens" class="chips gardens" hidden></div>
  <main id="main">
    <!-- Today: late, today, next 7 days -->
    <section id="view-today" class="view" role="tabpanel" aria-labelledby="tab-today">
      <div id="rooms-today" class="chips" hidden></div>
      <div id="wx-banner" class="banner" hidden></div>
      <div id="today-list"></div>
      <div id="today-empty" class="empty" hidden></div>
    </section>

    <!-- All plants -->
    <section id="view-plants" class="view" role="tabpanel" aria-labelledby="tab-plants" hidden>
      <div class="search-row">
        <input id="search" type="search" autocomplete="off" spellcheck="false">
      </div>
      <div id="rooms-plants" class="chips" hidden></div>
      <div id="plant-grid"></div>
      <div id="plants-empty" class="empty" hidden></div>
    </section>
  </main>

  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="../i18n.js?v=5.02.00" data-app="plants,recordpkg"></script>
  <script src="core.js?v=5.02.00"></script>
  <script src="../household/core.js?v=5.02.00"></script>
  <script src="house.js?v=5.02.00"></script>
  <script src="identify.js?v=5.02.00"></script>
  <script src="../bundle.js?v=5.02.00"></script>
  <script src="../recordpkg.js?v=5.02.00"></script>
  <script src="package.js?v=5.02.00"></script>
  <script src="plants.js?v=5.02.00"></script>

</body>
</html>
