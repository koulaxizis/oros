<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Number Slider · orOS</title>

  <link rel="stylesheet" href="slider.css?v=0.57.00">

</head>
<body>

  <!-- Toolbar: one line on a wide screen, two scrolling strips on a phone -->
  <header id="toolbar">
    <div class="tb-row" id="tb-a">
      <div class="seg" id="size-seg" role="group">
        <button type="button" class="seg-btn" data-size="3">3×3</button>
        <button type="button" class="seg-btn" data-size="4">4×4</button>
        <button type="button" class="seg-btn" data-size="5">5×5</button>
      </div>
    </div>
    <div class="tb-row" id="tb-b">
      <span class="spacer"></span>
      <button type="button" class="icon-btn" id="new-btn"></button>
      <button type="button" class="icon-btn" id="stats-btn"></button>
      <button type="button" class="icon-btn" id="sfx-btn" aria-pressed="false"></button>
    </div>
  </header>

  <!-- Status: moves, hint, time -->
  <div id="status">
    <span class="stat"><span data-i18n="st.moves">Moves</span><strong id="moves">0</strong></span>
    <span id="turn" aria-live="polite"></span>
    <span class="stat"><strong id="time">0:00</strong><span data-i18n="st.time">Time</span></span>
  </div>

  <main id="board-wrap">
    <div id="board"></div>
  </main>

  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="slider.js?v=0.57.00"></script>

</body>
</html>
