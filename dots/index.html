<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-VNJXOAWVSgodmwX0Q+Yjxif8qomeYrA9jZUpg6q6cTI='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=dots" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dots &amp; Boxes · orOS</title>

  <link rel="stylesheet" href="dots.css?v=4.99.00">

</head>
<body>

  <!-- Toolbar: one line on a wide screen, two scrolling strips on a phone -->
  <header id="toolbar">
    <div class="tb-row" id="tb-a">
      <div class="seg" id="mode-seg" role="group">
        <button type="button" class="seg-btn" data-mode="ai" data-i18n="mode.ai">vs Computer</button>
        <button type="button" class="seg-btn" data-mode="duo" data-i18n="mode.duo">2 players</button>
      </div>
      <div class="seg" id="level-seg" role="group">
        <button type="button" class="seg-btn" data-level="e" data-i18n="level.e">Easy</button>
        <button type="button" class="seg-btn" data-level="m" data-i18n="level.m">Medium</button>
        <button type="button" class="seg-btn" data-level="h" data-i18n="level.h">Hard</button>
      </div>
      <button type="button" class="icon-btn" id="new-btn"></button>
    </div>
    <div class="tb-row" id="tb-b">
      <div class="seg" id="size-seg" role="group">
        <button type="button" class="seg-btn" data-size="3">3×3</button>
        <button type="button" class="seg-btn" data-size="4">4×4</button>
        <button type="button" class="seg-btn" data-size="5">5×5</button>
      </div>
      <select id="first-select" aria-label="First move">
        <option value="you" data-i18n="first.you">You start</option>
        <option value="ai" data-i18n="first.ai">Computer starts</option>
        <option value="alt" data-i18n="first.alt">Take turns</option>
      </select>
      <span class="spacer"></span>
      <button type="button" class="icon-btn" id="undo-btn"></button>
      <button type="button" class="icon-btn" id="stats-btn"></button>
      <button type="button" class="icon-btn" id="sfx-btn" aria-pressed="false"></button>
    </div>
  </header>

  <!-- Status: whose turn + boxes of this game -->
  <div id="status">
    <span class="side" id="side0"><i class="disc d1" aria-hidden="true"></i><span id="name0"></span><strong id="score0">0</strong></span>
    <span id="turn" aria-live="polite"></span>
    <span class="side" id="side1"><strong id="score1">0</strong><span id="name1"></span><i class="disc d2" aria-hidden="true"></i></span>
  </div>

  <main id="board-wrap">
    <div id="board"></div>
  </main>

  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="../i18n.js?v=4.99.00" data-app="dots"></script>
  <script src="dots.js?v=4.99.00"></script>

</body>
</html>
