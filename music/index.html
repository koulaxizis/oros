<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-4zP32TFutud9n/g0Db0RO4umEA9XNOoka6UjLe/MkZ8='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- DL-1: a direct link to this app opens it inside the orOS shell -->
  <script>if (window.top === window.self && (!/[?&]standalone\b/.test(location.search) || localStorage.getItem("oros-lock"))) location.replace("../?open=music" + (location.search || location.hash ? "&app-at=" + encodeURIComponent(location.search + location.hash) : ""));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Music · orOS</title>

  <link rel="stylesheet" href="music.css?v=5.02.00">

</head>
<body>

  <header id="toolbar">
    <button type="button" class="icon-btn" id="back-btn" hidden></button>
    <span id="app-name" class="app-name"></span>
    <span class="spacer"></span>
    <button type="button" class="icon-btn" id="add-btn"></button>
    <button type="button" class="icon-btn" id="more-btn"></button>
  </header>

  <nav id="tabs" role="tablist">
    <button type="button" role="tab" data-tab="home"><span class="tab-ic" data-ic="home"></span><span data-i18n="tab.home">Home</span></button>
    <button type="button" role="tab" data-tab="search"><span class="tab-ic" data-ic="search"></span><span data-i18n="tab.search">Search</span></button>
    <button type="button" role="tab" data-tab="lib"><span class="tab-ic" data-ic="lib"></span><span data-i18n="tab.lib">Your library</span></button>
  </nav>

  <main id="main"></main>

  <div id="player" hidden>
    <div class="pl-prog"><div id="pl-prog"></div></div>
    <button type="button" id="pl-open" class="pl-open">
      <span id="pl-art" class="pl-art"></span>
      <span class="pl-text"><span id="pl-title" class="pl-title"></span><span id="pl-sub" class="pl-sub"></span></span>
    </button>
    <button type="button" class="icon-btn" id="pl-like"></button>
    <button type="button" class="icon-btn play" id="pl-play"></button>
    <button type="button" class="icon-btn" id="pl-next"></button>
  </div>

  <div id="drop" hidden><span data-i18n="drop">Drop music files to add them</span></div>
  <div id="toast" role="status"></div>

  <script src="../i18n.js?v=5.02.00" data-app="music"></script>
  <script src="core.js?v=5.02.00"></script>
  <script src="store.js?v=5.02.00"></script>
  <script src="library.js?v=5.02.00"></script>
  <script src="../feeds/core.js?v=5.02.00"></script>
  <script src="../feeds/fetch.js?v=5.02.00"></script>
  <script src="open.js?v=5.02.00"></script>
  <script src="servers.js?v=5.02.00"></script>
  <script src="mixes.js?v=5.02.00"></script>
  <script src="music.js?v=5.02.00"></script>

</body>
</html>
